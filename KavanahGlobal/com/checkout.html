<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout — Kavanah Global</title>
<link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/com.css">
</head>
<body style="background:var(--surface)">
<header style="border-bottom:1px solid var(--line-2);padding:18px 0;background:var(--bg)">
  <div class="wrap row-between">
    <a class="brandmark" href="index.html"><img src="" id="crest" alt=""><span class="bt"><span class="bn">Kavanah Global</span><span class="bs">Let Light Shine</span></span></a>
    <span class="row tiny muted" style="gap:.4rem" data-ico="lock">&nbsp;Secure checkout</span>
  </div>
</header>
<section class="sec-sm"><div class="wrap">
  <div class="steps" id="steps"></div>
  <div class="co-lay">
    <div id="form"></div>
    <div class="co-side" id="side"></div>
  </div>
</div></section>
<footer style="border-top:1px solid var(--line-2);padding:26px 0;margin-top:40px">
  <div class="wrap row-between wrapflex tiny muted">
    <span>© 2026 Kavanah Global · KPG Enterprises LLC</span>
    <span style="display:flex;gap:16px"><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Returns</a></span>
  </div>
</footer>
<script src="../assets/icons.js"></script><script src="../assets/data.js"></script>
<script src="../assets/ui.js"></script><script src="../assets/com.js"></script>
<script>
document.getElementById('crest').src = KG.root + KG.brand.crestFile;
var step=1, pay='card';
var STEPS=['Contact','Delivery','Payment'];
function drawSteps(){
  document.getElementById('steps').innerHTML = STEPS.map(function(s,i){
    var n=i+1, cls = n===step?'on':(n<step?'done':'');
    return '<span class="step '+cls+'"><i>'+(n<step?'':n)+'</i>'+s+'</span>'
      + (i<STEPS.length-1?'<span class="step-sep"></span>':'');
  }).join('');
  document.querySelectorAll('.step.done i').forEach(function(e){ e.innerHTML=ico('check'); });
}
function fld(l,ph,type,id,half){
  return '<div class="field" style="'+(half?'flex:1;min-width:180px':'')+'"><label>'+l+'</label>'
    +'<input class="input" id="'+(id||'')+'" type="'+(type||'text')+'" placeholder="'+ph+'"></div>';
}
function drawForm(){
  var h='';
  if(step===1){
    h='<div class="card card-pad"><h3 style="font-size:1.25rem;margin-bottom:1.1rem">Contact</h3>'
      +'<div class="row" style="gap:12px;align-items:flex-end;margin-bottom:.4rem"><span class="small muted">Already have an account?</span>'
      +'<a class="small" style="color:var(--gold-700);font-weight:600" href="account.html">Sign in</a></div>'
      +fld('Email','you@email.com','email','email')
      +'<div class="row wrapflex" style="gap:12px">'+fld('First name','Maya','text','fn',1)+fld('Last name','Ellison','text','ln',1)+'</div>'
      +fld('Phone (for delivery updates)','(516) 000-0000','tel','ph')
      +'<label class="check" style="margin-top:.4rem"><input type="checkbox" checked><span>Send me the Sunday letter. One email a week, nothing else.</span></label>'
      +'<button class="btn btn-gold btn-lg btn-block" style="margin-top:1.3rem" onclick="go(2)">Continue to delivery '+ico('arrowRight')+'</button></div>';
  }
  if(step===2){
    h='<div class="card card-pad"><h3 style="font-size:1.25rem;margin-bottom:1.1rem">Delivery address</h3>'
      +fld('Address','215 Ditmars Blvd','text','a1')
      +fld('Apartment, suite (optional)','Apt 4B','text','a2')
      +'<div class="row wrapflex" style="gap:12px">'+fld('City','Astoria','text','city',1)
      +'<div class="field" style="flex:1;min-width:140px"><label>State</label><select class="input"><option>New York</option><option>New Jersey</option><option>Connecticut</option><option>California</option></select></div>'
      +fld('ZIP','11105','text','zip',1)+'</div>'
      +'<h4 style="margin:1.4rem 0 .8rem;font-size:1rem">Delivery speed</h4>'
      +[['Standard','2–4 working days','Free over $75, otherwise $6.50',1],
        ['Express','Next working day','$14.00',0],
        ['Pick up in Queens','Astoria house, Mon–Sat','Free',0]].map(function(o,i){
        return '<label class="fopt" style="border:1px solid '+(o[3]?'var(--plum-600)':'var(--line)')+';border-radius:var(--r-sm);padding:.9rem;margin-bottom:8px;background:'+(o[3]?'var(--plum-50)':'var(--surface)')+'">'
        +'<input type="radio" name="ship" '+(o[3]?'checked':'')+'>'
        +'<span><b style="display:block;font-size:.9rem">'+o[0]+'</b><span class="tiny muted">'+o[1]+'</span></span>'
        +'<span class="n" style="font-weight:600;color:var(--ink)">'+o[2]+'</span></label>'; }).join('')
      +'<div class="row" style="gap:10px;margin-top:1.3rem"><button class="btn btn-outline" onclick="go(1)">'+ico('arrowLeft')+'Back</button>'
      +'<button class="btn btn-gold btn-lg" style="flex:1" onclick="go(3)">Continue to payment '+ico('arrowRight')+'</button></div></div>';
  }
  if(step===3){
    h='<div class="card card-pad"><h3 style="font-size:1.25rem;margin-bottom:1.1rem">Payment</h3>'
      +'<div class="pay-tabs">'
      + [['card','Card'],['apple','Apple Pay'],['paypal','PayPal']].map(function(o){
          return '<button class="pay-tab '+(pay===o[0]?'on':'')+'" onclick="setPay(\''+o[0]+'\')">'+o[1]+'</button>'; }).join('')
      +'</div>'
      + (pay==='card'
         ? fld('Card number','4242 4242 4242 4242','text','cc')
           +'<div class="row wrapflex" style="gap:12px">'+fld('Expiry','MM / YY','text','exp',1)+fld('CVC','123','text','cvc',1)+'</div>'
           +fld('Name on card','Maya Ellison','text','con')
         : '<div class="card card-pad center" style="background:var(--surface-2);margin-bottom:1rem"><p class="small muted" style="margin:0">You will be redirected to '+(pay==='apple'?'Apple Pay':'PayPal')+' to confirm.</p></div>')
      +'<label class="check" style="margin:.8rem 0"><input type="checkbox" checked><span>Billing address is the same as delivery</span></label>'
      +'<div class="fundsbox"><span>'+ico('gift')+'</span><div><b>Round up for the .org?</b>'
      +'<p>Add $2.00 and fund a warm breakfast for someone tomorrow morning.</p>'
      +'<label class="check" style="margin-top:.5rem"><input type="checkbox" id="round" onchange="drawSide()"><span>Yes, add $2.00</span></label></div></div>'
      +'<div class="row" style="gap:10px;margin-top:1.3rem"><button class="btn btn-outline" onclick="go(2)">'+ico('arrowLeft')+'Back</button>'
      +'<button class="btn btn-gold btn-lg" style="flex:1" onclick="placeOrder()">'+ico('lock')+'Pay and place order</button></div>'
      +'<p class="tiny muted center" style="margin-top:1rem">This is a demonstration. No card is charged and no data leaves this browser.</p></div>';
  }
  document.getElementById('form').innerHTML=h; U.boot();
}
function drawSide(){
  var items=U.Cart.all(), sub=U.Cart.total(), ship=sub>75?0:6.50, tax=sub*0.08875;
  var round=document.getElementById('round'); var extra=(round&&round.checked)?2:0;
  var funded=U.Cart.fundedSummary();
  document.getElementById('side').innerHTML =
    '<h3 style="font-size:1.15rem;margin-bottom:1rem">'+U.Cart.count()+' item'+(U.Cart.count()===1?'':'s')+'</h3>'
    + (items.length? items.map(function(i){
        var p=KG.byId(KG.products,i.id); if(!p) return '';
        return '<div class="row" style="gap:12px;margin-bottom:14px;align-items:flex-start">'
        +'<div style="position:relative;flex:none"><img src="'+KG.img(p.imgs[0])+'" style="width:58px;height:58px;border-radius:var(--r-sm);object-fit:cover">'
        +'<span style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--plum-700);color:#fff;font-size:.66rem;font-weight:700;display:grid;place-items:center">'+i.q+'</span></div>'
        +'<div style="flex:1;min-width:0"><b style="font-size:.86rem;display:block;line-height:1.3">'+p.name+'</b>'
        +(i.v?'<span class="tiny muted">'+i.v+'</span>':'')+'</div>'
        +'<span style="font-size:.86rem;font-weight:600">'+U.money(p.price*i.q)+'</span></div>'; }).join('')
      : '<p class="small muted">Your bag is empty. <a href="shop.html" style="color:var(--gold-700)">Shop</a></p>')
    +'<hr class="hairline" style="margin:14px 0">'
    +'<div class="sumrow"><span>Subtotal</span><span>'+U.money(sub)+'</span></div>'
    +'<div class="sumrow"><span>Shipping</span><span>'+(ship?U.money(ship):'Free')+'</span></div>'
    +'<div class="sumrow"><span>NY sales tax</span><span>'+U.money(tax)+'</span></div>'
    +(extra?'<div class="sumrow" style="color:var(--gold-700)"><span>Round-up donation</span><span>'+U.money(extra)+'</span></div>':'')
    +'<div class="sumrow total"><span>Total</span><span>'+U.money(sub+ship+tax+extra)+'</span></div>'
    +(funded.length?'<div class="funds" style="margin-top:1rem">'+ico('flame')+'Funds '+funded.join(', ')+'</div>':'');
  U.boot();
}
function go(n){ step=n; drawSteps(); drawForm(); drawSide(); window.scrollTo({top:0,behavior:'smooth'}); }
function setPay(p){ pay=p; drawForm(); }
function placeOrder(){
  var sub=U.Cart.total(), ship=sub>75?0:6.50, tax=sub*0.08875;
  var round=document.getElementById('round'); var extra=(round&&round.checked)?2:0;
  U.LS.set('lastorder',{total:sub+ship+tax+extra, items:U.Cart.all(), funded:U.Cart.fundedSummary(), extra:extra});
  U.Cart.clear();
  location.href='order.html';
}
window.go=go; window.setPay=setPay; window.placeOrder=placeOrder; window.drawSide=drawSide;
drawSteps(); drawForm(); drawSide();
</script>
</body></html>
