<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account — Kavanah Global</title>
<link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/com.css">
</head>
<body>
<div id="hdr-slot"></div>
<section style="background:var(--grad-plum);color:var(--gold-100);padding:44px 0 40px;position:relative;overflow:hidden" class="night">
  <div class="glow" style="top:-200px;right:-100px"></div>
  <div class="wrap row-between wrapflex" style="position:relative;z-index:2">
    <div class="row" style="gap:18px">
      <span id="ava"></span>
      <div><h1 style="font-size:clamp(1.8rem,3.2vw,2.4rem);margin-bottom:.2rem">Maya Ellison</h1>
      <p style="margin:0;color:rgba(249,239,212,.7);font-size:.9rem">Member since March 2026 · <span class="badge badge-dark">Practitioner on .org</span></p></div>
    </div>
    <a class="btn btn-outline-gold" href="../org/dashboard.html">Go to my .org dashboard<span data-ico="arrowUpRight"></span></a>
  </div>
</section>
<section class="sec-sm"><div class="wrap">
  <div class="tabs" id="tabs" style="margin-bottom:30px"></div>
  <div id="pane"></div>
</div></section>
<div id="ftr-slot"></div>
<script src="../assets/icons.js"></script><script src="../assets/data.js"></script>
<script src="../assets/ui.js"></script><script src="../assets/com.js"></script>
<script>
COM.boot('');
document.getElementById('ava').innerHTML=U.avatar(KG.user.name,64);
var TABS=[['orders','Orders'],['impact','My impact'],['saved','Saved'],['addr','Addresses'],['prof','Profile']];
var cur='orders';
function drawTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(function(t){
    return '<button class="tab '+(t[0]===cur?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'; }).join('');
}
function pane(){
  var h='';
  if(cur==='orders'){
    h='<div class="grid" style="gap:14px">'+KG.user.orders.map(function(o){
      return '<div class="card card-pad"><div class="row-between wrapflex" style="margin-bottom:1rem">'
      +'<div><b style="display:block;font-size:1.05rem">'+o.id+'</b><span class="small muted">'+o.date+'</span></div>'
      +'<div class="row" style="gap:10px"><span class="badge badge-ok">'+o.status+'</span>'
      +'<b>'+U.money(o.total)+'</b></div></div>'
      +'<div class="row wrapflex" style="gap:8px;margin-bottom:1rem">'
      + KG.products.slice(0,o.items).map(function(p){ return '<img src="'+KG.img(p.imgs[0])+'" style="width:54px;height:54px;border-radius:var(--r-sm);object-fit:cover">'; }).join('')
      +'</div>'
      +'<div class="funds" style="margin:0">'+ico('flame')+'This order funded '+o.funded+'</div>'
      +'<div class="row" style="gap:8px;margin-top:1rem"><button class="btn btn-outline btn-sm" onclick="U.toast(\'Tracking view\',\'truck\')">Track</button>'
      +'<button class="btn btn-outline btn-sm" onclick="U.toast(\'Items added to your bag\',\'cart\')">Buy again</button>'
      +'<button class="btn btn-ghost btn-sm" onclick="U.toast(\'Invoice downloaded\',\'download\')">Invoice</button></div></div>';
    }).join('')+'</div>';
  }
  if(cur==='impact'){
    h='<div class="card card-pad lux" style="background:linear-gradient(140deg,var(--gold-100),var(--plum-50));margin-bottom:20px;text-align:center;padding:36px">'
      +'<span style="color:var(--gold-700)">'+ico('flame')+'</span>'
      +'<h2 style="margin:.6rem 0 .4rem">Your orders have funded</h2>'
      +'<p class="small muted" style="max-width:40ch;margin:0 auto 1.6rem">Across three orders since March.</p>'
      +'<div class="grid g3" style="gap:14px">'
      +[['bed','14','Nights of shelter'],['coffee','9','Warm breakfasts'],['book','6','Class seats']].map(function(x){
        return '<div class="card card-pad" style="background:rgba(255,255,255,.75)"><span style="color:var(--gold-700)">'+ico(x[0])+'</span>'
        +'<div style="font-family:\'Cormorant Garamond\',serif;font-size:2.4rem;font-weight:600;color:var(--plum-800);line-height:1;margin-top:.3rem" data-count="'+x[1]+'">0</div>'
        +'<div class="tiny muted">'+x[2]+'</div></div>'; }).join('')+'</div></div>'
      +'<div class="card card-pad"><h3 style="font-size:1.15rem;margin-bottom:1rem">Ledger</h3>'
      + KG.user.orders.map(function(o){
        return '<div class="row-between" style="padding:.8rem 0;border-bottom:1px solid var(--line-2)">'
        +'<div><b class="small" style="display:block">'+o.id+'</b><span class="tiny muted">'+o.date+'</span></div>'
        +'<span class="small" style="color:var(--gold-700);font-weight:600">'+o.funded+'</span></div>'; }).join('')
      +'<a class="btn btn-outline btn-sm" style="margin-top:1.2rem" href="impact.html">See the full impact report</a></div>';
  }
  if(cur==='saved'){
    var w=U.Wish.all();
    h = w.length
      ? '<div class="pgrid g4" style="grid-template-columns:repeat(4,1fr)">'+w.map(function(id){ var p=KG.byId(KG.products,id); return p?COM.pcard(p):''; }).join('')+'</div>'
      : '<div class="card card-pad center" style="padding:60px"><span style="color:var(--gold-400)">'+ico('heart')+'</span><h3 style="margin:.8rem 0 .4rem">Nothing saved yet</h3><p class="muted small">Tap the heart on any product to keep it here.</p><a class="btn btn-gold btn-sm" style="margin-top:1rem" href="shop.html">Browse the shop</a></div>';
  }
  if(cur==='addr'){
    h='<div class="grid g2">'
      +[['Home','Maya Ellison','215 Ditmars Blvd, Apt 4B','Astoria, NY 11105','(516) 000-0000',1],
        ['Work','Maya Ellison','48 Wall Street, Floor 11','New York, NY 10005','(516) 000-0000',0]].map(function(a){
        return '<div class="card card-pad"><div class="row-between" style="margin-bottom:.8rem">'
        +'<b>'+a[0]+'</b>'+(a[5]?'<span class="badge badge-gold">Default</span>':'')+'</div>'
        +'<p class="small" style="color:var(--ink-2);line-height:1.7;margin:0">'+a[1]+'<br>'+a[2]+'<br>'+a[3]+'<br>'+a[4]+'</p>'
        +'<div class="row" style="gap:8px;margin-top:1rem"><button class="btn btn-outline btn-sm" onclick="U.toast(\'Edit address\',\'edit\')">Edit</button>'
        +'<button class="btn btn-ghost btn-sm" onclick="U.toast(\'Address removed\',\'trash\')">Remove</button></div></div>'; }).join('')
      +'<button class="card card-pad center" style="border-style:dashed;min-height:180px;display:grid;place-items:center" onclick="U.toast(\'New address form\',\'plus\')">'
      +'<span><span style="color:var(--gold-600)">'+ico('plus')+'</span><b style="display:block;margin-top:.5rem">Add an address</b></span></button></div>';
  }
  if(cur==='prof'){
    h='<div class="grid g2"><div class="card card-pad"><h3 style="font-size:1.15rem;margin-bottom:1.1rem">Your details</h3>'
      +'<div class="field"><label>Name</label><input class="input" value="Maya Ellison"></div>'
      +'<div class="field"><label>Email</label><input class="input" value="maya@example.com"></div>'
      +'<div class="field"><label>Phone</label><input class="input" value="(516) 000-0000"></div>'
      +'<button class="btn btn-gold" onclick="U.toast(\'Details saved\',\'check\')">Save changes</button></div>'
      +'<div><div class="card card-pad" style="margin-bottom:16px"><h3 style="font-size:1.15rem;margin-bottom:1rem">Email preferences</h3>'
      + [['The Sunday letter',1],['Order updates',1],['New products',0],['Programme announcements from the .org',1]].map(function(p){
        return '<label class="check" style="padding:.55rem 0"><input type="checkbox" '+(p[1]?'checked':'')+'><span>'+p[0]+'</span></label>'; }).join('')
      +'</div>'
      +'<div class="card card-pad lux" style="background:var(--grad-plum);color:var(--gold-100)">'
      +'<span class="eyebrow no-rule" style="color:var(--gold-400)">Linked account</span>'
      +'<h3 style="color:#fff;font-size:1.2rem;margin-bottom:.5rem">Practitioner on kavanahglobal.org</h3>'
      +'<p style="font-size:.88rem;color:rgba(249,239,212,.75);line-height:1.6;margin-bottom:1rem">$39/month · renews 12 September 2026 · includes 15% off everything in this shop.</p>'
      +'<a class="btn btn-gold btn-sm" href="../org/membership.html">Manage membership</a></div></div></div>';
  }
  document.getElementById('pane').innerHTML=h;
  U.boot(); U.reveal(); U.Wish.sync();
}
window.go=function(t){ cur=t; drawTabs(); pane(); };
drawTabs(); pane();
</script>
</body></html>
