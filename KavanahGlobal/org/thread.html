<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thread — Kavanah Global</title>
<link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/com.css"><link rel="stylesheet" href="../assets/org.css">
</head>
<body>
<div class="oshell">
  <div id="rail-slot"></div>
  <div class="omain">
    <div id="top-slot"></div>
    <div class="obody">
      <div class="grid" style="grid-template-columns:1fr 300px;gap:26px;align-items:start" id="cols">
        <div id="main"></div>
        <div id="side"></div>
      </div>
    </div>
  </div>
</div>
<script src="../assets/icons.js"></script><script src="../assets/data.js"></script>
<script src="../assets/ui.js"></script><script src="../assets/com.js"></script><script src="../assets/org.js"></script>
<script>
var t = KG.byId(KG.threads, U.qs('t')) || KG.threads[0];
var c = KG.byId(KG.circles, t.circle);
var extra = [];
document.title = t.title + ' — Kavanah Global';

function replyBlock(r){
  return '<div class="reply">'+U.avatar(r.a,40)
  +'<div class="reply-b"><div class="row" style="gap:8px;margin-bottom:.35rem;flex-wrap:wrap">'
  +'<b style="font-size:.9rem">'+r.a+'</b>'
  +(r.badge?'<span class="guidebadge">'+r.badge+'</span>':'')
  +'<span class="tiny muted">'+r.ago+'</span></div>'
  + r.b.split('\n\n').map(function(p){ return '<p class="small" style="color:var(--ink-2);line-height:1.75;margin:0 0 .7rem">'+U.esc(p)+'</p>'; }).join('')
  +'<div class="row" style="gap:4px">'
  +'<button class="btn btn-ghost btn-xs" onclick="this.classList.toggle(\'on\');U.toast(\'Held\',\'thumb\')">'+ico('thumb')+' '+r.likes+'</button>'
  +'<button class="btn btn-ghost btn-xs" onclick="document.getElementById(\'rp\').focus()">Reply</button>'
  +'<button class="btn btn-ghost btn-xs" onclick="U.toast(\'Reported to a moderator\',\'flag\')">Report</button>'
  +'</div></div></div>';
}

function draw(){
  document.getElementById('main').innerHTML=
    '<div class="tiny muted" style="margin-bottom:.8rem"><a href="community.html">Community</a> / <a href="community.html?c='+c.id+'">'+c.name+'</a></div>'
    +'<div class="card card-pad rv" style="margin-bottom:18px">'
    +'<div class="row" style="gap:8px;margin-bottom:.7rem;flex-wrap:wrap">'
    +'<span class="badge badge-plum">'+c.name+'</span>'
    +(t.pinned?'<span class="badge badge-gold">Pinned</span>':'')
    +(c.locked?'<span class="badge" style="background:var(--surface-2);color:var(--ink-3)">'+ico('lock')+'Private circle</span>':'')+'</div>'
    +'<h1 style="font-size:clamp(1.7rem,2.8vw,2.3rem);margin-bottom:1rem">'+t.title+'</h1>'
    +'<div class="row" style="gap:12px;margin-bottom:1.4rem">'+U.avatar(t.author,44)
    +'<div><b style="display:block;font-size:.94rem">'+t.author+'</b>'
    +'<span class="tiny muted">Posted '+t.ago+' · member since 2026</span></div></div>'
    + t.body.split('\n\n').map(function(p){ return '<p style="line-height:1.85;color:var(--ink-2);margin:0 0 1.1rem;font-size:1.02rem">'+U.esc(p)+'</p>'; }).join('')
    +'<div class="row wrapflex" style="gap:6px;margin-top:1.4rem;padding-top:1.2rem;border-top:1px solid var(--line-2)">'
    +'<button class="btn btn-outline btn-sm" onclick="this.classList.toggle(\'on\');U.toast(\'Held\',\'thumb\')">'+ico('thumb')+'Hold this ('+t.likes+')</button>'
    +'<button class="btn btn-ghost btn-sm" onclick="document.getElementById(\'rp\').focus()">'+ico('message')+'Reply</button>'
    +'<button class="btn btn-ghost btn-sm" onclick="U.toast(\'Saved to your bookmarks\',\'bookmark\')">'+ico('bookmark')+'Save</button>'
    +'<button class="btn btn-ghost btn-sm" onclick="U.toast(\'Reported to a moderator\',\'flag\')">'+ico('flag')+'Report</button>'
    +'</div></div>'

    +'<div class="card card-pad rv" style="margin-bottom:18px">'
    +'<h3 style="font-size:1.2rem;margin-bottom:.4rem">'+(t.reps.length+extra.length)+' replies</h3>'
    +'<p class="tiny muted" style="margin-bottom:.6rem">No advice unless it is asked for. "Read" is a complete reply.</p>'
    + extra.map(replyBlock).join('')
    + t.reps.map(replyBlock).join('')
    +'</div>'

    +'<div class="card card-pad rv">'
    +'<div class="row" style="gap:12px;align-items:flex-start">'+U.avatar(KG.user.handle,40)
    +'<div style="flex:1"><textarea class="input" id="rp" placeholder="Say what you actually think. Or just write: read."></textarea>'
    +'<div class="row-between wrapflex" style="margin-top:.7rem;gap:10px">'
    +'<span class="tiny muted">Replying as '+KG.user.handle+' in '+c.name+'</span>'
    +'<div class="row" style="gap:8px">'
    +'<button class="btn btn-outline btn-sm" onclick="quick(\'Read.\')">Just say "read"</button>'
    +'<button class="btn btn-gold" onclick="post()">Post reply</button></div></div></div></div></div>';

  document.getElementById('side').innerHTML=
    '<div class="card card-pad rv" style="margin-bottom:16px">'
    +'<img src="'+KG.img(c.img)+'" alt="" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r-sm);margin-bottom:1rem">'
    +'<h4 style="font-size:1.15rem;margin-bottom:.35rem">'+c.name+'</h4>'
    +'<p class="small muted" style="line-height:1.6;margin-bottom:1rem">'+c.blurb+'</p>'
    +'<div class="row-between small" style="padding:.4rem 0;border-top:1px solid var(--line-2)"><span class="muted">Members</span><b>'+c.members.toLocaleString()+'</b></div>'
    +'<div class="row-between small" style="padding:.4rem 0;border-top:1px solid var(--line-2)"><span class="muted">Posts</span><b>'+c.posts.toLocaleString()+'</b></div>'
    +(c.prog?'<a class="btn btn-outline btn-sm btn-block" style="margin-top:1rem" href="program.html?g='+KG.byId(KG.programs,c.prog).slug+'">See the programme</a>':'')
    +'</div>'
    +'<div class="card card-pad rv" style="margin-bottom:16px"><h4 style="font-size:1.05rem;margin-bottom:.8rem">Also in this circle</h4>'
    + KG.threads.filter(function(x){ return x.circle===c.id && x.id!==t.id; }).concat(KG.threads.filter(function(x){return x.id!==t.id})).slice(0,4).map(function(x){
      return '<a style="display:block;padding:.6rem 0;border-bottom:1px solid var(--line-2)" href="thread.html?t='+x.id+'">'
      +'<b class="small" style="display:block;line-height:1.35;margin-bottom:.15rem">'+x.title+'</b>'
      +'<span class="tiny muted">'+x.replies+' replies · '+x.ago+'</span></a>'; }).join('')
    +'</div>'
    +'<div class="card card-pad rv"><div class="care crisis" style="margin:0"><span data-ico="alert"></span>'
    +'<span><b>If this is urgent.</b> Call 911, or call or text 988 for the Suicide &amp; Crisis Lifeline. This circle is peer support, and nobody here is a clinician.</span></div></div>';
  U.boot(); U.reveal();
}
function post(){
  var v=document.getElementById('rp').value.trim();
  if(!v){ U.toast('Write something first','alert'); return; }
  extra.unshift({a:KG.user.handle,ago:'just now',likes:0,b:v});
  U.toast('Posted as '+KG.user.handle,'send'); draw();
}
function quick(v){ document.getElementById('rp').value=v; post(); }
window.post=post; window.quick=quick;

ORG.bootApp('community', c.name, t.title,
  '<a class="btn btn-outline btn-sm" href="community.html">'+ico('arrowLeft')+'All circles</a>');
draw();
if(window.innerWidth<1050) document.getElementById('cols').style.gridTemplateColumns='1fr';
</script>
</body></html>
