<script>
/* ==========================================================
   APEX business portal · demo interaction layer
   ========================================================== */
const ico  = (n,s=18) => `<svg width="${s}" height="${s}"><use href="#i-${n}"/></svg>`;
const esc  = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money= n => '£' + n.toFixed(2);
const ME   = 'rosewood';                       // the business signed in for this demo

function hash(str, seed){
  let h = (seed === undefined ? 2166136261 : seed) >>> 0;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619) >>> 0; }
  return h >>> 0;
}
function makeCode(id){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ';
  const h1 = hash('apex-code-'+id), h2 = hash('apex-code-'+id, 3221225473);
  return `APX-${A[h1%24]}${A[(h1>>>9)%24]}${(h1>>>18)%10}${(h1>>>24)%10}-${h2%10}${(h2>>>8)%10}${(h2>>>16)%10}${(h2>>>24)%10}`;
}

/* ---------- state ---------- */
const me = biz(ME);
let W = {
  page:'dashboard',
  deals: dealsOf(ME).map(d => ({...d, unlocked: 40 + hash(d.id)%160, redeemed: 12 + hash(d.id+'r')%70, live:true })),
  posts: postsOf(ME).map(p => ({...p})),
  redemptions: [],
  adType:'placement', adMonths:1, adLive:null,
  candidates:[
    { name:'Priya Raman',    img:'assets/img/person-1.jpg', role:'j01', when:'2 hours ago',  note:'6 years colour experience, NVQ Level 3, currently in Balham.' },
    { name:'Marcus Ellery',  img:'assets/img/person-4.jpg', role:'j01', when:'Yesterday',    note:'Salon manager looking to return to the chair. Colour trained at Sassoon.' },
    { name:'Aoife Brennan',  img:'assets/img/person-3.jpg', role:'j01', when:'3 days ago',   note:'Four years in a Soho salon, strong balayage portfolio.' }
  ]
};
/* live member codes this business can be shown at the counter */
const LIVE_CODES = MEMBER.wallet
  .filter(w => deal(w.deal) && deal(w.deal).biz === ME)
  .map(w => ({...w}));

const el = id => document.getElementById(id);
function wtoast(msg, icon='check'){
  const t = document.createElement('div');
  t.className = 'wtoast'; t.innerHTML = ico(icon,17) + `<span>${esc(msg)}</span>`;
  el('wtoasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 280); }, 2600);
}
function openModal(html){ const m = el('modal'); m.className='modalwrap on'; m.innerHTML = `<div class="scrim" data-closemodal></div><div class="modal">${html}</div>`; }
function closeModal(){ const m = el('modal'); m.className='modalwrap'; m.innerHTML=''; }

/* ==========================================================
   PAGES
   ========================================================== */
const PAGES = {};

const META = {
  dashboard:{ t:'Dashboard', s:'How Apex members are finding and using your offers' },
  verify:   { t:'Verify a code', s:'Confirm a member’s deal code before you apply the discount' },
  deals:    { t:'My deals', s:'Offers you are running for Apex members' },
  posts:    { t:'Announcements', s:'Post to the members who follow you' },
  network:  { t:'Apex Network', s:'Your roles and the members who registered interest' },
  ads:      { t:'Advertising', s:'Put your listing in front of more members' },
  profile:  { t:'Business profile', s:'What members see when they open your page' }
};
const TOPACT = {
  deals:'<button class="btn btn-primary btn-sm" data-newdeal>'+ico('plus',15)+' Create a deal</button>',
  posts:'<button class="btn btn-primary btn-sm" data-focuspost>'+ico('plus',15)+' New announcement</button>',
  network:'<button class="btn btn-primary btn-sm" data-newrole>'+ico('plus',15)+' Post a role</button>'
};

/* ---------------- DASHBOARD ---------------- */
PAGES.dashboard = () => {

        <h2>${esc(me.name)}</h2>

          <span class="badge badge-verified">${ico('check',10)} Verified ${esc(me.verified)}</span>

    <input class="codeinput" id="qcode" placeholder="APX-0000-0000" maxlength="13" autocomplete="off">
    <button class="btn btn-gold" data-verify="qcode">Verify code</button>
  </div>
  <div id="qresult"></div>

  <div class="webhead" style="margin-top:0">
    <div class="g"><div class="eyebrow2">Last thirty days</div><div class="t">How you are trading</div></div>
  </div>
  <div class="grid g4" style="margin-bottom:8px">
    <div class="stat"><div class="k">Profile views</div><div class="v tnum">1,284</div>
      <div class="d up">${ico('up',12)} 18% this month</div>${spark([28,34,31,45,42,58,54,66,72,68,84,92])}</div>
    <div class="stat"><div class="k">Deals unlocked</div><div class="v tnum">${totUnlock}</div>
      <div class="d up">${ico('up',12)} 42 this week</div>${spark([22,30,26,38,44,40,56,62,58,74,80,88])}</div>
    <div class="stat accent"><div class="k">Codes redeemed</div><div class="v tnum">${totRedeem}</div>
      <div class="d up">${conv}% conversion</div>${spark([18,24,20,32,29,41,38,50,47,62,70,78], true)}</div>
    <div class="stat"><div class="k">Followers</div><div class="v tnum">${me.followers.toLocaleString()}</div>
      <div class="d up">${ico('up',12)} 31 this week</div>${spark([40,44,42,52,56,54,64,68,72,78,84,90])}</div>
  </div>

  <div class="webhead">
    <div class="g"><div class="eyebrow2">What members respond to</div><div class="t">Your offers, ranked</div></div>
    <button class="btn btn-ghost btn-sm a" data-nav="deals">Manage deals</button>
  </div>
  <div class="grid g2" style="margin-bottom:18px">

      <div class="hd"><h3>Unlocks by deal</h3><span class="grow"></span>

      <div class="bd"><div class="barrow">
        ${W.deals.map(d => `<div class="b">
          <span class="nm" title="${esc(d.title)}"><b style="color:var(--gold)">${esc(d.value)}</b> ${esc(d.title)}</span>
          <span class="tr"><i data-w="${Math.round(d.unlocked/maxU*100)}%" style="width:0"></i></span>
          <span class="vv tnum">${d.unlocked}</span></div>`).join('')}
      </div></div>
    </div>
    <div class="card">
      <div class="hd"><h3>Member activity</h3><span class="grow"></span><span class="pill">12 weeks</span></div>
      <div class="bd">
        <div class="mini" style="height:96px">
          ${[24,31,28,42,38,55,49,64,58,72,68,88].map((h,i) =>
            `<span class="${i>8?'hi':''}" style="height:${h}%;animation-delay:${i*45}ms"></span>`).join('')}
        </div>
        <div style="display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-3);font-weight:700;margin-top:10px">
          <span>Jun</span><span>Jul</span><span>Aug</span></div>
        <p style="font-size:.8rem;color:var(--ink-2);margin-top:14px;line-height:1.6">
          Members who follow you unlock <b>3.4&times;</b> more of your deals than members who don't.</p>
      </div>

  </div>

  <div class="webhead">
    <div class="g"><div class="eyebrow2">At the counter</div><div class="t">Recent redemptions</div></div>
    <button class="btn btn-ghost btn-sm a" data-nav="verify">Verify a code</button>
  </div>
  <div class="card">
    <div class="tblwrap"><table class="tbl">
      <tr><th>Member</th><th>Deal</th><th>Code</th><th>Saved</th><th>When</th></tr>
      ${(W.redemptions.length ? W.redemptions : []).map(r => `<tr>
        <td><span class="thumbcell" style="min-width:0"><img src="${MEMBER.avatar}" alt=""><b>${esc(MEMBER.name)}</b></span></td>
        <td>${esc(deal(r.deal).title)}</td><td class="num">${r.code}</td>
        <td class="num">${money(r.saved)}</td><td>Just now</td></tr>`).join('')}
      ${[['Priya Raman','person-1','Any colour service, midweek','APX-4RD2-8890',38.00,'Today, 11:24'],
         ['Tom Whitfield','person-6','Gloss treatment with any cut','APX-8KM5-1207',22.00,'Today, 10:02'],
         ['Aoife Brennan','person-3','Student Tuesdays','APX-2JQ7-4415',9.50,'Yesterday, 16:47'],
         ['Nadia Osei','person-8','Any colour service, midweek','APX-6BT9-3328',41.00,'Yesterday, 14:15'],
         ['Marcus Ellery','person-4','Gloss treatment with any cut','APX-3WN4-7761',22.00,'17 Aug, 15:30']]
        .map(([n,img,dl,code,save,when]) => `<tr>
          <td><span class="thumbcell" style="min-width:0"><img src="assets/img/${img}.jpg" alt=""><b>${n}</b></span></td>
          <td>${dl}</td><td class="num">${code}</td><td class="num">${money(save)}</td><td>${when}</td></tr>`).join('')}
    </table></div>
  </div>`;
};

/* ---------------- VERIFY ---------------- */

      <div class="card">
        <div class="hd"><h3>Verify a member's deal code</h3></div>
        <div class="bd">
          <label class="field">
            <span class="lb">Deal code</span>
            <input class="codeinput" id="vcode" placeholder="APX-0000-0000" maxlength="13" autocomplete="off" style="width:100%">
            <span class="hint">The member shows you this in the Apex app. Codes are unique to one member and one deal.</span>
          </label>
          <button class="btn btn-primary btn-block" data-verify="vcode">${ico('shield',16)} Verify code</button>
        </div>
      </div>
      <div id="vresult"></div>
    </div>
    <div class="card">
      <div class="hd"><h3>Live codes for your deals</h3></div>
      <div class="bd" style="padding-top:14px">
        <p style="font-size:.81rem;color:var(--ink-2);line-height:1.6;margin-bottom:14px">
          For this demonstration, these are real codes a member is holding in the app right now.
          Type one in to see the verification.</p>
        ${LIVE_CODES.map(w => {
          const d = deal(w.deal);
          return `<button class="choice" style="margin-bottom:10px;padding:14px" data-usecode="${w.code}">
            <div style="display:flex;align-items:center;gap:12px">
              <span style="font-family:var(--serif);font-size:1.3rem;color:var(--gold)">${esc(d.value)}</span>
              <span style="flex:1"><span style="display:block;font-size:.83rem;font-weight:700">${esc(d.title)}</span>
                <span style="font-size:.75rem;color:var(--ink-3);font-weight:700;letter-spacing:.1em">${w.code}</span></span>
              ${ico('right',16)}
            </div></button>`;
        }).join('') || `<div class="emptyw"><p>No live codes right now.</p></div>`}
        <div style="background:var(--sunk);border-radius:var(--r-md);padding:14px;margin-top:6px">
          <p style="font-size:.78rem;color:var(--ink-2);line-height:1.6">
            Try <b>APX-0000-0000</b> to see how an invalid code is handled.</p>
        </div>
      </div>
    </div>
  </div>`;

/* ---------------- DEALS ---------------- */

  <div class="card">
    <div class="hd"><h3>${W.deals.length} deals</h3><span class="grow"></span>
      <span class="pill">${W.deals.filter(d=>d.live).length} live</span>
      <button class="btn btn-primary btn-sm" data-newdeal>${ico('plus',15)} Create a deal</button></div>
    <div class="tblwrap"><table class="tbl">
      <tr><th>Deal</th><th>Status</th><th>Unlocked</th><th>Redeemed</th><th>Rate</th><th>Ends</th><th></th></tr>
      ${W.deals.map(d => `<tr>
        <td><span class="thumbcell"><img src="${d.img}" alt="">
          <span><b style="display:block">${esc(d.title)}</b>
          <span style="font-size:.74rem;color:var(--gold);font-weight:800">${esc(d.value)}</span></span></span></td>
        <td>${d.live ? (d.ending ? '<span class="badge badge-ends">Ends soon</span>' : '<span class="badge badge-live">Live</span>')
                     : '<span class="badge badge-ad">Paused</span>'}</td>
        <td class="num">${d.unlocked}</td><td class="num">${d.redeemed}</td>
        <td class="num">${Math.round(d.redeemed/d.unlocked*100)}%</td>
        <td>${esc(d.ends)}</td>
        <td><button class="btn btn-ghost btn-sm" data-toggledeal="${d.id}">${d.live?'Pause':'Resume'}</button></td>

  <div class="grid g2" style="margin-top:18px">

      <div class="barrow">
        <div class="b"><span class="nm">Percentage off</span><span class="tr"><i data-w="88%" style="width:0"></i></span><span class="vv">88%</span></div>
        <div class="b"><span class="nm">Two for one</span><span class="tr"><i data-w="74%" style="width:0"></i></span><span class="vv">74%</span></div>
        <div class="b"><span class="nm">Free add-on</span><span class="tr"><i data-w="61%" style="width:0"></i></span><span class="vv">61%</span></div>
        <div class="b"><span class="nm">Fixed amount off</span><span class="tr"><i data-w="47%" style="width:0"></i></span><span class="vv">47%</span></div>

    </div></div>
    <div class="card"><div class="hd"><h3>Your share of member spend</h3></div><div class="bd">

      </div>
      <p style="font-size:.8rem;color:var(--ink-2);line-height:1.6">

        <b>28% more per visit</b> than walk-ins because the discount is applied at the till, not before.</p>
      <div class="mini" style="margin-top:18px">
        ${[38,45,41,58,52,66,72,64,80,76,88,94].map((h,i)=>`<span class="${i>7?'hi':''}" style="height:${h}%;animation-delay:${i*40}ms"></span>`).join('')}
      </div>
    </div></div>
  </div>`;

/* ---------------- POSTS ---------------- */
PAGES.posts = () => `
  <div class="card" style="margin-bottom:18px">
    <div class="hd"><h3>Post to your ${me.followers.toLocaleString()} followers</h3></div>

/* ---------------- NETWORK ---------------- */
PAGES.network = () => {

  ${roles.map(j => `

        <div style="font-size:.9rem;font-weight:800">Hiring is included in your listing</div>

/* ==========================================================
   VERIFY LOGIC
   ========================================================== */
function lookupCode(raw){
  const code = raw.trim().toUpperCase();
  if(!/^APX-[A-Z0-9]{4}-\d{4}$/.test(code)) return { state:'malformed' };
  const held = MEMBER.wallet.find(w => w.code === code);
  if(held){
    const d = deal(held.deal);
    if(d.biz !== ME) return { state:'wrongbiz', biz:biz(d.biz), d };
    if(held.status === 'redeemed') return { state:'used', d, w:held };
    return { state:'ok', d, w:held };
  }
  const owned = dealsOf(ME).find(d => makeCode(d.id) === code);
  if(owned) return { state:'ok', d:owned, w:{ code, saved:0, on:'19 Aug 2026' } };
  const any = DEALS.find(d => makeCode(d.id) === code);
  if(any) return { state:'wrongbiz', biz:biz(any.biz), d:any };
  return { state:'invalid' };
}
function renderVerify(res, code){
  if(res.state === 'ok'){
    const saving = res.w.saved || 30;
    return `<div class="vresult ok">
      <div class="top"><span class="mk">${ico('check',24)}</span>
        <div><div class="h">Valid code &mdash; apply the discount</div>
          <div class="p">Active Apex member &middot; code has not been used</div></div></div>
      <div class="panel">
        <div class="memberchip"><img src="${MEMBER.avatar}" alt="">
          <div><div style="font-size:.88rem;font-weight:800">${esc(MEMBER.name)}</div>
            <div style="font-size:.75rem;color:var(--ink-3);font-weight:600">Apex Standard &middot; member since March 2026</div></div>
        </div>
        <div class="kv"><span class="k">Deal</span><span class="v">${esc(res.d.title)}</span></div>
        <div class="kv"><span class="k">Discount to apply</span>
          <span class="v" style="color:var(--gold);font-family:var(--serif);font-size:1.25rem">${esc(res.d.value)}</span></div>
        <div class="kv"><span class="k">Code</span><span class="v tnum">${code}</span></div>
        <div class="kv"><span class="k">Unlocked</span><span class="v">${esc(res.w.on)}</span></div>
        <div class="kv"><span class="k">Valid until</span><span class="v">${esc(res.d.ends)}</span></div>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:16px"
        data-redeem="${code}" data-deal="${res.d.id}" data-saved="${saving}">
        ${ico('check',16)} Mark as redeemed</button>
    </div>`;
  }
  if(res.state === 'used') return `<div class="vresult used">
      <div class="top"><span class="mk">${ico('clock',22)}</span>
        <div><div class="h">This code has already been used</div>
          <div class="p" style="color:var(--ink-2)">Redeemed on ${esc(res.w.on)}</div></div></div>
      <div class="panel"><div class="kv"><span class="k">Deal</span><span class="v">${esc(res.d.title)}</span></div>
        <div class="kv"><span class="k">Code</span><span class="v tnum">${esc(res.w.code)}</span></div></div>
      <p style="font-size:.8rem;color:var(--ink-2);margin-top:14px;line-height:1.55">
        Each code can only be redeemed once. Do not apply the discount again.</p>
    </div>`;
  if(res.state === 'wrongbiz') return `<div class="vresult bad">
      <div class="top"><span class="mk">${ico('x',22)}</span>
        <div><div class="h">This code is for another business</div>
          <div class="p">Issued for ${esc(res.biz.name)}</div></div></div>
      <p style="font-size:.8rem;color:var(--ink-2);line-height:1.55">
        Codes only work at the business that created the deal. Do not apply a discount.</p></div>`;
  if(res.state === 'malformed') return `<div class="vresult bad">
      <div class="top"><span class="mk">${ico('x',22)}</span>
        <div><div class="h">That doesn't look like an Apex code</div>
          <div class="p">Codes are in the format APX-XXXX-0000</div></div></div></div>`;
  return `<div class="vresult bad">
      <div class="top"><span class="mk">${ico('x',22)}</span>
        <div><div class="h">Code not recognised</div>
          <div class="p">No active member holds this code</div></div></div>
      <p style="font-size:.8rem;color:var(--ink-2);line-height:1.55">
        Ask the member to reopen the deal in their Apex app and read the code again. Do not apply a discount.</p></div>`;
}

/* ==========================================================

function paint(){
  const m = META[W.page];
  el('ptitle').textContent = m.t;
  el('psub').textContent = m.s;
  el('topact').innerHTML = TOPACT[W.page] || '';
  el('content').innerHTML = PAGES[W.page]();
  document.querySelectorAll('.side .nav').forEach(b => b.classList.toggle('on', b.dataset.nav === W.page));
  requestAnimationFrame(() => document.querySelectorAll('[data-w]').forEach(i => i.style.width = i.dataset.w));
  window.scrollTo({top:0, behavior:'smooth'});
}
function nav(p){ W.page = p; paint(); }

document.addEventListener('click', e => {

  if(!t) return;
  const d = t.dataset;

  if(d.closemodal !== undefined){ closeModal(); return; }
  if(d.nav){ nav(d.nav); return; }

  if(d.verify){
    const inp = el(d.verify), code = inp.value.trim().toUpperCase();
    const host = el(d.verify === 'qcode' ? 'qresult' : 'vresult');
    if(!code){ inp.classList.add('err'); inp.focus(); setTimeout(()=>inp.classList.remove('err'),1200); return; }
    const res = lookupCode(code);
    inp.classList.toggle('err', res.state !== 'ok');
    host.innerHTML = renderVerify(res, code);
    host.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  if(d.usecode){
    nav('verify');
    setTimeout(() => { const i = el('vcode'); i.value = d.usecode; i.focus();
      el('vresult').innerHTML = renderVerify(lookupCode(d.usecode), d.usecode); }, 60);
    return;
  }
  if(d.redeem){
    const held = MEMBER.wallet.find(w => w.code === d.redeem);
    if(held) held.status = 'redeemed';
    W.redemptions.unshift({ code:d.redeem, deal:d.deal, saved:parseFloat(d.saved) });
    const dl = W.deals.find(x => x.id === d.deal); if(dl) dl.redeemed++;
    closeModal();
    el(W.page === 'verify' ? 'vresult' : 'qresult').innerHTML =
      `<div class="vresult ok"><div class="top"><span class="mk">${ico('check',24)}</span>
        <div><div class="h">Redeemed</div><div class="p">Discount applied and logged against this deal</div></div></div>

    wtoast('Code redeemed and logged');
    return;
  }
  if(d.toggledeal){
    const dl = W.deals.find(x => x.id === d.toggledeal); dl.live = !dl.live;
    paint(); wtoast(dl.live ? 'Deal is live again' : 'Deal paused — members can no longer unlock it');
    return;
  }
  if(d.newdeal !== undefined){
    openModal(`<div class="mh"><h3>Create a deal</h3><button class="btn btn-ghost btn-sm" data-closemodal>${ico('x',15)}</button></div>
      <div class="mb">
        <div class="row2">
          <label class="field"><span class="lb">Offer type</span>
            <select class="sel" id="ndtype"><option>Percentage off</option><option>Fixed amount off</option>
              <option>Two for one</option><option>Free add-on</option></select></label>
          <label class="field"><span class="lb">Value</span><input class="inp" id="ndval" placeholder="e.g. 25% OFF"></label>
        </div>
        <label class="field"><span class="lb">Headline</span>
          <input class="inp" id="ndtitle" placeholder="Any colour service, midweek">
          <span class="hint">This is what members see on the card. Say what they get, not how generous you are.</span></label>
        <label class="field"><span class="lb">Terms</span>
          <textarea class="ta" id="ndterms" placeholder="When it applies, what it excludes, any booking requirement…"></textarea></label>
        <div class="row2">
          <label class="field"><span class="lb">Ends</span><input class="inp" id="ndends" value="30 Sept"></label>
          <label class="field"><span class="lb">Limit per member</span>
            <select class="sel"><option>Once</option><option>Once a month</option><option>Unlimited</option></select></label>
        </div>
      </div>
      <div class="mf"><button class="btn btn-ghost" data-closemodal>Cancel</button>
        <button class="btn btn-primary" data-createdeal>Create deal</button></div>`);
    return;
  }
  if(d.createdeal !== undefined){
    const v = (el('ndval').value || '20% OFF').toUpperCase();
    const ti = el('ndtitle').value || 'New member offer';
    W.deals.unshift({ id:'new'+W.deals.length, biz:ME, value:v, title:ti, ends:el('ndends').value || '30 Sept',
      img:me.img, terms:el('ndterms').value || 'Standard terms apply.', unlocked:0, redeemed:0, live:true });
    closeModal(); nav('deals'); wtoast('Deal created — it is live for members now');
    return;
  }
  if(d.focuspost !== undefined){ nav('posts'); setTimeout(()=>el('postbox').focus(),80); return; }
  if(d.post !== undefined){
    const v = el('postbox').value.trim();
    if(!v){ el('postbox').focus(); return; }
    W.posts.unshift({ id:'np'+W.posts.length, biz:ME, time:'Just now', text:v });
    paint(); wtoast(`Published to ${me.followers.toLocaleString()} followers`, 'mega');
    return;
  }
  if(d.newrole !== undefined){
    openModal(`<div class="mh"><h3>Post a role</h3><button class="btn btn-ghost btn-sm" data-closemodal>${ico('x',15)}</button></div>
      <div class="mb">
        <label class="field"><span class="lb">Job title</span><input class="inp" placeholder="Senior Colour Technician"></label>
        <div class="row2">
          <label class="field"><span class="lb">Type</span><select class="sel"><option>Full time</option><option>Part time</option><option>Self-employed</option></select></label>
          <label class="field"><span class="lb">Pay</span><input class="inp" placeholder="£32,000 – £38,000"></label>
        </div>
        <label class="field"><span class="lb">About the role</span><textarea class="ta" placeholder="What the job involves and who it suits…"></textarea></label>
        <div style="background:var(--harbor-tint);border-radius:var(--r-md);padding:14px">

            there are no applications or messaging inside Apex.</p></div>
      </div>
      <div class="mf"><button class="btn btn-ghost" data-closemodal>Cancel</button>
        <button class="btn btn-primary" data-closemodal>Post role</button></div>`);
    return;
  }
  if(d.adtype){ W.adType = d.adtype; paint(); return; }
  if(d.admonths){ W.adMonths = Math.min(2, Math.max(1, W.adMonths + parseInt(d.admonths))); paint(); return; }
  if(d.buyad !== undefined){
    const price = W.adType === 'placement' ? 120 : 75;

  if(d.contact){ wtoast(`${d.contact}'s contact details copied`, 'users'); return; }
  if(d.cv){ wtoast(`Opening ${d.cv}'s Apex Network profile`, 'user'); return; }
});
