<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal posting & errors - Non-PO Portal</title>
<link rel="stylesheet" href="../assets/airtel.css">
</head>
<body>
<script src="../assets/kit.js"></script>
<script src="../assets/page.js"></script>
<script src="pa-data.js"></script>
<script>
(function () {
  var S = Page.state(), mgr = S === 'manager';
  var flow = UI.flow({ items: [
    { label: 'Staging', text: '18,486 journals', state: 'done' }, { label: 'Validated', text: '18,485 passed', state: 'done' },
    { label: 'GL interface', text: '18,485 inserted', state: 'done' }, { label: 'Journal Import', text: '1 rejected', state: 'current' },
    { label: 'Posted in Oracle EBS', text: mgr ? '3 batches waiting' : '18,431 posted' }] });

  var batches = UI.table({ dense: true, columns: [{ key: 'b', label: 'Batch (group ID)' }, { key: 'src', label: 'Source' }, { key: 'cat', label: 'Category' }, { key: 'n', label: 'Journals', num: true }, { key: 'amt', label: 'Amount (Rs)', num: true, money: true }, { key: 'seg', label: 'RPT / YEP' }, { key: 'st', label: 'Status' }],
    rows: [
      { b: 'NPP-26-10-0004<div class="k-muted k-small">01-Oct 10:12</div>', src: 'DARTS (TOCO)', cat: 'Provisional', n: '18,419', amt: 468231400, seg: 'Non-RPT', st: UI.status('Imported - waiting to post') },
      { b: 'NPP-26-10-0003<div class="k-muted k-small">01-Oct 08:30</div>', src: 'Portal approvals', cat: 'Related party provision', n: '6', amt: 21750000, seg: 'RPT', st: UI.status('Imported - waiting to post') },
      { b: 'NPP-26-10-0002<div class="k-muted k-small">01-Oct 08:30</div>', src: 'Portal approvals', cat: 'Provisional', n: '54', amt: 61022500, seg: 'Non-RPT', st: UI.status('Imported - waiting to post') },
      { b: 'NPP-26-09-0118<div class="k-muted k-small">30-Sep 21:05</div>', src: 'Portal approvals', cat: 'Provisional', n: '1', amt: 2140000, seg: 'Non-RPT', st: UI.status('Rejected by Journal Import'), _flag: true },
      { b: 'NPP-26-09-0117<div class="k-muted k-small">30-Sep 20:40</div>', src: 'Actualization', cat: 'Adjustment', n: '12', amt: 3412000, seg: 'Non-RPT', st: UI.status('Posted', 'ok') + '<div class="k-small">GL-26-0930118</div>' }] });

  var ep = PA.find('131·410455·CCSVC002·SEP-26');   // the provision rejected by Journal Import (pa-data.js)
  var errors = UI.table({ dense: true, columns: [{ key: 'urn', label: 'URN' }, { key: 'amt', label: 'Amount (Rs)', num: true, money: true }, { key: 'err', label: 'Oracle reason' }, { key: 'fix', label: 'Correction' }, { key: '_acts', label: '' }],
    rows: [{ urn: '<span class="k-urn">131·410455·CCSVC002·SEP-26</span><div class="k-muted k-small">Batch NPP-26-09-0118</div>', amt: 2140000, err: UI.esc(ep.error), fix: S === 'error' ? UI.field({ type: 'select', value: 'Use the active account combination for BU 131' }) : 'Correct the account combination and retry', _flag: true,
      _acts: [{ icon: 'sync', label: 'Retry - keyed by URN so it cannot post twice', toast: 'Retry queued for the next import run' }, { icon: 'eye', label: 'Open provision', go: 'pa-09-provision-detail.html?urn=' + encodeURIComponent(ep.urn) }] }] });

  var recon = UI.table({ dense: true, pager: false, export: false, columns: [{ key: 'd', label: 'Check (daily)' }, { key: 'p', label: 'Platform', num: true }, { key: 'o', label: 'Oracle', num: true }, { key: 'r', label: 'Result' }],
    rows: [{ d: 'Journals posted - 30-Sep', p: '18,442', o: '18,442', r: UI.result('pass', 'Matched') }, { d: 'Value posted - 30-Sep (Rs)', p: '46,91,48,900.00', o: '46,91,48,900.00', r: UI.result('pass', 'Matched') },
      { d: 'Document numbers stored', p: '18,442', o: '18,442', r: UI.result('pass', 'Matched') }, { d: 'Journals in interface not imported', p: '1', o: '1', r: UI.result('warn', 'In error queue') }] });

  Page.render({
    id: 'pa-10', user: mgr ? 'B0GPM031' : 'B0GPA204', role: mgr ? 'GPA manager' : 'GPA analyst', viewAs: mgr ? 'GPA manager' : 'GPA analyst',
    states: [{ id: 'error', label: 'Correcting an error' }, { id: 'manager', label: 'As GPA manager' }],
    html: UI.page({ title: 'Journal Posting', info: 'Journals reach Oracle GL through staging, the GL interface and Journal Import; GPA managers review and post them in Oracle EBS', sub: 'Every approved provision, actualization, prepaid and reversal journal the platform sends to Oracle, and its status read back from Oracle: imported, rejected with the Oracle reason, or posted with its document number. Journals are posted in Oracle EBS, not on the platform.' }) +
      flow + (mgr ? UI.alert({ tone: 'info', title: '3 batches imported and waiting to be posted in Oracle EBS.', text: 'Review and post them in Oracle; posting is the final control gate. The posted status and document numbers come back to the platform with the journal status.' }) : '') +
      UI.tabs({ id: 'jp', tabs: [
        { id: 'batches', label: 'Batches', count: 5, body: [UI.filters({ items: [UI.field({ label: 'Date', type: 'select', value: 'Last 2 days' }), UI.field({ label: 'Source', type: 'select', value: 'All' }), UI.field({ label: 'Status', type: 'select', value: 'All' })] }), batches] },
        { id: 'errors', label: 'Error queue', count: 1, body: [errors, UI.p('Corrected journals are retried without double posting: each journal is keyed by its URN.', { muted: true, small: true })] },
        { id: 'recon', label: 'Daily reconciliation', body: [recon] }], active: S === 'error' ? 'errors' : 'batches' }) +
      UI.note({ text: 'Posting is not done on the platform. The platform writes journals to its staging tables; a database package validates them, inserts them into the GL interface with a group ID per batch and submits Journal Import. GPA managers review and post the imported journals in Oracle EBS. The platform reads back the import result, the posted status and the document number by group ID (HLD 6.3).' }) +
      UI.tbc('Journal status from Oracle: how often the platform reads the import result, the posted status and the document numbers')
  });
})();
</script>
</body>
</html>
