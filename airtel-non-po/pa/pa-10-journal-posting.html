<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal posting & errors - Non-PO Portal</title>
<link rel="stylesheet" href="../assets/airtel.css">
</head>
<body>
<script src="../assets/kit.js"></script>
<script src="../assets/page.js"></script>
<script src="pa-data.js"></script>
<script>
(function () {
  var S = Page.state(), mgr = S === 'manager';
  var flow = UI.flow({ items: [
    { label: 'Staging', text: '18,486 journals', state: 'done' }, { label: 'Validated', text: '18,485 passed', state: 'done' },
    { label: 'GL interface', text: '18,485 inserted', state: 'done' }, { label: 'Journal Import', text: '1 rejected', state: 'current' },
    { label: 'Posted by GPA manager', text: mgr ? '3 batches waiting' : '18,431 posted' }] });

  var batches = UI.table({ dense: true, select: mgr, columns: [{ key: 'b', label: 'Batch (group ID)' }, { key: 'src', label: 'Source' }, { key: 'cat', label: 'Category' }, { key: 'n', label: 'Journals', num: true }, { key: 'amt', label: 'Amount (Rs)', num: true, money: true }, { key: 'seg', label: 'RPT / YEP' }, { key: 'st', label: 'Status' }],
    rows: [
      { b: 'NPP-26-10-0004<div class="k-muted k-small">01-Oct 10:12</div>', src: 'DARTS (TOCO)', cat: 'Provisional', n: '18,419', amt: 468231400, seg: 'Non-RPT', st: UI.status(mgr ? 'Imported - waiting to post' : 'Imported') },
      { b: 'NPP-26-10-0003<div class="k-muted k-small">01-Oct 08:30</div>', src: 'Portal approvals', cat: 'Related party provision', n: '6', amt: 21750000, seg: 'RPT', st: UI.status(mgr ? 'Imported - waiting to post' : 'Imported') },
      { b: 'NPP-26-10-0002<div class="k-muted k-small">01-Oct 08:30</div>', src: 'Portal approvals', cat: 'Provisional', n: '54', amt: 61022500, seg: 'Non-RPT', st: UI.status(mgr ? 'Imported - waiting to post' : 'Imported') },
      { b: 'NPP-26-09-0118<div class="k-muted k-small">30-Sep 21:05</div>', src: 'Portal approvals', cat: 'Provisional', n: '1', amt: 2140000, seg: 'Non-RPT', st: UI.status('Rejected by Journal Import'), _flag: true },
      { b: 'NPP-26-09-0117<div class="k-muted k-small">30-Sep 20:40</div>', src: 'Actualization', cat: 'Adjustment', n: '12', amt: 3412000, seg: 'Non-RPT', st: UI.status('Posted', 'ok') + '<div class="k-small">GL-26-0930118</div>' }] });

  var errors = UI.table({ dense: true, columns: [{ key: 'urn', label: 'URN' }, { key: 'amt', label: 'Amount (Rs)', num: true, money: true }, { key: 'err', label: 'Oracle reason' }, { key: 'fix', label: 'Correction' }, { key: '_acts', label: '' }],
    rows: [{ urn: '<span class="k-urn">131·410455·CCSVC002·SEP-26</span><div class="k-muted k-small">Batch NPP-26-09-0118</div>', amt: 2140000, err: 'EM29 - GL period SEP-26 closed for ledger AIRTEL_IN_LEDGER', fix: S === 'error' ? UI.field({ type: 'select', value: 'Re-date to OCT-26 (open)' }) : 'Re-date to OCT-26 and retry', _flag: true,
      _acts: [{ icon: 'sync', label: 'Retry - keyed by URN so it cannot post twice', toast: 'Retry queued for the next import run' }, { icon: 'eye', label: 'Open provision', go: 'pa-09' }] }] });

  var recon = UI.table({ dense: true, pager: false, export: false, columns: [{ key: 'd', label: 'Check (daily)' }, { key: 'p', label: 'Platform', num: true }, { key: 'o', label: 'Oracle', num: true }, { key: 'r', label: 'Result' }],
    rows: [{ d: 'Journals posted - 30-Sep', p: '18,442', o: '18,442', r: UI.result('pass', 'Matched') }, { d: 'Value posted - 30-Sep (Rs)', p: '46,91,48,900.00', o: '46,91,48,900.00', r: UI.result('pass', 'Matched') },
      { d: 'Document numbers stored', p: '18,442', o: '18,442', r: UI.result('pass', 'Matched') }, { d: 'Journals in interface not imported', p: '1', o: '1', r: UI.result('warn', 'In error queue') }] });

  Page.render({
    id: 'pa-10', user: mgr ? 'B0GPM031' : 'B0GPA204', role: mgr ? 'GPA manager' : 'GPA analyst', viewAs: mgr ? 'GPA manager' : 'GPA analyst',
    states: [{ id: 'error', label: 'Correcting an error' }, { id: 'manager', label: 'GPA manager posting' }],
    html: UI.page({ title: 'Journal Posting', info: 'Journals reach Oracle GL through staging, the GL interface and Journal Import; the GPA manager posts them', sub: 'Every approved provision, actualization, prepaid and reversal journal, from staging to posted. Rejected rows wait here with the Oracle reason.' }) +
      flow + (mgr ? UI.alert({ tone: 'info', title: '3 batches imported and waiting to be posted.', text: 'Posting in Oracle is the final control gate. Select the batches you have reviewed.', actions: [UI.button({ label: 'Post selected batches', variant: 'primary', size: 'sm', toast: 'Posting submitted in Oracle - document numbers will sync back' })] }) : '') +
      UI.tabs({ id: 'jp', tabs: [
        { id: 'batches', label: 'Batches', count: 5, body: [UI.filters({ items: [UI.field({ label: 'Date', type: 'select', value: 'Last 2 days' }), UI.field({ label: 'Source', type: 'select', value: 'All' }), UI.field({ label: 'Status', type: 'select', value: 'All' })] }), batches] },
        { id: 'errors', label: 'Error queue', count: 1, body: [errors, UI.p('Corrected journals are retried without double posting: each journal is keyed by its URN.', { muted: true, small: true })] },
        { id: 'recon', label: 'Daily reconciliation', body: [recon] }], active: S === 'error' ? 'errors' : 'batches' })
  });
})();
</script>
</body>
</html>
