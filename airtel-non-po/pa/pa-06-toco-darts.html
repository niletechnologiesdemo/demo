<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOCO / DARTS provisions - Non-PO Portal</title>
<link rel="stylesheet" href="../assets/airtel.css">
</head>
<body>
<script src="../assets/kit.js"></script>
<script src="../assets/page.js"></script>
<script src="pa-data.js"></script>
<script>
(function () {
  // Feed lines and debit-note provisions come from pa-data.js. Default: the Sep-26 feed was sent to Oracle on 01-Oct 10:12 (batch NPP-26-10-0004);
  // the "Before sending to Oracle" state shows the same feed when it arrived on 30-Sep 22:40
  var S = Page.state(), ready = S === 'ready', rs = function (n) { return 'Rs ' + UI.inr(n, 2); };
  var link = function (p) { return '<a class="k-link k-urn" href="pa-09-provision-detail.html?urn=' + encodeURIComponent(p.key) + '">' + UI.esc(p.key).replace(/·/g, '·<wbr>') + '</a>'; };
  var SEG = { '412885': 'Indus', '412902': 'Other TOCO', '': 'Owned' };
  var feed = PA.provisions.filter(function (p) { return p.source === 'DARTS' && p.month === 'SEP-26'; });
  var rows = feed.map(function (p) {
    return { site: UI.esc(p.site) + '<div class="k-muted k-small">Locator ' + p.locator + ' &middot; parent BU ' + p.bu + '</div>', v: '<div class="w-200">' + UI.esc(p.vcode ? p.vendor : 'Own site (' + p.lease + ')') + '</div><div class="k-muted k-small">' + SEG[p.vcode] + '</div>',
      n: UI.esc(p.activity.itemDesc) + '<div class="k-muted k-small">' + p.item + '</div>', urn: link(p), amt: p.amount,
      st: ready ? UI.status('Ready', 'grey') : UI.status('Imported - waiting to post') + '<div class="k-muted k-small">' + p.gl.batch + '</div>' };
  }).concat([{ site: 'UPE-12118-0044<div class="k-muted k-small">Locator 12118 &middot; parent BU not found</div>', v: '<div class="w-200">Indus Towers Ltd</div><div class="k-muted k-small">Indus</div>',
    n: 'Site electricity - AOR<div class="k-muted k-small">ELEC-AOR</div>', urn: '<span class="k-muted">Not built: the locator has no parent BU</span>', amt: 98210, st: UI.status('Error') + '<div class="k-small">Locator 12118 not mapped to a parent BU</div>', _flag: true }]);
  var feedTable = UI.table({ dense: true, select: ready, columns: [{ key: 'site', label: 'Site' }, { key: 'v', label: 'TOCO / segment' }, { key: 'n', label: 'Nature' }, { key: 'urn', label: 'URN (with locator)' }, { key: 'amt', label: 'Amount (Rs)', num: true, money: true }, { key: 'st', label: 'Status' }], rows: rows, total: rows.length + ' of 18,420 site lines' });

  // debit-note provisions: created when a ToCo DN is validated in Non-PO Invoicing, reversed when its reversal is validated
  var dns = PA.provisions.filter(function (p) { return p.dn; });
  var dn = UI.table({ dense: true, pager: false, columns: [{ key: 'dn', label: 'Debit note' }, { key: 'urn', label: 'Provision URN' }, { key: 'amt', label: 'Amount (Rs)', num: true, money: true }, { key: 'ev', label: 'Event from invoicing' }, { key: 'st', label: 'Provision' }],
    rows: dns.map(function (p) {
      var rev = p.status === 'Reversed', ref = rev ? 'NPO-2627-004797' : p.dnv[1];
      return { dn: UI.esc(p.dn) + '<div class="k-muted k-small">' + UI.esc(p.vendor) + '</div>', urn: link(p), amt: p.amount,
        ev: (rev ? 'DN reversal validated 25-Sep-2026' : 'ToCo DN validated ' + p.dnv[0].slice(0, 11)) + '<div class="k-small"><a class="k-link" href="../inv/inv-11-invoice-detail.html?ref=' + ref + '">' + ref + '</a></div>', st: UI.status(p.status, PA.statusTone(p.status)) };
    }).concat([{ dn: 'GTL/AP/DUPLICATE/JUL26/DN<div class="k-muted k-small">GTL Infrastructure Ltd</div>', urn: '<span class="k-muted">Created when the DN is validated</span>', amt: 6895,
      ev: 'Under approval in invoicing<div class="k-small"><a class="k-link" href="../inv/inv-11-invoice-detail.html?ref=NPO-2627-004844">NPO-2627-004844</a></div>', st: UI.status('Not yet created', 'grey') }]) });

  var postModal = UI.modal({ id: 'post', title: 'Send to', accent: 'Oracle', size: 'narrow', body: [UI.kv({ cols: 2, items: [['Site lines', '18,419 ready (1 with error held back)'], ['Amount', 'Rs 46,82,31,400.00'], ['Month', 'SEP-26'], ['Journal', 'Provisional, reversal mode, per site URN']] }),
    UI.p('Lines are written to the Oracle GL interface and imported as one batch; GPA managers review and post it in Oracle EBS. A line is picked again next time only if it was not processed successfully in ERP (status synced back to the portal).', { muted: true, small: true })],
    foot: [UI.button({ label: 'Cancel', variant: 'text', close: true }), UI.button({ label: 'Send to Oracle', variant: 'primary', state: 'none' })] });

  Page.render({
    id: 'pa-06', user: 'B0GPA204', role: 'GPA analyst', viewAs: 'GPA analyst',
    states: [{ id: 'ready', label: 'Before sending to Oracle' }],
    html: UI.page({ title: 'TOCO', accent: 'Provisions', info: 'Tower company rent, electricity and diesel, raised per site from DARTS', sub: 'Provisions are calculated in DARTS and arrive per site in the platform format. Review them here and send them to Oracle; GPA managers post them in Oracle EBS.' }) +
      UI.kpis({ cols: 5, items: [{ value: '18,420', label: 'Site lines - Sep-26', tab: 'tc:feed', active: true }, { value: 'Rs 46.8 Cr', label: 'Feed value' }, { value: '1', label: 'Lines with errors' },
        { value: String(dns.length), label: 'Debit-note provisions', sub: dns.filter(function (p) { return p.open; }).length + ' open', tab: 'tc:dn' }, { value: '2', label: 'Leases on hold', tab: 'tc:hold' }] }) +
      UI.tabs({ id: 'tc', bar: false, tabs: [
        { id: 'feed', body: [UI.filters({ items: [UI.field({ label: 'Month', type: 'select', value: 'Sep-2026' }), UI.field({ label: 'Segment', type: 'select', value: 'All (Indus, Other TOCO, TNG, Owned, Homes)' }), UI.field({ label: 'Nature', type: 'select', value: 'Rent, electricity, diesel' }), UI.field({ label: 'Status', type: 'select', value: 'All' })] }),
          ready ? UI.alert({ tone: 'info', text: 'DARTS feed received 30-Sep-2026 22:40. Data comes from DARTS (Metabase) in the platform format.', actions: [UI.button({ label: 'Send to Oracle', variant: 'primary', size: 'sm', modal: 'post' })] })
            : UI.alert({ tone: 'ok', title: 'Sent to Oracle.', text: '18,419 site lines sent to the Oracle GL interface on 01-Oct-2026 10:12 by B0GPA204, imported as batch NPP-26-10-0004 and waiting for the GPA manager to review and post them in Oracle EBS (status on Journal posting & errors).' }),
          feedTable, UI.tbc('TOCO manual override: the two scenarios to be defined by the business (HLD open point 9)')] },
        { id: 'dn', body: [UI.p('When a TOCO debit note is validated in Non-PO Invoicing, a provision is created with the DN number in its URN; when the DN reversal is validated, the provision is reversed. Month-end activity, driven by the TOCO debit note master.', { muted: true }), dn,
          UI.tbc('TOCO debit-note provisions: rules, master and the inputs from invoicing (HLD open point 8)')] },
        { id: 'hold', body: [UI.table({ dense: true, pager: false, columns: [{ key: 'l', label: 'Lease' }, { key: 's', label: 'Site' }, { key: 'd', label: 'Scheduled payment' }, { key: 'r', label: 'Hold reason (PM lease module)' }],
          rows: [{ l: 'LSE-OWN-13102', s: 'KA-13102-0910 (Owned)', d: '05-Oct-2026 &middot; Rs 64,000.00', r: 'Landlord bank details under verification' }, { l: 'LSE-HOM-14077', s: 'MH-14077-0118 (Homes)', d: '05-Oct-2026 &middot; Rs 18,500.00', r: 'Agreement renewal pending' }] }),
          UI.tbc('Owned and Homes leases: lease payment data and hold handling from the PM lease module (HLD open point 10)')] }] }) + postModal
  });
})();
</script>
</body>
</html>
