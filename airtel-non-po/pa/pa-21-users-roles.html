<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users, roles & access - Non-PO Portal</title>
<link rel="stylesheet" href="../assets/airtel.css">
</head>
<body>
<script src="../assets/kit.js"></script>
<script src="../assets/page.js"></script>
<script src="pa-data.js"></script>
<script>
(function () {
  var users = UI.table({ dense: true, columns: [{ key: 'u', label: 'User (from SSO)' }, { key: 'r', label: 'Roles' }, { key: 's', label: 'Data scope' }, { key: 'm', label: 'Manager (HRMS)' }, { key: 'st', label: 'Status' }, { key: '_acts', label: '' }],
    rows: [
      { u: 'B0MKR412<div class="k-muted k-small">Admin & Facilities</div>', r: 'Business user (maker)', s: 'BAL &middot; BU 111, 131 &middot; Admin & Facilities', m: 'B0CHK155', st: UI.status('Active', 'ok'), _acts: ['edit'] },
      { u: 'B0CHK155<div class="k-muted k-small">Admin & Facilities</div>', r: 'Manager (checker)', s: 'BAL &middot; BU 111, 131', m: 'B0CHK090', st: UI.status('Active', 'ok'), _acts: ['edit'] },
      { u: 'B0GPA204<div class="k-muted k-small">GPA</div>', r: 'GPA analyst &middot; master owner', s: 'All entities &middot; all BUs', m: 'B0GPM031', st: UI.status('Active', 'ok'), _acts: ['edit'] },
      { u: 'B0GPM031<div class="k-muted k-small">GPA</div>', r: 'GPA manager (posting)', s: 'All entities', m: 'B0CTR001', st: UI.status('Active', 'ok'), _acts: ['edit'] },
      { u: 'B0CFR007<div class="k-muted k-small">CFR</div>', r: 'CFR', s: 'All entities', m: 'B0CTR001', st: UI.status('Active', 'ok'), _acts: ['edit'] },
      { u: 'B0CHK201<div class="k-muted k-small">Network Operations</div>', r: 'Manager (checker)', s: 'BAL &middot; BU 121-129', m: 'B0CHK090', st: UI.status('On leave - delegated to B0CHK155 until 05-Oct'), _acts: ['edit'] }] });
  var roles = UI.table({ dense: true, pager: false, columns: [{ key: 'r', label: 'Role' }, { key: 'can', label: 'Can' }, { key: 'cannot', label: 'Cannot' }],
    rows: [{ r: 'Business user (maker)', can: 'Raise, edit and resubmit provisions; bulk upload; request force closure', cannot: 'Approve own provisions' },
      { r: 'Manager (checker)', can: 'Approve, return or reject provisions routed by HRMS / DOA', cannot: 'Approve a provision they raised' },
      { r: 'Business finance', can: 'Rule-based inputs (scenarios 2-12), review, financial flash', cannot: 'Post journals' },
      { r: 'GPA analyst', can: 'Matching, force match, holds, PBR run, masters, error queue', cannot: 'Post journals in Oracle' },
      { r: 'GPA manager', can: 'Post imported journals in Oracle (final control gate)', cannot: 'Raise provisions they post' },
      { r: 'CFR', can: 'Approve new provisions (new item / BU / OU / GL), force closure, force reversal, holds', cannot: '-' },
      { r: 'AIO', can: 'Update VTM subscriber counts', cannot: 'Raise or approve provisions' },
      { r: 'Audit', can: 'Read reports and the audit trail', cannot: 'Change anything' }] });
  Page.render({
    id: 'pa-21', user: 'B0ADM001', role: 'Portal administrator', viewAs: 'Portal administrator',
    html: UI.page({ title: 'Users', accent: 'Roles & Access', sub: 'Users sign in with single sign-on. Roles and data scope (entity, BU, cost centre, department) are assigned here; managers and approvers come from HRMS and the DOA matrix.' }) +
      UI.alert({ tone: 'warn', title: 'To confirm:', text: 'which users get admin or super-admin rights (P2P team), and the access controls to be checked with GRC.' }) +
      UI.tabs({ id: 'ur', tabs: [{ id: 'users', label: 'Users', count: 6, body: [UI.filters({ items: [UI.field({ label: 'Role', type: 'select', value: 'All roles' }), UI.field({ label: 'Entity', type: 'select', value: 'All' }), UI.field({ label: 'User', type: 'search', placeholder: 'OLM ID or name' })] }), users] },
        { id: 'roles', label: 'Roles & segregation of duties', body: [roles, UI.p('Self-approval is blocked everywhere, and every override is logged.', { muted: true, small: true })] }] })
  });
})();
</script>
</body>
</html>
