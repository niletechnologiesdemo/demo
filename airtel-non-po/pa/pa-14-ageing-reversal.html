<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ageing, reversal & year-end - Non-PO Portal</title>
<link rel="stylesheet" href="../assets/airtel.css">
</head>
<body>
<script src="../assets/kit.js"></script>
<script src="../assets/page.js"></script>
<script src="pa-data.js"></script>
<script>
(function () {
  var S = Page.state(), ran = S === 'run';
  var buckets = UI.chart({ type: 'column', title: 'Open provisions by ageing bucket', unit: 'Rs lakh', categories: ['0-30 days', '31-60 days', '61-90 days', 'Over 90 days'], series: [{ name: 'Open balance', data: [91.3, 174.6, 0, 65.2] }], fmt: function (v) { return UI.inr(v, 1); } });
  var esc = UI.table({ dense: true, pager: false, export: false, columns: [{ key: 't', label: 'Age reached' }, { key: 'w', label: 'Escalated to' }, { key: 'n', label: 'Provisions', num: true }, { key: 'v', label: 'Balance (Rs)', num: true, money: true }],
    rows: [{ t: '90 days', w: 'Business user', n: '2', v: 3875000 }, { t: '180 days', w: 'Manager', n: '1', v: 1950000 }, { t: '270 days', w: 'CFR', n: '1', v: 760000 }, { t: '365 days', w: 'Controller / ACE', n: '0', v: 0 }] });

  var pbr = UI.table({ dense: true, select: !ran, columns: [{ key: 'u', label: 'URN' }, { key: 'v', label: 'Vendor' }, { key: 'm', label: 'Month' }, { key: 'b', label: 'Balance (Rs)', num: true, money: true }, { key: 'a', label: 'Outcome at close of Sep-26' }],
    rows: [
      { u: '<span class="k-urn">121·410022·SECURITY001·AUG-25</span>', v: 'SecureOne Facility Services', m: 'Aug-25', b: 410000, a: ran ? UI.status('Reversed', 'grey') : 'Reverse (beyond 13 months)' },
      { u: '<span class="k-urn">111·410455·CCSVC002·AUG-25</span>', v: 'Vertex Call Solutions', m: 'Aug-25', b: 1880000, a: ran ? UI.status('Reversed', 'grey') : 'Reverse' },
      { u: '<span class="k-urn">141·410387·AMCDG004·AUG-25</span>', v: 'Prism Power Systems', m: 'Aug-25', b: 690000, a: UI.status('On hold - excluded') + '<div class="k-small">Vendor dispute (CFR approved)</div>' },
      { u: '<span class="k-urn">101·510044·GOVLIC01·AUG-25</span>', v: 'Department of Telecommunications', m: 'Aug-25', b: 2500000, a: UI.status('Excluded - Government vendor', 'grey') }] });

  var force = UI.table({ dense: true, columns: [{ key: 'r', label: 'Request' }, { key: 'u', label: 'URN' }, { key: 'b', label: 'Balance (Rs)', num: true, money: true }, { key: 'why', label: 'Reason' }, { key: 's', label: 'Status' }],
    rows: [{ r: 'Force closure CFR-26-0114', u: '<span class="k-urn">131·410612·LEGAL007·FEB-26</span>', b: 300000, why: 'Matter withdrawn - no invoice expected', s: UI.status('Waiting for CFR') },
      { r: 'Force reversal CFR-26-0112', u: '<span class="k-urn">121·410455·CCSVC002·APR-26</span>', b: 1980000, why: 'Disputed - billed under a new contract', s: UI.status('Waiting for CFR') },
      { r: 'Force closure CFR-26-0098', u: '<span class="k-urn">131·410612·LEGAL007·JAN-26</span>', b: 300000, why: 'Matter withdrawn', s: UI.status('Force closed', 'grey') }] });

  var hits = UI.table({ dense: true, columns: [{ key: 'i', label: 'Invoice' }, { key: 'v', label: 'Vendor' }, { key: 'p', label: 'Service period' }, { key: 'a', label: 'Amount (Rs)', num: true, money: true }, { key: 't', label: 'Treatment' }],
    rows: [{ i: 'SFS/2026/0981', v: 'SecureOne Facility Services', p: 'Jun-25', a: 395000, t: 'Hit - service before the PBR window (before 31-Jul-2025); current-period expense, not reclassed to YEP' },
      { i: 'VCS/26/1240', v: 'Vertex Call Solutions', p: 'Mar-26', a: 1950000, t: 'YEP - service up to 31-Mar-2026; reclass limited to the provision value (Rs 19,50,000.00)' }] });

  var settings = UI.kv({ cols: 3, items: [['PBR window', '13 months (effective 01-Apr-2026, GPA)'], ['Next reversal run', 'Close of Sep-26 - 05-Oct-2026'], ['Exclusions', 'Provisions on hold; Government vendor provisions'], ['ERP ageing buckets', '0-30, 31-60, 61-90, over 90 days'], ['Escalation thresholds', '90 / 180 / 270 / 365 days (configurable)'], ['Year-end', 'FY 2025-26 closed 31-Mar-2026']] });

  Page.render({
    id: 'pa-14', user: 'B0GPA204', role: 'GPA analyst', viewAs: 'GPA analyst',
    states: [{ id: 'run', label: 'After PBR run' }],
    html: UI.page({ title: 'Ageing', accent: '& Reversal', info: 'Open provisions are aged monthly, escalated, and reversed beyond the PBR window unless on hold', sub: 'Escalations, the automatic PBR reversal, holds, force closure and reversal requests, hits and year-end provisions.' }) +
      settings + '<div class="k-gap"></div>' +
      UI.tabs({ id: 'ag', active: ran ? 'pbr' : 'age', tabs: [
        { id: 'age', label: 'Ageing & escalation', body: [UI.cols('1:1', [buckets], [UI.subhead('Escalation matrix'), esc])] },
        { id: 'pbr', label: 'PBR reversal run', count: 4, body: [ran ? UI.alert({ tone: 'ok', title: 'Reversal run completed 05-Oct-2026 06:00.', text: '2 provisions reversed (Rs 22,90,000.00); 2 excluded. Reversal journals sent to Oracle.' }) : UI.alert({ tone: 'info', text: 'At the close of 30-Sep-2026, provisions for Aug-25 and earlier fall outside the 13-month window and will be reversed automatically on 05-Oct unless placed on hold.', actions: [UI.button({ label: 'Place selected on hold', size: 'sm', toast: 'Hold requested - CFR approval where the policy requires it' })] }), pbr] },
        { id: 'force', label: 'Force closure & reversal', count: 3, body: [UI.p('Force closure writes the provision back before the PBR window when no invoice is expected; force reversal is for disputed provisions. Both need CFR approval.', { muted: true }), force] },
        { id: 'hits', label: 'Hits & YEP', count: 2, body: [hits] }] })
  });
})();
</script>
</body>
</html>
