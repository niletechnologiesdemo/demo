<script>

    { a: 'ACT-0096 Membership fee', bu: '101 Corporate', v: 'Telecom Industry Association', m: ['R', 'R', 'R', 'R', 'R', 'D'] }

  var MARK = { R: '<span class="k-status t-ok">Raised</span>', S: '<span class="k-status t-info">Submitted</span>', D: '<span class="k-status t-grey">Draft</span>', L: '<span class="k-status">Late</span>', M: '<span class="k-status">Missing</span>', T: '<span class="k-status">Returned</span>' };
  var cols = [{ key: 'a', label: 'Activity / BU' }, { key: 'v', label: 'Vendor' }].concat(months.map(function (m, i) { return { key: 'm' + i, label: m }; })).concat([{ key: '_acts', label: '' }]);
  var rows = cal.map(function (c) {
    var r = { a: UI.esc(c.a) + '<div class="k-muted k-small">' + c.bu + '</div>', v: UI.esc(c.v), _flag: c.m[5] === 'M' };
    c.m.forEach(function (x, i) { r['m' + i] = MARK[x]; });
    r._acts = c.m[5] === 'M' ? [{ icon: 'plus', label: 'Raise now from suggestion', go: 'pa-04' }, { icon: 'bell', label: 'Send reminder', toast: 'Reminder sent to the maker' }] : [];

  var feb = PA.find('131·410612·LEGAL007·FEB-26');   // open with a force closure request (pa-data.js)
  var sugg = UI.table({ dense: true, select: true, columns: [{ key: 'a', label: 'Suggested provision' }, { key: 'basis', label: 'Basis' }, { key: 'amt', label: 'Suggested (Rs)', num: true, money: true }, { key: 'conf', label: 'Confidence' }, { key: '_acts', label: '' }],

  Page.render({
    id: 'pa-11', user: 'B0MKR412', role: 'Business user (maker)', viewAs: 'Business user (maker)',
    html: UI.page({ title: 'Provision', accent: 'Calendar', info: 'Built from provision history: expected recurring provisions by month', sub: 'Which regular provisions were raised each month, which are missing, and the platform\'s suggestions for this month.' }) +
      UI.kpis({ cols: 4, items: [{ value: '3', label: 'Missing for Sep-26', sub: 'Reminder sent 28-Sep', tab: 'cs:cal', active: true }, { value: '1', label: 'Raised late last month' }, { value: '4', label: 'Suggestions', tab: 'cs:sug' }, { value: '05-Oct', label: 'Escalation if still missing', sub: 'To the manager' }] }) +
      UI.tabs({ id: 'cs', bar: false, tabs: [
        { id: 'cal', body: [UI.filters({ items: [UI.field({ label: 'BU', type: 'select', value: 'My BUs' }), UI.field({ label: 'Activity', type: 'select', value: 'Recurring activities' })] }), UI.table({ dense: true, columns: cols, rows: rows, pager: false })] },
        { id: 'sug', body: [UI.p('Suggestions for recurring expenses (rent, electricity, diesel, AMC, security, call centre, legal retainer, IT support) from formulas, history and configurable rules. Accepting one opens a pre-filled provision that still goes through maker-checker.', { muted: true }), sugg] }] })
  });
})();
</script>
