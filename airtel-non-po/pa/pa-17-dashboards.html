<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboards - Non-PO Portal</title>
<link rel="stylesheet" href="../assets/airtel.css">
</head>
<body>
<script src="../assets/kit.js"></script>
<script src="../assets/page.js"></script>
<script src="pa-data.js"></script>
<script>
(function () {
  var exec = [
    UI.kpis({ cols: 6, items: [{ value: '24,118', label: 'Total provisions FYTD' }, { value: '19,640', label: 'Open' }, { value: '4,203', label: 'Closed' }, { value: '38 days', label: 'Average ageing' }, { value: '87%', label: 'Provision utilization' }, { value: '275', label: 'Reversed / force closed' }] }),
    UI.cols('1:1', [UI.box({ title: 'Department ranking - open balance', body: [UI.chart({ type: 'bar', title: 'Top departments', unit: 'Rs Cr', categories: ['Network Infra', 'Network Operations', 'Customer Service', 'IT Finance', 'Admin & Facilities'], series: [{ name: 'Open', data: [46.8, 12.6, 4.2, 1.0, 0.9] }], fmt: function (v) { return UI.inr(v, 1); } })] })],
      [UI.box({ title: 'Vendor ranking - open balance', body: [UI.chart({ type: 'bar', title: 'Top vendors', unit: 'Rs Cr', categories: ['Indus Towers', 'Summit Digitel', 'Prism Power', 'Xtelify', 'Vertex Call'], series: [{ name: 'Open', data: [31.4, 15.4, 1.9, 1.0, 0.6] }], fmt: function (v) { return UI.inr(v, 1); } })] })])];
  var fin = [
    UI.kpis({ cols: 5, items: [{ value: 'Rs 482.6 Cr', label: 'Provision value FYTD' }, { value: 'Rs 401.2 Cr', label: 'Actualized' }, { value: 'Rs 6.3 Cr', label: 'Reversed' }, { value: 'Rs 5.3 Cr', label: 'Pending approval' }, { value: 'Rs 75.1 Cr', label: 'Pending actualization' }] }),
    UI.box({ title: 'Provision vs actualization by month', body: [UI.chart({ type: 'line', title: 'Rs Cr', categories: ['Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep'], series: [{ name: 'Provisioned', data: [78, 79, 81, 80, 82, 83] }, { name: 'Actualized', data: [74, 76, 78, 79, 70, 24] }], fmt: function (v) { return Math.round(v); } })] })];
  var seg = [
    UI.filters({ items: [UI.field({ label: 'Month', type: 'select', value: 'Aug-2026' }), UI.field({ label: 'Nature', type: 'select', value: 'Rent, electricity, diesel' })] }),
    UI.box({ title: 'Provision vs invoice by TOCO segment', body: [UI.chart({ type: 'column', title: 'Rs Cr', categories: ['TNG', 'Owned', 'Indus', 'Other TOCO', 'Homes'], series: [{ name: 'Provision', data: [8.4, 2.1, 31.4, 15.4, 0.6] }, { name: 'Invoice', data: [8.1, 2.0, 30.7, 14.2, 0.6] }], fmt: function (v) { return UI.inr(v, 1); } })] }),
    UI.table({ dense: true, pager: false, columns: [{ key: 's', label: 'Segment' }, { key: 'n', label: 'Nature' }, { key: 'p', label: 'Provision (Rs Cr)', num: true }, { key: 'i', label: 'Invoice (Rs Cr)', num: true }, { key: 'd', label: 'Under / excess', num: true }],
      rows: [{ s: 'Indus', n: 'Rent', p: '21.2', i: '21.0', d: '0.2 under' }, { s: 'Indus', n: 'Electricity', p: '10.2', i: '9.7', d: '0.5 under' }, { s: 'Other TOCO', n: 'Rent', p: '11.8', i: '11.2', d: '0.6 under' }, { s: 'Other TOCO', n: 'Diesel', p: '3.6', i: '3.0', d: '0.6 under' }] })];
  var health = [
    UI.kpis({ cols: 4, items: [{ value: '81%', label: 'Exact-match rate', sub: 'Target 90%' }, { value: '6%', label: 'Force-match rate' }, { value: '1.1%', label: 'Force-closure rate' }, { value: '3', label: 'Interface failures this week' }] }),
    UI.box({ title: 'Matching outcomes by week', body: [UI.chart({ type: 'stacked', title: 'Invoices', categories: ['W36', 'W37', 'W38', 'W39'], series: [{ name: 'Exact', data: [302, 288, 341, 353] }, { name: 'Force match', data: [22, 19, 24, 18] }, { name: 'Unmatched', data: [9, 7, 11, 6] }], fmt: function (v) { return Math.round(v); } })] }),
    UI.p('Shows where matching or estimating needs attention at source.', { muted: true, small: true })];
  Page.render({
    id: 'pa-17', user: 'B0LDR002', role: 'Finance leadership', viewAs: 'Finance leadership',
    html: UI.page({ title: 'Dashboards', sub: 'Executive, finance, segment and matching-health views. Figures are illustrative.' }) +
      UI.filters({ show: false, items: [UI.field({ label: 'Entity', type: 'select', value: 'All' }), UI.field({ label: 'BU', type: 'select', value: 'All' }), UI.field({ label: 'Period', type: 'select', value: 'FY 2026-27 to date' })] }) +
      UI.tabs({ id: 'db', tabs: [{ id: 'exec', label: 'Executive', body: exec }, { id: 'fin', label: 'Finance', body: fin }, { id: 'seg', label: 'Segment (TOCO)', body: seg }, { id: 'health', label: 'Matching health', body: health }] })
  });
})();
</script>
</body>
</html>
