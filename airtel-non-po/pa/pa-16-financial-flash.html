<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial flash - Non-PO Portal</title>
<link rel="stylesheet" href="../assets/airtel.css">
</head>
<body>
<script src="../assets/kit.js"></script>
<script src="../assets/page.js"></script>
<script src="pa-data.js"></script>
<script>
(function () {
  // Lines and their entries come from pa-data.js (PA.flash). Selecting a line opens its detail page (pa-24) with the entries behind it.
  var lines = PA.flash, f = function (n) { return UI.inr(n, 2); };
  var tot = lines.reduce(function (a, r) { return { tb: a.tb + r.tb, prov: a.prov + r.prov, rev: a.rev + r.rev, adj: a.adj + r.adj, run: a.run + r.run }; }, { tb: 0, prov: 0, rev: 0, adj: 0, run: 0 });
  var table = UI.table({ dense: true, pager: false, columns: [{ key: 'l', label: 'FSG line' }, { key: 'tb', label: 'Aug-26 closing TB (Rs lakh)', num: true }, { key: 'prov', label: '+ Provisions', num: true }, { key: 'rev', label: '- Reversals', num: true }, { key: 'adj', label: '+/- Adjustments', num: true }, { key: 'tot', label: 'Running (Rs lakh)', num: true }, { key: '_acts', label: '' }],
    rows: lines.map(function (r) { return { l: '<a class="k-link" data-go="pa-24?line=' + r.id + '">' + UI.esc(r.l) + '</a><div class="k-muted k-small">' + r.g + '</div>', tb: f(r.tb), prov: f(r.prov), rev: f(r.rev), adj: f(r.adj), tot: f(r.run), _go: 'pa-24?line=' + r.id,
      _acts: [{ icon: 'eye', label: 'Open the line', go: 'pa-24?line=' + r.id }] }; }),
    foot: { l: 'Total operating expenses', tb: f(tot.tb), prov: f(tot.prov), rev: f(tot.rev), adj: f(tot.adj), tot: f(tot.run) } });

  Page.render({
    id: 'pa-16', user: 'B0BFN017', role: 'Business finance', viewAs: 'Business finance',
    html: UI.page({ title: 'Financial', accent: 'Flash', info: 'Prior month trial balance and FSG replicated from Oracle daily, with platform entries overlaid', sub: 'See the running effect of this month\'s provisions, reversals and adjustments on profit and loss before month-end close.' }) +
      UI.kv({ cols: 4, items: [['Base', 'Aug-26 closing trial balance and FSG'], ['Refreshed', '01-Oct-2026 05:30 from Oracle'], ['Scope', 'BAL &middot; Mobile, all circles'], ['Overlay', 'Your BUs\' platform entries for Sep-26']] }) + '<div class="k-gap"></div>' +
      UI.filters({ items: [UI.field({ label: 'Entity', type: 'select', value: 'BAL' }), UI.field({ label: 'Segment', type: 'select', value: 'Mobile' }), UI.field({ label: 'Circle', type: 'select', value: 'All' }), UI.field({ label: 'View', type: 'select', value: 'FSG - operating expenses' })] }) +
      table + UI.p('Select a line to open the provisions, reversals and adjustments behind it, down to each URN.', { muted: true, small: true })
  });
})();
</script>
</body>
</html>
