<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create provision - Non-PO Portal</title>
<link rel="stylesheet" href="../assets/airtel.css">
</head>
<body>
<script src="../assets/kit.js"></script>
<script src="../assets/page.js"></script>
<script src="pa-data.js"></script>
<script>
(function () {
  var S = Page.state();
  var scen = S === 's2' ? 2 : S === 's4' ? 4 : S === 's10' ? 10 : 1;
  var act = PA.activities.filter(function (a) { return a.scenario === scen; })[0];
  var noDoa = S === 'nodoa', oneBu = S === 'onebu', err = S === 'errors', dup = S === 'duplicate', cfr = S === 'cfr', ok = S === 'validated' || S === 'submitted', ret = S === 'returned';
  var rule = scen !== 1;
  var vcode = scen === 1 ? '410022' : scen === 2 ? '410387' : scen === 4 ? '410387' : '410455';
  var vend = PA.vendors[vcode];
  var bu = cfr ? '161' : '131', buName = cfr ? 'Mobile - Telangana (new BU)' : 'Mobile - Karnataka';
  var amount = scen === 1 ? 492000 : scen === 2 ? 1500000 : scen === 4 ? 1008000 : 110;

  // Activity master decides scenario, route and reversal mode: one summary line, not separate fields
  var actLine = 'S' + act.scenario + ' ' + UI.esc(PA.scenarios[act.scenario]) + ' &middot; ' +
    (act.route === 'Approval' ? 'DOA approval' : 'Notification only') + ' &middot; ' +
    (act.mode === 'Reversal' ? 'Reversal mode' : 'Standing') + ' &middot; ' + UI.esc(act.dept);
  // BU access comes from the user set-up (portal, or HRMS if available): pick from own BUs, read-only when there is only one
  var buField = oneBu ? UI.field({ label: 'BU', type: 'readonly', value: bu + ' &middot; ' + buName, src: 'master' })
    : UI.field({ label: 'BU', type: 'select', value: bu + ' &middot; ' + buName, required: true, src: 'master' });
  var buNote = UI.note({ text: oneBu ? 'The user has one BU (OLM ID, operating unit, circle), so it is shown read-only.'
    : 'Lists only the BUs in the user\'s access (111, 131), set up in Users and Roles or taken from HRMS if available. A user with one BU sees it read-only.' });

  var details = UI.section({ title: 'Provision Details', collapsible: true, body: [UI.grid(3, [
    { span: 2, html: UI.field({ label: 'Activity', type: 'lookup', value: act.id + ' &middot; ' + UI.esc(act.name), required: true, src: 'user' }) + UI.p(actLine, { muted: true, small: true }) },
    buField + buNote,
    UI.field({ label: 'Vendor', type: 'lookup', value: UI.esc(vend.name) + ' &middot; ' + vcode, required: true, src: 'user' }),
    UI.field({ label: 'Item code', type: 'lookup', value: err ? 'SECURITY09' : act.item + ' &middot; ' + UI.esc(act.itemDesc), required: true, src: 'user', error: err ? 'Item code SECURITY09 does not exist in the item code master.' : '' }),
    UI.field({ label: 'Input month', type: 'select', value: 'Sep-2026', required: true, src: 'user', error: S === 'closed' ? 'GL period SEP-26 is closed in Oracle. Submission is blocked for this period.' : '' })
  ]), err ? UI.alert({ tone: 'red', title: 'Item code not found.', text: 'Request it from the MDM team; you are notified when it is created.', actions: [UI.button({ label: 'Notify MDM', size: 'sm', toast: 'Item code request raised to the MDM team' })] }) : ''] });

  // Scenario inputs: only the values the user supplies, with the calculated result read-only
  var calc = '';
  if (scen === 2) calc = UI.section({ title: 'Scenario 2 - Distribution by Defined %', collapsible: true, body: [
    UI.grid(3, [UI.field({ label: 'Segment YTD input from NSG (Rs)', value: UI.inr(amount, 2), required: true, src: 'user' })]),
    UI.table({ pager: false, export: false, columns: [{ key: 'c', label: 'Circle (BU)' }, { key: 'p', label: 'Share %', num: true }, { key: 'a', label: 'Expense Dr (Rs)', num: true, money: true }],
      rows: [{ c: '111 Delhi', p: '40.00', a: 600000 }, { c: '171 Orissa', p: '20.00', a: 300000 }, { c: '181 Punjab', p: '25.00', a: 375000 }, { c: '191 Haryana', p: '15.00', a: 225000 }],
      foot: { c: 'Consolidated liability Cr', p: '100.00', a: 1500000 } }),
    UI.note({ text: 'Shares come from the effective-dated allocation master maintained by business teams.' })] });
  if (scen === 4) calc = UI.section({ title: 'Scenario 4 - Partial Expense and Deferment', collapsible: true, body: [UI.grid(3, [
    UI.field({ label: 'Period-to-date input (Rs)', value: '36,00,000.00', required: true, src: 'user' }),
    UI.field({ label: 'Entity', type: 'select', value: 'Mobile', required: true, src: 'user' }),
    UI.field({ label: 'Deferment category', type: 'select', value: 'DG promoter', required: true, src: 'user' }),
    UI.field({ label: 'Deferment % / life', type: 'readonly', value: '72% &middot; 35 months', src: 'master' }) + UI.tbc('Scenario 4: whether deferment % is a user input or a parameter'),
    UI.field({ label: 'Current prepaid (next 12 months)', type: 'readonly', value: '8,88,686.00', src: 'system' }),
    UI.field({ label: 'Non-current prepaid', type: 'readonly', value: '17,03,314.00', src: 'system' })])] });
  if (scen === 10) calc = UI.section({ title: 'Scenario 10 - VTM', collapsible: true, body: [UI.grid(3, [
    UI.field({ label: 'Paper-based activation %', value: '62.00', required: true, src: 'user' }),
    UI.field({ label: 'Online activation %', value: '38.00', required: true, src: 'user' }),
    UI.field({ label: 'Subscribers × avg penalty %', type: 'readonly', value: '11,000 &times; 1.00% = 110.00', src: 'system' })]),
    UI.note({ text: 'Subscriber count is updated by AIO; the penalty % is the average of the last 12 months.' })] });

  // Amount and period (BRD input template). Rule-based scenarios take the amount from the calculation above.
  var amtFields = rule ? [
    UI.field({ label: scen === 4 ? 'Expensed now (15 days, Rs)' : 'Amount (Rs)', type: 'readonly', value: UI.inr(amount, 2), src: 'system' })
  ] : [
    UI.field({ label: 'Quantity', value: '1', src: 'user' }),
    UI.field({ label: 'Rate', value: UI.inr(amount, 2), src: 'user' }),
    UI.field({ label: 'Amount', value: UI.inr(amount, 2), required: true, prefix: 'INR', src: 'user' })
  ];
  var amt = UI.section({ title: 'Amount and Period', collapsible: true, body: [UI.grid(3, amtFields.concat([
    UI.field({ label: 'Period from', type: 'date', value: '01/09/2026', required: true, src: 'user' }),
    UI.field({ label: 'Period to', type: 'date', value: '30/09/2026', required: true, src: 'user' }),
    UI.field({ label: 'Provision basis', type: 'select', placeholder: 'Select', required: true, src: 'user' }) + UI.tbc('Provision basis: the list of values'),
    UI.field({ label: 'Annotation', value: scen === 1 ? 'Guarding services - Bengaluru offices' : '', src: 'user' }),
    { span: 2, html: UI.field({ label: 'Remarks', value: ret ? 'Revised after checker comments' : '', placeholder: cfr ? 'Required for CFR approval' : 'Optional', required: cfr, src: 'user' }) }
  ])), UI.upload({ label: 'Attachment', required: true, hint: 'Required for this activity', files: ret || ok ? [{ name: 'Security_contract_2026.pdf', meta: '820 KB' }] : [] })] });

  var checks = '';
  if (err) checks = UI.alert({ tone: 'red', title: '2 issues stop this provision.', text: 'Item code SECURITY09 does not exist; attachment missing.' });
  else if (dup) checks = UI.alert({ tone: 'warn', title: 'Potential duplicate.', text: 'Same vendor, item and amount as 131·410022·SECURITY001·AUG-26. Give a reason to continue.', actions: [UI.button({ label: 'Override with reason', size: 'sm', modal: 'override' })] }) +
    UI.alert({ tone: 'red', title: 'Exact duplicate blocked.', text: 'A provision for BU 131, vendor 410022, item SECURITY001 and SEP-26 was submitted on 30-Sep-2026.' });
  else if (cfr) checks = UI.alert({ tone: 'warn', title: 'Routed to CFR approval.', text: 'BU 161 is new for this activity. Add remarks for CFR; the DOA approvers follow.' });
  else if (ret) checks = UI.alert({ tone: 'red', title: 'Returned by B0CHK155 (approver 1 of 2) on 30-Sep-2026.', text: 'Attach the retainer agreement; amount differs from the agreed monthly fee.' });
  else if (ok) checks = UI.alert({ tone: 'ok', title: 'All checks passed.', text: '2 approvers from DOA: B0CHK155, then B0CHK090.' });
  else if (scen === 1) checks = UI.alert({ tone: 'info', text: 'Raised for Jul-26 and Aug-26 at Rs 4,85,000.00.', actions: [UI.textlink({ label: 'Use suggestion', icon: 'arrowRight', toast: 'Form pre-filled from the August provision' })] });

  var submitted = UI.modal({ id: 'submitted', open: S === 'submitted' || noDoa, title: 'Provision', accent: 'Submitted', size: 'narrow', body: noDoa ? [
    UI.kv({ cols: 2, items: [['Status', UI.status('DOA exception')], ['Approvers (DOA)', 'None returned for this type of provision']] }),
    UI.p('The GPA team has been alerted. Approvals start once the DOA matrix is set up and the provision is retriggered.', { muted: true })] : [
    UI.kv({ cols: 2, items: [['Status', UI.status('Submitted')], ['Approvers (DOA)', 'B0CHK155, then B0CHK090'], ['URN', 'Generated when all approvers approve']] }),
    UI.p('You will be notified when it is approved or returned.', { muted: true }),
    UI.note({ text: 'After validation and scenario evaluation the DOA API returns up to 10 approvers; each must approve before the URN is generated. If the DOA API is not provided, the approval matrix is maintained in the portal.' })],
    foot: [UI.button({ label: 'Create another', go: 'pa-04' }), UI.button({ label: 'View register', variant: 'primary', go: 'pa-03' })] });
  var override = UI.modal({ id: 'override', title: 'Override', accent: 'Duplicate warning', size: 'narrow', body: [
    UI.field({ label: 'Reason for raising this provision', type: 'area', required: true, placeholder: 'For example: second site added from 15-Sep-2026' }), UI.note({ text: 'The override, the reason and the matched provision are recorded in the audit trail.' })],
    foot: [UI.button({ label: 'Cancel', variant: 'text', close: true }), UI.button({ label: 'Continue', variant: 'primary', close: true, toast: 'Override recorded' })] });

  var bar = UI.sticky({
    totals: [['Provision amount', 'Rs ' + UI.inr(amount, 2)]],
    right: [UI.button({ label: 'Save draft', toast: 'Saved as draft' }), UI.button({ label: 'Validate', state: 'validated' }),
      err || dup || S === 'closed' ? UI.button({ label: 'Submit for approval', variant: 'disabled' }) : UI.button({ label: 'Submit for approval', variant: 'primary', state: 'submitted' })] });

  Page.render({
    id: 'pa-04', user: 'B0MKR412', role: 'Business user (maker)', viewAs: 'Business user (maker)',
    states: [{ id: 'onebu', label: 'Single-BU user' }, { id: 'validated', label: 'Checks passed' }, { id: 'errors', label: 'Item code missing' }, { id: 'duplicate', label: 'Duplicate' }, { id: 'closed', label: 'GL period closed' },
      { id: 'cfr', label: 'New BU - CFR route' }, { id: 'returned', label: 'Returned' }, { id: 's2', label: 'Scenario 2' }, { id: 's4', label: 'Scenario 4' }, { id: 's10', label: 'Scenario 10' }, { id: 'submitted', label: 'Submitted' }, { id: 'nodoa', label: 'No DOA approvers' }],
    rail: { mode: 'form', title: 'Create Provision', accent: 'Non-PO', back: 'pa-03', text: 'Mandatory fields are marked <span class="k-link">*</span>.' },
    html: checks + details + calc + amt + bar + submitted + override
  });
})();
</script>
</body>
</html>
