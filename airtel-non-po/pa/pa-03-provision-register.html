<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provision register - Non-PO Portal</title>
<link rel="stylesheet" href="../assets/airtel.css">
</head>
<body>
<script src="../assets/kit.js"></script>
<script src="../assets/page.js"></script>
<script src="pa-data.js"></script>
<script>
(function () {
  var S = Page.state(), all = PA.provisions;
  var rows = S === 'empty' ? [] : S === 'open' ? all.filter(function (p) { return /Open|Partially/.test(p.status); }) : all;
  var count = function (f) { return all.filter(f).length; };
  var sum = function (f) { return all.filter(f).reduce(function (a, p) { return a + p.balance; }, 0); };
  var isOpen = function (p) { return p.status === 'Open' || p.status === 'Partially actualized'; };

  var tiles = UI.kpis({ cols: 6, items: [
    { value: String(count(isOpen)), label: 'Open provisions', sub: 'Rs ' + UI.compact(sum(isOpen)) + ' balance', active: S === 'open', go: 'pa-03?state=open' },
    { value: String(count(function (p) { return p.status === 'Submitted'; })), label: 'Pending approval', go: 'pa-07' },
    { value: String(count(function (p) { return p.status === 'Returned' || p.status === 'Draft'; })), label: 'Draft or returned' },
    { value: String(count(function (p) { return p.status === 'Interface error'; })), label: 'Interface errors', go: 'pa-10' },
    { value: String(count(function (p) { return isOpen(p) && p.age > 90; })), label: 'Open over 90 days', go: 'pa-14' },
    { value: '3', label: 'Missing for Sep-26', sub: 'Expected, not raised', go: 'pa-11' }
  ] });

  var filters = UI.filters({ items: [
    UI.field({ label: 'Status', type: 'select', value: S === 'open' ? 'Open, partially actualized' : 'All statuses' }),
    UI.field({ label: 'Activity', type: 'select', value: 'All activities' }),
    UI.field({ label: 'BU', type: 'select', value: 'All BUs in my scope' }),
    UI.field({ label: 'Vendor', type: 'lookup', placeholder: 'Name, code or PAN' }),
    UI.field({ label: 'Input month', type: 'select', value: 'Apr-26 to Sep-26' }),
    UI.field({ label: 'Source', type: 'select', value: 'All sources' }),
    UI.field({ label: 'Ageing', type: 'select', value: 'All' })
  ] });

  var table = UI.table({
    dense: true,
    columns: [
      { key: 'urn', label: 'URN / activity' }, { key: 'vendor', label: 'Vendor / BU' },
      { key: 'amount', label: 'Provision (Rs)', num: true }, { key: 'balance', label: 'Balance (Rs)', num: true, money: true },
      { key: 'status', label: 'Status' }, { key: 'age', label: 'Age (days)', num: true }, { key: '_acts', label: '' }
    ],
    rows: rows.map(function (p) {
      var sub = p.reason || p.error || p.hold || p.note || p.escalation || '';
      return {
        _flag: p.status === 'Interface error' || (isOpen(p) && p.age > 180),
        urn: '<div class="w-230"><a class="k-link k-urn wrap" href="pa-09-provision-detail.html?urn=' + encodeURIComponent(p.urn) + '">' + UI.esc(p.urn).replace(/·/g, '·<wbr>') + '</a>' +
          '<div class="k-muted k-small">' + UI.esc(p.activity.name) + ' &middot; S' + p.scenario + ' &middot; ' + UI.esc(p.source) + '</div></div>',
        vendor: '<div class="w-170">' + UI.esc(p.vendor) + '</div><div class="k-muted k-small">' + UI.esc(p.bu + ' ' + p.buName) + (p.locator ? ' &middot; locator ' + p.locator : '') + ' &middot; ' + p.rpt + '</div>',
        amount: UI.inr(p.amount, 2) + (p.actual ? '<div class="k-muted k-small">Actualized ' + UI.inr(p.actual, 2) + '</div>' : ''), balance: p.balance,
        status: UI.status(p.status, PA.statusTone(p.status)) + (sub ? '<div class="k-muted k-small">' + UI.esc(sub) + '</div>' : '') + (p.yep ? '<div class="k-small">YEP</div>' : ''),
        age: String(p.age),
        _acts: [{ icon: 'eye', label: 'Open provision', go: 'pa-09-provision-detail.html?urn=' + encodeURIComponent(p.urn) }].concat(
          p.status === 'Draft' || p.status === 'Returned' ? [{ icon: 'edit', label: 'Edit and resubmit', go: 'pa-04?state=returned' }] : [],
          isOpen(p) ? [{ icon: 'hold', label: 'Place on hold (GPA)', modal: 'hold' }] : [])
      };
    }),
    foot: { urn: 'Total (' + rows.length + ')', amount: UI.inr(rows.reduce(function (a, p) { return a + p.amount; }, 0), 2), balance: rows.reduce(function (a, p) { return a + p.balance; }, 0) },
    total: rows.length + ' provisions', empty: 'No provisions match the filters.'
  });

  var hold = UI.modal({ id: 'hold', title: 'Place on', accent: 'Hold', size: 'narrow', body: [
    UI.p('A provision on hold is excluded from automatic reversal under the PBR window until the hold is released. Only the GPA team can place a hold.', { muted: true }),
    UI.grid(1, [UI.field({ label: 'Hold reason', type: 'select', value: 'Vendor dispute', required: true }), UI.field({ label: 'Remarks', type: 'area', required: true, placeholder: 'Recorded in the audit trail' }),
      UI.options({ label: 'CFR approval', items: [{ label: 'Required by PBR policy mapping', on: true }], type: 'check' })])],
    foot: [UI.button({ label: 'Cancel', variant: 'text', close: true }), UI.button({ label: 'Place on hold', variant: 'primary', close: true, toast: 'Hold requested - sent to CFR for approval' })] });

  Page.render({
    id: 'pa-03', user: 'B0GPA204', role: 'GPA analyst', viewAs: 'GPA analyst',
    states: [{ id: 'open', label: 'Open provisions only' }, { id: 'empty', label: 'No results' }],
    html: UI.page({ title: 'Provision Register', info: 'Every provision raised on the platform, from any source, with its URN and lifecycle status', sub: 'Provisions raised by single entry, bulk upload, the DARTS feed and validated TOCO debit notes.' }) +
      UI.alert({ tone: 'warn', title: '3 expected provisions not raised for Sep-26.', text: 'Security services (BU 131), DG AMC (BU 151) and Call centre services (BU 121) are due from the provision calendar.', actions: [UI.textlink({ label: 'View calendar', icon: 'arrowRight', go: 'pa-11' })] }) +
      tiles + filters + table +
      UI.note({ text: 'For provisions posted in reversal mode, Oracle reverses the journal at the start of the next period while the platform keeps the provision open until it is actualized or aged out, so this balance can differ from the Oracle ledger balance (HLD 4.6).' }) +
      UI.p('Balance shown is the platform open balance. Reversal-mode provisions are reversed in Oracle at the start of the next period but stay open here until actualized or aged out.', { muted: true, small: true }) + hold
  });
})();
</script>
</body>
</html>
