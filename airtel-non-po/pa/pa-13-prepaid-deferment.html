<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prepaid register - Non-PO Portal</title>
<link rel="stylesheet" href="../assets/airtel.css">
</head>
<body>
<script src="../assets/kit.js"></script>
<script src="../assets/page.js"></script>
<script src="pa-data.js"></script>
<script>
(function () {
  // Schedules come from pa-data.js (PA.prepaid). Each schedule opens on its own page (pa-23). Deferment parameters and the
  // prepaid GL quality plan are kept on Masters & configuration.
  var all = PA.prepaid, sum = function (k) { return all.reduce(function (a, s) { return a + s[k]; }, 0); };
  var lakh = function (n) { return 'Rs ' + UI.inr(n / 1e5, 2) + ' L'; };
  var source = function (s) {
    if (s.urn) return '<a class="k-link k-urn" href="pa-09-provision-detail.html?urn=' + encodeURIComponent(s.urn) + '">' + UI.esc(s.urn).replace(/·/g, '·<wbr>') + '</a>';
    var r = PA.invoice(s.inv);
    return (r.src === 'Lease' ? 'Lease payment ' : 'Invoice ') + '<a class="k-link" data-go="pa-12?tab=mw:excess">' + UI.esc(s.inv) + '</a>';
  };
  var table = UI.table({ dense: true, pager: false, columns: [{ key: 'id', label: 'Schedule', nowrap: true }, { key: 'src', label: 'Source' }, { key: 'gl', label: 'Opex GL / BU' }, { key: 'life', label: 'Life' },
      { key: 'total', label: 'Total (Rs)', num: true, money: true }, { key: 'cur', label: 'Current (Rs)', num: true, money: true }, { key: 'nc', label: 'Non-current (Rs)', num: true, money: true }, { key: 'rel', label: 'Released (Rs)', num: true, money: true }, { key: '_acts', label: '' }],
    rows: all.map(function (s) { return { id: '<a class="k-link" data-go="pa-23?id=' + s.id + '">' + s.id + '</a>', src: source(s) + '<div class="k-muted k-small">' + UI.esc(s.text) + '</div>', gl: s.gl + '<div class="k-muted k-small">BU ' + s.bu + '</div>',
      life: s.from + ' to ' + s.to, total: s.total, cur: s.cur, nc: s.nc, rel: s.rel, _acts: [{ icon: 'eye', label: 'Open schedule', go: 'pa-23?id=' + s.id }] }; }),
    foot: { id: 'Total (' + all.length + ')', total: sum('total'), cur: sum('cur'), nc: sum('nc'), rel: sum('rel') } });

  Page.render({
    id: 'pa-13', user: 'B0GPA204', role: 'GPA analyst', viewAs: 'GPA analyst',
    html: UI.page({ title: 'Prepaid', accent: 'Register', info: 'Future service periods on an invoice, advance payments and scenario 4 deferments are held as prepaid and released monthly',
        sub: 'Prepaid applies only to Opex GL codes in the GL quality plan. Due within 12 months is current; the rest is non-current and moves to current month by month. The GL quality plan and the deferment parameters are kept on <a class="k-link" data-go="pa-19?tab=m:gl">Masters &amp; configuration</a>.' }) +
      UI.tbc('Prepaid entries: posted by the platform, by the Oracle prepaid module, or both (HLD open point 3)') +
      UI.kpis({ cols: 4, items: [{ value: String(all.length), label: 'Schedules' }, { value: lakh(sum('cur')), label: 'Current prepaid' }, { value: lakh(sum('nc')), label: 'Non-current prepaid' }, { value: lakh(sum('rel')), label: 'Released to date' }] }) +
      table + UI.p('Open a schedule to see its release plan, its accounting entries and the records it came from.', { muted: true, small: true })
  });
})();
</script>
</body>
</html>
