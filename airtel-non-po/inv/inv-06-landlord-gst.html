<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landlord GST invoice - Non-PO Portal</title>
<link rel="stylesheet" href="../assets/airtel.css">
</head>
<body>
<script src="../assets/kit.js"></script>
<script src="../assets/page.js"></script>
<script src="inv-data.js"></script>
<script>
(function () {
  /* Landlord GST on rent already paid (HLD 6.3.3; BRD Landlord GST). One paid rent voucher per GST invoice.
     Fields follow the LL GST input format: supplier, site and description are derived from the lease and GST masters. */
  var S = Page.state(), R = INV.role('landlord'), partner = INV.isPartner(R);
  var vend = INV.vendors['700845'], ci = INV.circles['Maharashtra'];
  var err = S === 'errors', ok = S === 'validated' || S === 'submitted', term = S === 'terminated', unpaid = S === 'unpaid';
  var lease = term ? INV.leases[2] : unpaid ? INV.leases[0] : INV.leases[1];
  var vch = term ? INV.vouchers[5] : unpaid ? INV.vouchers[4] : INV.vouchers[1];
  var base = vch.amount, cap = Math.round(base * 0.18 * 100) / 100, gst = err ? 10800 : cap;

  var head = UI.p('<b>Landlord GST</b> &middot; GST on rent already paid to you', {});

  // circle users submit for landlords who do not use the portal (BRD Landlord GST #5)
  var onBehalf = partner ? '' : UI.section({ title: 'Submitting for', body: [UI.grid(3, [
    UI.field({ label: 'Landlord', type: 'lookup', value: UI.esc(vend.name) + ' &middot; 700845', required: true })])] });

  var leases = UI.section({ title: '1. Select the lease', collapsible: true, body: [UI.table({ dense: true, pager: false, export: false, columns: [{ key: 'sel', label: '' }, { key: 'id', label: 'Lease' }, { key: 'site', label: 'Site (address)' }, { key: 'f', label: 'Rent' }, { key: 's', label: 'Status' }],
    rows: INV.leases.map(function (l) {
      var on = l.id === lease.id;
      return { _sel: on, sel: UI.check({ radio: true, on: on }), id: l.id, site: UI.esc(l.site), f: l.freq + ' &middot; Rs ' + UI.inr(l.rent, 2), s: UI.status(l.status, l.status === 'Active' ? 'ok' : 'grey') };
    }) }),
    term ? UI.alert({ tone: 'red', title: 'Lease LSE-MH-0291 is terminated.', text: 'GST invoices cannot be submitted against a terminated lease, a lease on hold, or where rent was not paid.' }) : ''] });

  var vouchers = UI.section({ title: '2. Select the paid rent voucher', sub: 'One voucher per GST invoice', collapsible: true, body: [UI.table({ dense: true, pager: false, export: false,
    columns: [{ key: 'sel', label: '' }, { key: 'no', label: 'Voucher' }, { key: 'p', label: 'Rent period' }, { key: 'a', label: 'Rent (Rs)', num: true, money: true }, { key: 'paid', label: 'Payment' }, { key: 'gst', label: 'GST' }],
    rows: INV.vouchers.filter(function (v) { return v.lease === lease.id; }).map(function (v) {
      var on = v.no === vch.no, can = !v.claimed && !v.unpaid && !v.terminated;
      return { _sel: on, _checked: on, sel: can || on ? UI.check({ radio: true, on: on }) : '', no: v.no, p: v.period, a: v.amount, paid: v.unpaid ? UI.status('Not paid') : UI.esc(v.paid), gst: v.claimed ? UI.status('Already claimed', 'grey') : UI.esc(v.gst) };
    }) }),
    unpaid ? UI.alert({ tone: 'red', title: 'Rent for Oct-2026 (voucher 719004) is not yet paid.', text: 'GST can be entered only after the rent is paid. The payment is scheduled for 05-Oct-2026.' }) : '',
    err ? UI.alert({ tone: 'red', text: 'Only one rent voucher can be used per GST invoice. Remove voucher 709881: GST on it was already claimed.' }) : ''] });

  var details = UI.section({ title: '3. GST Invoice Details', collapsible: true, body: [UI.grid(3, [
    UI.field({ label: 'Invoice number', value: err ? 'RKE#26-27/021' : 'RKE/26-27/021', required: true, error: err ? 'Special characters other than ( ) / - are not allowed in the invoice number.' : '' }),
    UI.field({ label: 'Invoice date', type: 'date', value: '28/09/2026', required: true }),
    UI.options({ label: 'Invoice signed', required: true, items: [{ label: 'Manually signed', on: true }, { label: 'Digitally signed' }] }),
    UI.field({ label: 'Base amount (rent)', value: UI.inr(base, 2), prefix: 'INR', required: true }),
    UI.field({ label: 'GST amount', value: UI.inr(gst, 2), prefix: 'INR', required: true, hint: err ? '' : 'At most 18% of the rent paid; a lower amount is accepted',
      error: err ? 'GST cannot exceed 18% of the rent paid (Rs ' + UI.inr(cap, 2) + '). A lower amount is accepted.' : '' }) + UI.tbc('Landlord GST: whether the landlord enters the GST amount (BRD items 3, 9); the LL GST input format has no GST column')
  ]), UI.note({ text: 'Supplier name, number and site, the GSTINs and the description (GST, invoice period and rent voucher number) come from the lease, the GST master and the invoice copy. The lease and voucher are checked for rent paid, earlier GST claims and lease status.' })] });

  var docs = UI.section({ title: 'Documents', collapsible: true, body: [UI.grid(2, [
    UI.upload({ label: 'GST invoice (PDF)', required: true, files: [{ name: 'RKE_26-27_021.pdf', meta: '204 KB', status: ok ? UI.status('Read by OCR', 'ok') : '' }] }),
    UI.upload({ label: 'Supporting documents' })])] });

  // Validate runs the invoice checklist (HLD 5.4) on the OCR output before submission; checks 12 and 13 are confirmed by the PHD team
  var chk = INV.checklist.map(function (k) {
    var n = k[0], res = 'pass';
    if ((n === 10 && vend.irn !== 'Yes') || n === 16 || n === 17 || n === 18) res = 'na';
    if (INV.REVIEW_CHECKS.indexOf(n) >= 0) res = 'manual';
    if (err && n === 3) res = 'fail';
    return { no: n, check: UI.esc(k[1]), source: res === 'manual' ? 'PHD team, after submission' : 'On Validate', result: res };
  });
  var chkModal = UI.modal({ id: 'chk', title: 'Invoice', accent: 'Checklist', size: 'wide', body: [UI.checklist({ columns: ['#', 'Check', 'Checked', 'Result', ''], rows: chk })],
    foot: [UI.button({ label: 'Close', variant: 'primary', close: true })] });
  var viewChk = UI.textlink({ label: 'View checklist', icon: 'arrowRight', modal: 'chk' });
  var checks = err ? UI.alert({ tone: 'red', title: '3 errors need correction before you can submit.', text: 'Correct the fields and voucher marked in red and validate again.', actions: [viewChk] })
    : ok ? UI.alert({ tone: 'ok', title: 'All checks passed.', text: 'Rent paid, voucher not claimed before, GST within the cap, lease active, and the invoice checklist passed. The signature is confirmed by the PHD team after submission.', actions: [viewChk] }) : '';

  var submitted = UI.modal({ id: 'submitted', open: S === 'submitted', title: 'GST Invoice', accent: 'Submitted', size: 'narrow', body: [
    UI.kv({ cols: 2, items: [['Reference number', '<b>NPO-2627-004873</b>'], ['Status', INV.status('Submitted')], ['Rent voucher', vch.no], ['GST claimed', 'Rs ' + UI.inr(gst, 2)]] }),
    UI.p('You are notified at every status change.', { muted: true })],
    foot: [UI.button({ label: 'My leases & vouchers', go: 'inv-12' }), UI.button({ label: 'Track invoice', variant: 'primary', go: 'inv-09' })] });

  var blocked = term || unpaid;
  var bar = UI.sticky({ totals: [['GST claimed', 'Rs ' + UI.inr(gst, 2)]],
    right: [UI.button({ label: 'Save', toast: 'Saved as draft' }), UI.button({ label: 'Validate', variant: blocked ? 'disabled' : '', state: blocked ? '' : 'validated' }),
      ok ? UI.button({ label: 'Submit GST invoice', variant: 'primary', state: 'submitted' }) : UI.button({ label: 'Submit GST invoice', variant: 'disabled' })] });

  Page.render({
    id: 'inv-06', roleId: 'landlord', navKey: 'inv-03',
    states: [{ id: 'errors', label: 'GST over cap / voucher used' }, { id: 'unpaid', label: 'Rent not paid' }, { id: 'terminated', label: 'Lease terminated' }, { id: 'validated', label: 'Validated' }, { id: 'submitted', label: 'Submitted' }],
    rail: { mode: 'form', title: 'GST Invoice', accent: 'Landlord', back: partner ? 'inv-12' : 'inv-03', text: 'Fields marked <span class="k-link">*</span> are mandatory.' },
    html: head + onBehalf + checks + leases + vouchers + details + docs + bar + submitted + chkModal
  });
})();
</script>
</body>
</html>
