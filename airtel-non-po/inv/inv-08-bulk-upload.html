<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulk upload - Non-PO Portal</title>
<link rel="stylesheet" href="../assets/airtel.css">
</head>
<body>
<script src="../assets/kit.js"></script>
<script src="../assets/page.js"></script>
<script src="inv-data.js"></script>
<script>
(function () {
  /* Bulk upload by category template (HLD 5.2, 6.2.1): locator-wise PM templates, AP bulk templates, debit-note files, bulk attachments.
     Template columns are the category's input format (requirements/PM_Invoice_format, AP_Invoice_format); * = mandatory in the format. */
  var S = Page.state(), R = INV.role('toco'), rid = R.id;
  var BULK = INV.cats.filter(function (c) { return c.bulk && !c.oos && INV.canSubmit(R, c.id); });
  var def = { toco: 'central-toco', vendor: 'local-toco', tax: 'gst-dn', circle: 'll-eb' }[rid] || 'central-toco';
  var cid = Page.param('cat') || def, c = INV.cat(cid);
  if (!c.bulk || !INV.canSubmit(R, cid)) { cid = def; c = INV.cat(cid); }
  var checked = S === 'checked' || S === 'submitted', attach = S === 'attach', pm = c.fam === 'PM', gstnc = cid === 'gst-dn';

  var TOCO_DN = 'Invoice Num*, Original Tax Invoice Number, Original Tax Invoice Date, Base Amount*, Vendor Name*, Vendor Number*, Vendor Site Name*, Operating Unit*, Description*, GL code*, Deduction Type*, Reason*, FDOA (Centre / Circle)*';
  var COLS = {
    'central-toco': 'Invoice Num*, Invoice Date*, Base Amount*, CGST, SGST, IGST, Invoice Currency*, Total Invoice Amount*, Supplier GSTIN*, Type of Invoice / Description*, Service Start Date*, Service End Date*, Site Id*, Airtel Id*, Locator Id, Meter Reading Start, Meter Reading End, Per UOM Cost, Circuit, Operating Unit*, BU Code*, State*, ATC ID, Old Site Id, Vendor Name*, Vendor Code*, Technology (2G / 3G / 4G / LTE)',
    'local-toco': 'Site Id*, Airtel Id, BU Code*, Locator Id*, Invoice Num*, Invoice Date*, Service Start Date*, Service End Date*, Meter Reading Start, Meter Reading End, Invoice Currency*, Base Amount*, CGST*, SGST*, IGST*, Total Invoice Amount*, Supplier GSTIN*, Type of Invoice / Description*, Technology (2G / 3G / 4G / LTE), Vendor Name, Supplier Site Name',
    'bw-dom': 'Vendor Number, Invoice Num*, Vendor Name*, Invoice Date*, Service Start Date*, Service End Date*, Per UOM Cost*, Base Amount*, CGST, SGST, IGST, Invoice Currency*, Total Invoice Amount*, Supplier GSTIN*, Circuit*, Type of Invoice / Description*',
    'bw-intl': 'Date*, Location*, Invoice Month*, Opex Head*, Invoice Num*, Vendor Name*, Vendor Site Code*, Invoice Date*, Start Date*, End Date*, Unit of Measure*, Reading Start, Reading End, Quantity, Per UOM Cost*, Total Cost*, Currency*, Comments*, Payment Term*, Capacity*, Invoice Amount*, Vendor Code*',
    'll-eb': 'Circle Name*, Site Id*, Locator ID*, Vendor Name*, Vendor Code*, Vendor Site Code*, Invoice Date*, Invoice Num*, Billing Start Date*, Billing End Date*, Meter Start Reading (where a reading applies), Meter End Reading (where a reading applies), Base Amount*, Total Invoice Amount*',
    'll-sd': 'Circle Name, Site ID, Locator ID, Vendor Name, Vendor Code, Vendor Site Code, Invoice Date, Invoice Number, Total Invoice Amount (HLD 6.2.7; no format workbook)',
    'govt-dn': 'Circle Name, Site ID, Locator ID, Vendor Name, Vendor Code, Vendor Site Code, Invoice Date, Invoice Number, Total Invoice Amount (HLD 6.2.7; no format workbook)',
    group: 'Operating Unit*, BU Code*, Vendor Name*, Vendor Number*, Vendor Site Name*, Airtel GSTIN*, Supplier GSTIN*, Invoice Date*, Invoice Num*, Invoice Currency*, Base Amount*, CGST, SGST, IGST, Total Invoice Amount*, GL code*, Description*, Item Code*, IUT Code, Original Tax Invoice Date, Original Tax Invoice Number, Exchange Rate, Product Name, Line Item Name, LSI',
    iuc: 'Vendor Name*, Cost Circle, BAL Circle, BU Code*, Operating Unit*, Type, Operator Circle, BSNL Circle, BSNL BU, GSTN / ISDN, Vendor Site Name*, Vendor Number*, Invoice Period, Invoice Date*, Due Date, Airtel GSTIN*, Supplier GSTIN*, Invoice Num*, PDF Invoice Ref, Base Amount*, Deduction, Passed Amount, an amount column per GL code (GL code mandatory), Total Invoice Amount*, TDS working columns, Description, Invoice Currency*, TDS Section*, TDS Tax Category*, Item Code*',
    bank: 'Account No., UID, Operating Unit*, BU Code*, Vendor Name*, Vendor Number*, Vendor Site*, Airtel GSTIN*, Supplier GSTIN*, Invoice Date*, Invoice Num*, Invoice Currency*, Base Amount*, CGST, SGST, IGST, Total GST, Total Invoice Amount*, Description*, Item Code*, GL code*, Remarks',
    credit: 'Operating Unit*, BU Code*, Vendor Name*, Vendor Number*, Vendor Site Name*, Airtel GSTIN*, Supplier GSTIN*, Invoice Date*, Invoice Num*, Invoice Currency*, Base Amount*, CGST, SGST, IGST, Total Invoice Amount*, GL code*, Description*, Item Code*, IUT Code, Original Tax Invoice Date*, Original Tax Invoice Number*, Exchange Rate',
    'toco-dn': TOCO_DN, 'toco-fdn': TOCO_DN, 'toco-rev': TOCO_DN, 'toco-cn': TOCO_DN,
    'gst-dn': 'Invoice Num*, Invoice Date*, Base Amount*, CGST, SGST, IGST, Invoice Currency*, Total Invoice Amount*, Supplier GSTIN*, Vendor Name*, Vendor Number*, Vendor Site Name*, Operating Unit*, BU Code*, Airtel GSTIN*, Item Code*, Description*, IUT Code, GL code*, Original Tax Invoice Date, Original Tax Invoice Number, Exchange Rate'
  };

  var steps = UI.steps({ items: [
    { label: 'Download the template', state: 'done' },
    { label: attach ? 'Upload invoice PDFs' : 'Upload the template and PDFs', state: checked ? 'done' : 'current' },
    { label: 'Review results', state: checked && S !== 'submitted' ? 'current' : S === 'submitted' ? 'done' : '' },
    { label: 'Submit valid invoices', state: S === 'submitted' ? 'done' : '' }] });

  var pick = UI.section({ title: attach ? 'Bulk Attachments' : 'Template', body: [UI.grid(3, [
    UI.field({ label: 'Category', type: 'select', value: UI.esc(c.name) + ' (' + INV.FAM[c.fam] + ')', required: true }),
    rid === 'circle' ? UI.field({ label: 'Circle', type: 'readonly', value: 'UP East (your circle only)' }) : '']),
    attach ? UI.upload({ label: 'Invoice PDFs and supporting documents', required: true, hint: 'File names start with the invoice number', files: [
      { name: 'IND_26_SEP_80412.pdf', meta: '1.2 MB', status: UI.status('Linked to NPO-2627-004851', 'ok') }, { name: 'IND_26_SEP_80430.pdf', meta: '1.4 MB', status: UI.status('Linked to NPO-2627-004866', 'ok') },
      { name: 'IND_26_SEP_80431_annex.pdf', meta: '380 KB', status: UI.status('No matching invoice') }] })
    : UI.row([UI.textlink({ label: 'Download template', icon: 'download', toast: 'Template download started' }), pm ? UI.textlink({ label: cid === 'bw-dom' ? 'Download circuits from the cost sheet' : 'Download last month\'s sites', icon: 'download', toast: 'Pre-filled rows downloaded' }) : '']),
    attach ? '' : UI.p('<b>Columns</b> (* mandatory): ' + UI.esc(COLS[cid] || 'Input format to be confirmed'), { muted: true, small: true }),
    cid === 'diesel' ? UI.tbc('Diesel Knock off: input format and rules') : '',
    attach ? '' : UI.upload({ label: gstnc ? 'Tax team debit note file' : 'Filled template', required: true, files: checked ? [{ name: gstnc ? 'GSTNC_DN_Sep26_BAL.xlsx' : cid === 'central-toco' ? 'IND_Sep26_all_circles.xlsx' : UI.esc(c.name).replace(/ /g, '_') + '_Sep26.xlsx', meta: (pm ? '186 rows' : '24 rows') + ' &middot; 412 KB', status: UI.status('Checked', 'ok') }] : [] }),
    attach || c.fam === 'DN' ? '' : UI.upload({ label: 'Invoice PDFs', required: true, hint: 'Linked to template rows by invoice number', files: checked ? [{ name: '9 PDF files', meta: '11.8 MB', status: UI.status('Read by OCR', 'ok') }] : [] }),
    UI.note({ text: 'Locator, opex head, vendor site, TDS and GST categories and payment term are derived for booking where the template does not carry them. IRN QR codes are scanned automatically for suppliers whose IRN status is Yes in the supplier master. Each invoice is validated like a single submission, including the checklist.' })] });

  // results: one row per invoice, with the reason when it is withheld
  var res = '';
  if (checked && pm) res = UI.section({ title: 'Results', body: [
    UI.p('9 invoices &middot; 186 lines uploaded, 171 after merging 15 repeated locator lines &middot; <b>7 valid</b>, 2 withheld', {}),
    UI.table({ dense: true, pager: false, columns: [{ key: 'inv', label: 'Invoice' }, { key: 'c', label: 'Circle' }, { key: 'l', label: 'Lines', num: true }, { key: 'a', label: 'Base (Rs)', num: true, money: true }, { key: 'r', label: 'Result' }, { key: '_acts', label: '' }],
      rows: [
        { inv: 'IND/26/SEP/80412', c: 'Delhi', l: '42', a: 1563754.58, r: UI.status('Valid', 'ok') },
        { inv: 'IND/26/SEP/80430', c: 'Haryana', l: '28', a: 912400, r: UI.status('Valid', 'ok') },
        { inv: 'IND/26/SEP/80431', c: 'Punjab', l: '19', a: 655210, r: UI.status('Valid', 'ok') },
        { inv: 'IND/26/SEP/80438', c: 'UP East', l: '24', a: 801330, r: UI.status('Withheld') + '<div class="k-small">Locator not found for 2 lines</div>', _flag: true, _acts: [{ icon: 'eye', label: 'Locator exceptions', go: 'inv-15' }] },
        { inv: 'IND/26/SEP/80440', c: 'Karnataka', l: '17', a: 590215, r: UI.status('Withheld') + '<div class="k-small">IRN QR amount does not match the invoice copy</div>', _flag: true },
        { inv: '4 more invoices', c: '', l: '41', a: 2210640, r: UI.status('Valid', 'ok') }],
      footLeft: [UI.textlink({ label: 'Download rows with errors', icon: 'download', toast: 'Error rows downloaded with the reason in the last column' })] }),
    UI.note({ text: 'Lines with the same locator, invoice number, invoice date and service dates are merged. Any error other than a duplicate withholds the whole invoice; the rest go ahead, and a corrected invoice joins the next upload.' })] });
  else if (checked) {
    var smp = { group: ['NXD/26-27/2291', '200014', 'Exchange rate missing for a USD invoice'], iuc: ['IUC/MEG/2026/08/114', '202546', 'GL code missing for an amount column'], bank: ['AIRTEL414', '517217', 'Item code missing'],
      credit: ['MFL/CN/26-27/021', '600388', 'Original tax invoice number missing'], 'gst-dn': ['GSTNONCOMPLIANCE-SEP26-B2-26-27-BAL-112', '395966', 'Vendor site inactive in Oracle'] }[cid] || ['IND/26/JUL/74410', '412885', 'Invoice is not booked for this vendor in Oracle'];
    var vn = INV.vendors[smp[1]].short || INV.vendors[smp[1]].name, dnote = c.fam === 'DN';
    res = UI.section({ title: 'Results', body: [
      UI.p('24 rows &middot; <b>22 valid</b>, 2 with errors', {}),
      UI.table({ dense: true, pager: false, columns: [{ key: 'n', label: 'Row' }, { key: 'inv', label: dnote ? 'Note' : 'Invoice' }, { key: 'v', label: 'Vendor' }, { key: 'r', label: 'Result' }],
        rows: [{ n: 2, inv: '<span class="wrap-any">' + UI.esc(smp[0]) + '</span>', v: UI.esc(vn), r: UI.status('Valid', 'ok') },
          { n: 3, inv: '<span class="wrap-any">' + UI.esc(smp[0]) + '-A</span>', v: UI.esc(vn), r: UI.status('Valid', 'ok') },
          { n: 7, inv: '<span class="wrap-any">' + UI.esc(smp[0]) + '-B</span>', v: UI.esc(vn), r: UI.status('Error') + '<div class="k-small">' + UI.esc(smp[2]) + '</div>', _flag: true },
          { n: 11, inv: '<span class="wrap-any">' + UI.esc(smp[0]) + '</span>', v: UI.esc(vn), r: UI.status('Error') + '<div class="k-small">Duplicate of row 2</div>', _flag: true }],
        footLeft: [UI.textlink({ label: 'Download rows with errors', icon: 'download', toast: 'Error rows downloaded with the reason in the last column' })] })] });
  } else if (attach) res = UI.alert({ tone: 'warn', title: '1 file has no matching invoice.', text: 'IND_26_SEP_80431_annex.pdf: rename it with the invoice number or remove it.' });

  var nValid = pm ? '7' : '22';
  var done = UI.modal({ id: 'done', open: S === 'submitted', title: 'Bulk upload', accent: 'Submitted', size: 'narrow', body: [UI.kv({ cols: 2, items: [['Batch', 'BLK-INV-26-1041'], ['Submitted', nValid + (pm ? ' invoices' : ' rows') + ' (reference numbers issued)'], ['Not submitted', '2 - correct and upload again']] })],
    foot: [UI.button({ label: 'Track invoices', variant: 'primary', go: 'inv-09' })] });

  var bar = attach ? UI.sticky({ right: [UI.button({ label: 'Cancel', variant: 'text', go: 'inv-03' }), UI.button({ label: 'Upload attachments', variant: 'primary', toast: '2 files linked and stored' })] })
    : UI.sticky({ totals: [['Valid', checked ? nValid : '-']],
      right: [UI.button({ label: 'Cancel', variant: 'text', go: 'inv-03' }), UI.button({ label: 'Validate', state: 'checked' }),
        checked ? UI.button({ label: 'Submit ' + nValid + ' valid', variant: 'primary', state: 'submitted' }) : UI.button({ label: 'Submit valid', variant: 'disabled' })] });

  Page.render({
    id: 'inv-08', roleId: 'toco',
    variants: { label: 'Template', param: 'cat', def: cid, items: BULK.map(function (x) { return { id: x.id, label: x.name.replace(' (landlord electricity)', '').replace(' (incl. broadband)', '').replace('GST non-compliance debit note', 'GST NC debit note').replace(' / Finance DN', '') }; }) },
    states: [{ id: 'checked', label: 'File checked' }, { id: 'submitted', label: 'Submitted' }, { id: 'attach', label: 'Bulk attachments' }],
    rail: { mode: 'form', title: 'Bulk', accent: 'Upload', back: INV.isPartner(R) ? 'inv-02' : 'inv-03', text: 'One category per file. Fields marked <span class="k-link">*</span> are mandatory.' },
    html: steps + '<div class="k-gap"></div>' + pick + res + bar + done
  });
})();
</script>
</body>
</html>
