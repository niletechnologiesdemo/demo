    foot: [UI.button({ label: 'Submit another', go: 'inv-03' }), UI.button({ label: 'Track invoice', variant: 'primary', go: 'inv-09' })] });

  var bar = UI.sticky({ left: [UI.textlink({ label: 'Generate total', icon: 'arrowRight', state: 'validated' })],
    totals: [['Taxable amount', money(f.base)], ['Tax amount', UI.inr(tax, 2)], ['Grand total', money(total)]],

      ok ? UI.button({ label: 'Submit invoice', variant: 'primary', state: 'submitted' }) : UI.button({ label: 'Validate invoice', variant: err || loc ? 'disabled' : 'primary', state: err || loc ? '' : 'validated' })] });

  Page.render({
    id: 'inv-04', roleId: 'vendor', navKey: 'inv-03',
    variants: { label: 'Sub-category', param: 'cat', def: cid, items: PMS.map(function (x) { return { id: x.id, label: x.name.replace(' (landlord electricity)', '') }; }) },

  });
