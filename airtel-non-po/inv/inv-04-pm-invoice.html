<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property Manager invoice - Non-PO Portal</title>
<link rel="stylesheet" href="../assets/airtel.css">
</head>
<body>
<script src="../assets/kit.js"></script>
<script src="../assets/page.js"></script>
<script src="inv-data.js"></script>
<script>
(function () {
  /* One locator-wise form for every Property Manager sub-category (HLD 6.2). The sub-category is the "cat" variant.
     Fields follow the PM input format for the sub-category (requirements/PM_Invoice_format); booking fields
     (opex head, TDS, GST category, payment term, invoice month) are derived and are not shown to the submitter. */
  var S = Page.state(), R = INV.role('vendor'), partner = INV.isPartner(R);
  var PMS = INV.cats.filter(function (c) { return c.fam === 'PM'; });
  var cid = Page.param('cat') || (R.id === 'toco' ? 'central-toco' : 'local-toco'), c = INV.cat(cid);
  if (c.fam !== 'PM') { cid = 'local-toco'; c = INV.cat(cid); }
  var err = S === 'errors', ok = S === 'validated' || S === 'submitted', loc = S === 'locator';

  // sample invoice per sub-category
  var CFG = {
    'central-toco': { v: '412885', circle: 'Delhi', inv: 'IND/26/SEP/80412', date: '25/09/2026', from: '01/09/2026', to: '30/09/2026', base: 1563754.58, nLines: 42, desc: 'Tower rent, energy and diesel - Sep 2026' },
    'local-toco': { v: '600124', circle: 'UP East', inv: 'SGIS/26-27/0425', date: '27/09/2026', from: '01/09/2026', to: '30/09/2026', base: 40000, nLines: 3, desc: 'Tower rental and energy charges - Sep 2026' },
    'bw-dom': { v: '600388', circle: 'Karnataka', inv: 'MFL/BLR/26/0912', date: '15/09/2026', from: '01/07/2026', to: '30/09/2026', base: 323525.42, nLines: 3, desc: 'Domestic bandwidth - Q2 FY 2026-27' },
    'bw-intl': { v: '588599', circle: 'Delhi', inv: '2026090025021', date: '04/09/2026', from: '01/09/2026', to: '30/09/2026', base: 1500, nLines: 1, desc: 'SEP-2026-CKT-ID', cur: 'USD' },
    'll-eb': { v: '211609', circle: 'Goa', inv: 'OPRT-123/25-41', date: '01/09/2026', base: 10000, nLines: 1 },
    'll-sd': { v: '700845', circle: 'Maharashtra', inv: 'RKE/SD/26-27/002', date: '20/09/2026', base: 162000, nLines: 1, noTax: true },
    'govt-dn': { v: '830114', circle: 'Maharashtra', inv: 'PMC/PT/2026-27/118844', date: '12/09/2026', base: 46200, nLines: 1, noTax: true },
    'diesel': { v: '600402', circle: 'UP East', inv: 'SKP/26-27/109', date: '20/09/2026', from: '01/09/2026', to: '15/09/2026', base: 78000, nLines: 3, desc: 'Diesel supplied to sites - 1 to 15 Sep 2026' }
  };
  var f = CFG[cid], vend = INV.vendors[f.v], ci = INV.circles[f.circle];
  var tax = f.noTax || f.cur ? 0 : Math.round(f.base * 0.18 * 100) / 100, half = tax / 2, total = f.base + tax;
  var intra = !vend.gstin || vend.gstin.slice(0, 2) === ci.gstin.slice(0, 2);
  var money = function (n) { return (f.cur ? f.cur + ' ' : '') + UI.inr(n, 2); };
  // which header fields the sub-category's input format carries
  var hasPeriod = !!f.from, hasDesc = !!f.desc, hasCur = /toco|bw-/.test(cid), hasGstin = /toco|bw-dom/.test(cid) || cid === 'diesel';
  var hasSite = /ll-|govt-dn|bw-intl/.test(cid), taxSplit = !f.noTax && !f.cur && cid !== 'll-eb';

  var head = UI.row([UI.p('<b>' + UI.esc(c.name) + '</b> &middot; Property Manager', {}), UI.textlink({ label: 'Change category', iconLeft: 'chevLeft', go: 'inv-03' }),
    c.tbc ? UI.tbc(c.tbc) : '', cid === 'central-toco' ? UI.tbc('Central ToCo: a standard input format to be agreed for each ToCo vendor working sheet') : '']);

  // Airtel users submit on behalf of a vendor; Central ToCo carries the circle on each line instead
  var onBehalf = partner ? '' : UI.section({ title: 'Submitting for', body: [UI.grid(3, [
    cid === 'central-toco' ? '' : UI.field({ label: 'Circle', type: R.id === 'circle' ? 'readonly' : 'select', value: UI.esc(f.circle) + ' &middot; ' + ci.ou, required: true }),
    UI.field({ label: 'Vendor', type: 'lookup', value: UI.esc(vend.name) + ' &middot; ' + f.v, required: true })])] });

  // Validate runs the invoice checklist (HLD 5.4) on the OCR output before submission; checks 12 and 13 are confirmed by the PHD team
  var chk = INV.checklist.map(function (k) {
    var n = k[0], res = 'pass';
    if ((n === 10 && vend.irn !== 'Yes') || n === 17 || n === 18 || ((n === 8 || n === 16) && !vend.gstin) || (n === 11 && (f.noTax || f.cur))) res = 'na';
    if (INV.REVIEW_CHECKS.indexOf(n) >= 0) res = 'manual';
    if (err && (n === 2 || n === 3 || n === 14 || (n === 7 && cid !== 'bw-intl'))) res = 'fail';
    return { no: n, check: UI.esc(k[1]), source: res === 'manual' ? 'PHD team, after submission' : 'On Validate', result: res };
  });
  var count = function (x) { return chk.filter(function (k) { return k.result === x; }).length; };
  var chkModal = UI.modal({ id: 'chk', title: 'Invoice', accent: 'Checklist', size: 'wide', body: [UI.checklist({ columns: ['#', 'Check', 'Checked', 'Result', ''], rows: chk })],
    foot: [UI.button({ label: 'Close', variant: 'primary', close: true })] });
  var viewChk = UI.textlink({ label: 'View checklist', icon: 'arrowRight', modal: 'chk' });
  var checks = '';
  var nErr = 3 + (cid === 'bw-intl' ? 0 : 1) + (/toco|bw-dom|ll-eb/.test(cid) ? 1 : 0);
  if (err) checks = UI.alert({ tone: 'red', title: nErr + ' errors need correction before you can submit.', text: 'Correct the fields and lines marked in red, or upload a corrected invoice copy, and validate again.', actions: [viewChk] }) +
    (vend.irn === 'Yes' ? UI.alert({ tone: 'red', title: 'IRN applicable but IRN not available.', text: 'The amount in the QR code does not match the invoice copy. Upload a revised invoice copy.' }) : '');
  else if (loc) checks = UI.alert({ tone: 'red', title: 'Locator not found for line 3 - the whole invoice is withheld.', text: 'The circle or P2P team arranges the locator; then re-trigger the invoice.', actions: [UI.textlink({ label: 'Locator exceptions', icon: 'arrowRight', go: 'inv-15' })] });
  else if (ok) checks = UI.alert({ tone: 'ok', title: 'All checks passed.', text: count('pass') + ' checklist items passed on the invoice copy' + (vend.irn === 'Yes' ? ', including the IRN QR code' : '') + '. Signature and invoice form are confirmed by the PHD team after submission.', actions: [viewChk] });

  var invNoErr = err ? 'GST invoice numbers allow at most 16 characters, and only ( ) / - and \\ as special characters.' : '';
  var details = UI.section({ title: 'Invoice Details', collapsible: true, body: [UI.grid(3, [
    UI.field({ label: 'Invoice number', value: err ? f.inv + '/A1' : f.inv, required: true, error: invNoErr }),
    UI.field({ label: 'Invoice date', type: 'date', value: err ? '03/10/2026' : f.date, required: true, error: err ? 'Future dates are not allowed.' : '' }),
    hasGstin ? UI.field({ label: 'Supplier GSTIN', type: 'select', value: vend.gstin, required: true }) : '',
    hasSite ? UI.field({ label: 'Vendor site', type: 'select', value: UI.esc(vend.site), required: true }) : '',
    hasPeriod ? UI.field({ label: 'Service period from', type: 'date', value: f.from, required: true }) : '',
    hasPeriod ? UI.field({ label: 'Service period to', type: 'date', value: f.to, required: true }) : '',
    hasDesc ? UI.field({ label: cid === 'bw-intl' ? 'Comments' : 'Type of invoice / description', value: UI.esc(f.desc), required: true }) : '',
    cid === 'bw-intl' ? UI.field({ label: 'Payment term', type: 'select', value: 'Controlled Expense - Property Manager Trade', required: true }) : ''
  ])] });

  var amounts = UI.section({ title: 'Amount Details', collapsible: true, body: [UI.grid(3, [
    f.noTax ? '' : UI.field({ label: cid === 'bw-intl' ? 'Invoice amount' : 'Base amount', value: UI.inr(f.base, 2), prefix: hasCur ? (f.cur || 'INR') : '', required: true }),
    taxSplit && intra ? UI.field({ label: 'CGST 9%', value: UI.inr(half, 2), required: cid === 'local-toco' }) : '',
    taxSplit && intra ? UI.field({ label: 'SGST 9%', value: UI.inr(half, 2), required: cid === 'local-toco' }) : '',
    taxSplit && !intra ? UI.field({ label: 'IGST 18%', value: UI.inr(tax, 2), required: cid === 'local-toco' }) : '',
    cid === 'bw-intl' ? '' : UI.field({ label: 'Total invoice amount', value: UI.inr(total, 2), required: true, error: err ? 'Base plus GST does not equal the total on the invoice copy (difference Rs 300.00).' : '' })
  ]), cid === 'bw-intl' ? UI.note({ text: 'Overseas vendor: no GST; currency and exchange rate follow the invoice (Oracle corporate rate).' }) : ''] });

  // lines: the columns of the sub-category's input format; results appear after Validate
  var R_ = function (s) { return UI.status(s, s === 'Processed' || s === 'Valid' ? 'ok' : ''); };
  var res = function (r) { return ok || err || loc ? r : '<span class="k-muted">After Validate</span>'; };
  var lines;
  if (cid === 'central-toco') lines = { cols: [{ key: 'n', label: 'Line' }, { key: 'site', label: 'Site ID / Airtel ID' }, { key: 'bu', label: 'BU / state' }, { key: 'per', label: 'Service period' }, { key: 'base', label: 'Base (Rs)', num: true, money: true }, { key: 'rem', label: 'Result' }],
    rows: [{ n: 1, site: 'DL-11106-0412<div class="k-muted k-small">DLDEL0412</div>', bu: '111 Delhi', per: '01-Sep to 30-Sep', base: 384147.56, rem: res(R_('Valid')) },
      { n: 2, site: 'DL-11106-0412<div class="k-muted k-small">DLDEL0412</div>', bu: '111 Delhi', per: '01-Sep to 30-Sep', base: 112637.56, rem: res(R_('Valid')) },
      { n: 3, site: 'DL-11109-0077<div class="k-muted k-small">DLDEL0077</div>', bu: '111 Delhi', per: '01-Sep to 30-Sep', base: 298395.12, rem: res(R_('Valid') + '<div class="k-small">2 lines merged</div>') },
      { n: 4, site: 'DL-11112-0301<div class="k-muted k-small">DLDEL0301</div>', bu: '111 Delhi', per: '01-Sep to 30-Sep', base: 26327.56, rem: res(err ? UI.status('Locator not found') : R_('Valid')), _flag: err },
      { n: 5, site: 'DL-11106-0518<div class="k-muted k-small">DLDEL0518</div>', bu: '111 Delhi', per: '01-Sep to 30-Sep', base: 301772.56, rem: res(R_('Valid')) },
      { n: '...', site: '<span class="k-muted">37 more lines</span>', bu: '', per: '', base: 440474.22, rem: '' }],
    foot: { n: 'Total (42)', base: f.base } };
  else if (cid === 'local-toco') lines = { cols: [{ key: 'n', label: 'Line' }, { key: 'site', label: 'Site ID / Airtel ID' }, { key: 'bu', label: 'BU code' }, { key: 'loc', label: 'Locator ID' }, { key: 'meter', label: 'Meter start / end' }, { key: 'base', label: 'Base (Rs)', num: true, money: true }, { key: 'rem', label: 'Result' }, { key: '_acts', label: '' }],
    rows: [{ n: 1, site: 'UPE-LKO-0412<div class="k-muted k-small">UPLKO0412</div>', bu: '121', loc: '12104-MLKO-0412207', meter: '', base: 18000, rem: res(R_('Processed')), _acts: ['trash'] },
      { n: 2, site: 'UPE-LKO-0412<div class="k-muted k-small">UPLKO0412</div>', bu: '121', loc: '12104-MLKO-0412207', meter: '12,410 / 13,105', base: 9200, rem: res(R_('Processed')), _acts: ['trash'] },
      { n: 3, site: 'UPE-BBK-0077<div class="k-muted k-small">UPBBK0077</div>', bu: '121', loc: '12109-MBBK-0077318', meter: '', base: 12800, rem: res(loc || err ? UI.status(loc ? 'Locator not found' : 'Locator inactive') : R_('Processed')), _acts: ['trash'], _flag: loc || err }],
    foot: { n: 'Total', base: f.base } };
  else if (cid === 'bw-dom') lines = { cols: [{ key: 'ckt', label: 'Circuit ID' }, { key: 'u', label: 'Per UOM cost (Rs)', num: true, money: true }, { key: 'rem', label: 'Result' }],
    rows: [{ ckt: 'CKT-BLR-NOC-30070', u: 64500, rem: res(R_('Valid')) },
      { ckt: 'CKT-BLR-WF-30112', u: 193505, rem: res(R_('Valid')) },
      { ckt: 'CKT-MYS-11871', u: 65520.42, _flag: err, rem: res(err ? UI.status('Billed before activation') + '<div class="k-small">Circuit activated on 15-Jul-2026</div>' : R_('Valid')) }],
    foot: { ckt: 'Total', u: f.base } };
  else if (cid === 'bw-intl') lines = { cols: [{ key: 'loc', label: 'Location' }, { key: 'opex', label: 'Opex head' }, { key: 'uom', label: 'UOM' }, { key: 'q', label: 'Quantity', num: true }, { key: 'u', label: 'Per UOM cost', num: true }, { key: 'cap', label: 'Capacity' }, { key: 'base', label: 'Total cost', num: true }, { key: 'rem', label: 'Result' }],
    rows: [{ loc: '323-USPP-2233587', opex: 'Bandwidth.International.NA', uom: 'Each', q: '1', u: '1,500.00', cap: '200GB', base: '1,500.00', rem: res(R_('Valid')) }] };
  else if (cid === 'll-eb') lines = { cols: [{ key: 'site', label: 'Site ID' }, { key: 'loc', label: 'Locator ID' }, { key: 'per', label: 'Billing period' }, { key: 'm', label: 'Meter start / end' }, { key: 'base', label: 'Base (Rs)', num: true, money: true }, { key: 'tot', label: 'Total (Rs)', num: true, money: true }, { key: 'rem', label: 'Result' }],
    rows: [{ site: 'MG4155', loc: '17330-MGOA-1182240', per: '01-Aug to 31-Aug', m: err ? '5,800 / 5,644' : '5,644 / 5,800', base: 10000, tot: total, _flag: err,
      rem: res(err ? UI.status('End reading lower than start') : R_('Valid')) }] };
  else if (cid === 'diesel') lines = { cols: [{ key: 'site', label: 'Site ID' }, { key: 'per', label: 'Period' }, { key: 'base', label: 'Amount (Rs)', num: true, money: true }, { key: 'rem', label: 'Result' }],
    rows: [{ site: 'UPE-KNP-0118', per: '01-Sep to 15-Sep', base: 31200, rem: res(R_('Valid')) }, { site: 'UPE-KNP-0127', per: '01-Sep to 15-Sep', base: 24600, rem: res(R_('Valid')) }, { site: 'UPE-UNN-0031', per: '01-Sep to 15-Sep', base: 22200, rem: res(R_('Valid')) }] };
  else lines = { cols: [{ key: 'site', label: 'Site ID' }, { key: 'loc', label: 'Locator ID' }, { key: 'base', label: 'Amount (Rs)', num: true, money: true }, { key: 'rem', label: 'Result' }],
    rows: [{ site: cid === 'll-sd' ? 'PUNE-LL-0533' : 'MH-14102-0418', loc: cid === 'll-sd' ? '14102-MPUN-0533' : '14102-MPUN-0418', base: f.base, rem: res(R_('Valid')) }] };
  var linesSec = UI.section({ title: 'Line Details', collapsible: true, body: [
    UI.table({ dense: true, pager: false, export: false, columns: lines.cols, rows: lines.rows, foot: lines.foot }),
    cid === 'central-toco' ? '' : UI.row([UI.textlink({ label: 'Add line', iconLeft: 'plus', toast: 'A new line is added' }), UI.textlink({ label: 'Upload lines from Excel', iconLeft: 'upload', go: 'inv-08?cat=' + cid })]),
    UI.note({ text: 'Locator, opex head, TDS and GST categories, payment term and vendor site are derived from masters for booking (' + UI.esc(c.locator) + '). Lines for the same locator and invoice are merged; lines with different budget heads stay separate.' })] });

  var docs = UI.section({ title: 'Documents', collapsible: true, body: [UI.grid(2, [
    UI.upload({ label: 'Invoice copy (PDF)', required: true, files: [{ name: f.inv.replace(/\//g, '_') + '.pdf', meta: '612 KB', status: err ? UI.status('Period not shown on the copy (checklist 14)') : ok ? UI.status('Read by OCR', 'ok') : '' }] }),
    cid === 'central-toco' ? UI.upload({ label: 'Working sheet (Excel)', required: true, hint: 'The invoice lines; Technical ID and ToCo ID cannot be blank', files: [{ name: 'IND_Sep26_working.xlsx', meta: '42 lines &middot; 188 KB' }] })
      : UI.upload({ label: 'Supporting documents', files: [] })])] });

  var submitted = UI.modal({ id: 'submitted', open: S === 'submitted', title: 'Invoice', accent: 'Submitted', size: 'narrow', body: [
    UI.kv({ cols: 2, items: [['Reference number', '<b>NPO-2627-004871</b>'], ['Status', INV.status('Submitted')]] }),
    UI.p('You are notified at every status change.', { muted: true })],
    foot: [UI.button({ label: 'Submit another', go: 'inv-03' }), UI.button({ label: 'Track invoice', variant: 'primary', go: 'inv-09' })] });

  var bar = UI.sticky({ totals: [['Total', money(cid === 'bw-intl' ? f.base : total)]],
    right: [UI.button({ label: 'Save', toast: 'Saved as draft' }), UI.button({ label: 'Validate', state: 'validated' }),
      ok ? UI.button({ label: 'Submit invoice', variant: 'primary', state: 'submitted' }) : UI.button({ label: 'Submit invoice', variant: 'disabled' })] });

  Page.render({
    id: 'inv-04', roleId: 'vendor', navKey: 'inv-03',
    variants: { label: 'Sub-category', param: 'cat', def: cid, items: PMS.map(function (x) { return { id: x.id, label: x.name.replace(' (landlord electricity)', '') }; }) },
    states: [{ id: 'errors', label: 'Validation errors' }, { id: 'locator', label: 'Locator not found' }, { id: 'validated', label: 'Validated' }, { id: 'submitted', label: 'Submitted' }],
    rail: { mode: 'form', title: 'Create Invoice', accent: 'Non-PO', back: partner ? 'inv-02' : 'inv-03', text: 'Fields marked <span class="k-link">*</span> are mandatory.' },
    html: head + onBehalf + checks + details + amounts + linesSec + docs + bar + submitted + chkModal
  });
})();
</script>
</body>
</html>
