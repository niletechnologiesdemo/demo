<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports - Non-PO Portal</title>
<link rel="stylesheet" href="../assets/airtel.css">
</head>
<body>
<script src="../assets/kit.js"></script>
<script src="../assets/page.js"></script>
<script src="inv-data.js"></script>
<script>
(function () {
  // The report catalogue is INV.reports in inv-data.js; each report opens on its own page (inv-25)
  var cards = UI.cards({ cols: 3, items: INV.reports.map(function (r) { return { left: true, icon: 'report', title: r.name, text: UI.esc(r.text), meta: ['For: ' + r.users], go: 'inv-25?r=' + r.id }; }) });
  var oracle = UI.section({ title: 'Oracle EBS reports used in the process', collapsible: true, collapsed: true, body: [UI.table({ dense: true, pager: false, export: false, columns: [{ key: 'r', label: 'Report' }, { key: 'u', label: 'Use' }],
    rows: [{ r: 'Airtel VPOT Report - GST', u: 'Validation of invoices and debit notes created in AP' }, { r: 'Airtel PN Opex Invoice Barcode Report - XML-GST', u: 'Barcode for AP invoices' }, { r: 'Airtel PN Site Attribute Status Report', u: 'Locator mapping and status (refreshed nightly)' },
      { r: 'Airtel Infrastructure OPEX Management Report (Text) - All Circle', u: UI.tbc('What the Airtel Infrastructure OPEX Management Report is used for') }, { r: 'Airtel Payment Status - Daily Pending Response Report to Each Person', u: UI.tbc('What the Airtel Payment Status - Daily Pending Response report is used for') }, { r: 'Airtel PN opex group records report', u: UI.tbc('What the Airtel PN opex group records report is used for') }] })] });
  Page.render({
    id: 'inv-20', roleId: 'apm',
    html: UI.page({ title: 'Reports', sub: 'Invoicing reports. Report formats are to be agreed with the business during detailed design.' }) + cards + oracle
  });
})();
</script>
</body>
</html>
