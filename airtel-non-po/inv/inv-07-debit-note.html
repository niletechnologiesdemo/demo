<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debit / credit note - Non-PO Portal</title>
<link rel="stylesheet" href="../assets/airtel.css">
</head>
<body>
<script src="../assets/kit.js"></script>
<script src="../assets/page.js"></script>
<script src="inv-data.js"></script>
<script>
(function () {
  /* Debit notes, credit notes and reversals (HLD 6.4). Every note is approved before it is booked; ToCo notes go through two stages.
     Fields follow the input formats (ToCo DN / Finance DN / reversals; manual DN and reversal; GST non-compliance DN and reversal). */
  var S = Page.state(), R = INV.role('phd');
  var DNS = INV.cats.filter(function (c) { return c.fam === 'DN'; });
  var cid = Page.param('cat') || (R.id === 'tax' ? 'gst-dn' : 'toco-dn'), c = INV.cat(cid);
  if (c.fam !== 'DN') { cid = 'toco-dn'; c = INV.cat(cid); }
  var err = S === 'errors', ok = S === 'validated' || S === 'submitted';
  var toco = /^toco/.test(cid), gstnc = /^gst/.test(cid), rev = /rev$/.test(cid);

  var CFG = {
    'toco-dn': { v: '322600', circle: 'Andhra Pradesh', inv: 'GTL/AP/DUPLICATE/JUL26', amt: 6895, gl: '4695060', desc: 'Rental', reason: 'Rental / Circle - GTL rental duplicate billing DN for Jul-26', ded: 'Center', fdoa: 'Circle' },
    'toco-fdn': { v: '412885', circle: 'Delhi', inv: 'IND/26/JUL/74410', amt: 41300, gl: '4232001', desc: 'Energy', reason: 'Excess energy billed against DG run hours, Jul-26', ded: 'Center', fdoa: 'Center' },
    'toco-rev': { v: '412885', circle: 'Delhi', inv: 'IND/26/JUL/74388', amt: 41300, gl: '4232001', desc: 'Energy', reason: 'Dispute resolved - vendor submitted DG logs, DN no longer valid', ded: 'Center', fdoa: 'Circle' },
    'toco-cn': { v: '412885', circle: 'Delhi', inv: 'INFR/CN/26/0091', amt: 18250, gl: '4271004', desc: 'Rent', reason: 'Credit for site decommissioned 12-Aug-2026', ded: 'Center', fdoa: 'Center' },
    'man-dn': { v: '410455', circle: 'Karnataka', inv: 'VCS/26/1188', amt: 120000, gl: '4652011', desc: 'SLA penalty - call centre, Aug-26', reason: 'Answer-rate SLA missed for 9 days in Aug-26' },
    'man-rev': { v: '410455', circle: 'Karnataka', inv: 'VCS/26/1102', amt: 45000, gl: '4652011', desc: 'Reversal of SLA penalty - Jul-26', reason: 'Penalty waived after root-cause review', orig: 'VCS/26/1102/DN' },
    'gst-dn': { v: '395966', circle: 'Delhi', inv: 'GSTNONCOMPLIANCE-SEP26-B2-26-27-BAL-112', amt: 4016, gl: '2434234, 2434235', desc: 'Debit note for GST exposure of 2B and 6A reco - 26-27 - BAL' },
    'gst-rev': { v: '395966', circle: 'Delhi', inv: 'GSTNONCOMPLIANCE-JUL26-B2-26-27-BAL-69', amt: 4016, gl: '2434234, 2434235', desc: 'GST non-compliance debit note reversal', orig: 'GSTNONCOMPLIANCE-JUL26-B2-26-27-BAL-69' }
  };
  var f = CFG[cid], vend = INV.vendors[f.v], ci = INV.circles[f.circle];
  var neg = !rev, amt = neg ? -f.amt : f.amt;
  // note number rules (HLD Table 9): ToCo DN invoice/DN, Finance DN invoice/DNF, ToCo reversal invoice/REV, manual reversal = DN number, GST NC reversal = DN/REV
  var noteNo = { 'toco-cn': f.inv, 'toco-rev': f.inv + '/REV', 'man-rev': f.orig, 'gst-dn': f.inv, 'gst-rev': f.orig + '/REV' }[cid] || f.inv + (c.suffix || '');
  var F = function (label, value, o) { o = o || {}; o.label = label; o.value = value; return UI.field(o); };

  var head = UI.row([UI.p('<b>' + UI.esc(c.name) + '</b>', {}), UI.textlink({ label: 'Change note type', iconLeft: 'chevLeft', go: 'inv-03' })]);
  var vendor = F('Vendor', UI.esc(vend.name) + ' &middot; ' + f.v, { type: 'lookup', required: true });
  var site = F('Vendor site', UI.esc(vend.site), { type: 'select', required: true });

  var fields, copied = '';
  if (toco) fields = [
    F('Operating unit', ci.ou, { type: 'select', required: true }), vendor, site,
    cid === 'toco-cn' ? F('Supplier GSTIN', vend.gstin, { type: 'select', required: true }) : '',
    F(cid === 'toco-cn' ? 'Credit note number' : 'Invoice number', UI.esc(f.inv), { required: true, wrap: true, error: err ? 'Invoice ' + UI.esc(f.inv) + ' is not booked for this vendor in Oracle.' : '' }),
    F('Original tax invoice number', '', { placeholder: 'Optional' }), F('Original tax invoice date', '', { type: 'date' }),
    F('Base amount', UI.inr(f.amt, 2), { prefix: 'INR', required: true }), F('Description', UI.esc(f.desc), { required: true }), F('GL code', f.gl, { type: 'lookup', required: true }),
    F('Deduction type', f.ded, { type: 'select', required: true }), F('FDOA (centre / circle)', f.fdoa, { type: 'select', required: true }),
    { span: 3, html: F('Reason', UI.esc(f.reason), { required: true, wrap: true }) }];
  else if (cid === 'gst-dn') fields = [
    F('Operating unit / BU code', 'BAL B&amp;T Delhi &middot; 204', { type: 'select', required: true }), vendor, site,
    F('Supplier GSTIN', vend.gstin, { type: 'select', required: true }), F('Airtel GSTIN', ci.gstin, { type: 'select', required: true }),
    F('Debit note number', UI.esc(f.inv), { required: true, wrap: true }), F('Debit note date', '29/09/2026', { type: 'date', required: true }),
    F('Base amount', UI.inr(f.amt / 2, 2), { prefix: 'INR', required: true }), F('CGST 9%', '1,004.00'), F('SGST 9%', '1,004.00'), F('Total amount', UI.inr(f.amt, 2), { required: true }),
    F('Item code', 'ARITM1471', { type: 'lookup', required: true }), F('GL code', f.gl, { type: 'lookup', required: true }),
    { span: 2, html: F('Description', UI.esc(f.desc), { required: true, wrap: true }) }];
  else if (cid === 'gst-rev') {
    fields = [F('Debit note to reverse', UI.esc(f.orig), { type: 'lookup', required: true, wrap: true, error: err ? 'This debit note is not booked in Oracle AP.' : '' }), F('Reversal date', '02/10/2026', { type: 'date', required: true })];
    copied = UI.subhead('Copied from the original debit note') + UI.kv({ cols: 3, items: [['Vendor', UI.esc(vend.name) + ' &middot; ' + f.v + ' &middot; ' + UI.esc(vend.site)], ['Supplier / Airtel GSTIN', vend.gstin + ' / ' + ci.gstin],
      ['Operating unit / BU', 'BAL B&amp;T Delhi &middot; 204'], ['Amount', 'Base 2,008.00 &middot; GST 2,008.00 &middot; total ' + UI.inr(f.amt, 2)], ['Item code / GL', 'ARITM1471 &middot; ' + f.gl], ['Pay group', 'Network Rent']] });
  } else fields = [
    F('Operating unit / BU code', ci.ou + ' &middot; ' + ci.bu, { type: 'select', required: true }), vendor, site,
    F(rev ? 'Debit note to reverse' : 'Debit note number', UI.esc(rev ? f.orig : f.inv + '/DN'), { type: rev ? 'lookup' : 'text', required: true, error: err ? (rev ? 'This debit note is not booked for the vendor.' : 'The original invoice is not booked for this vendor in Oracle.') : '' }),
    F(rev ? 'Amount' : 'Debit note amount', UI.inr(f.amt, 2), { prefix: 'INR', required: true }), F('Currency', 'INR', { type: 'select', required: true }),
    F('GL code', f.gl, { type: 'lookup', required: true }), { span: 2, html: F('Description', UI.esc(f.desc), { required: true, wrap: true }) },
    { span: 3, html: F('Remarks', UI.esc(f.reason), { wrap: true }) }];
  var details = UI.section({ title: 'Note Details', collapsible: true, body: [UI.grid(3, fields), copied,
    UI.note({ text: (neg ? 'Booked as a negative amount. ' : '') + (toco ? 'Recorded first in the ToCo credit / debit note form, then booked in AP. ' : 'Booked directly in AP. ') + 'The note number in Oracle is ' + UI.esc(noteNo) + '.' })] });

  var req = UI.section({ title: 'Request and Approvals', collapsible: true, body: [
    UI.upload({ label: gstnc ? 'Tax team approvals' : 'Circle request and approvals', required: true, files: err ? [] : [{ name: gstnc ? 'TaxTeam_GSTNC_Sep26_approval.pdf' : 'Circle_DN_request_approval.msg', meta: '142 KB' }],
      hint: err ? '' : 'Approval documents are mandatory' }),
    err ? UI.alert({ tone: 'red', text: 'Approval documents are mandatory before a note can be approved.' }) : ''] });

  var pa = /^toco-(dn|rev)$/.test(cid) ? UI.note({ text: rev ? 'When this reversal is validated, Provisioning & Actualization reverses the provision created for the original debit note (month-end activity).' : 'When this debit note is validated, Provisioning & Actualization creates a provision with the debit note number in its URN (month-end activity).' }) : '';

  var nErr = (details.match(/k-ferr/g) || []).length + (err ? 1 : 0);
  var checks = err ? UI.alert({ tone: 'red', title: nErr + ' errors need correction before you can submit.', text: 'Correct the fields marked in red and validate again.' })
    : ok ? UI.alert({ tone: 'ok', title: 'All checks passed.', text: 'Mandatory fields and approvals present, vendor and site valid, note number unique and within 50 characters' + (rev ? ', original note found and booked' : '') + '.' }) : '';

  var submitted = UI.modal({ id: 'submitted', open: S === 'submitted', title: 'Note', accent: 'Submitted', size: 'narrow', body: [
    UI.kv({ cols: 2, items: [['Reference number', '<b>NPO-2627-004874</b>'], ['Status', INV.status('Submitted')], ['Note number', '<span class="k-urn wrap-any">' + UI.esc(noteNo) + '</span>']] }),
    UI.p('Booked in Oracle after it is approved.', { muted: true })],
    foot: [UI.button({ label: 'Raise another', go: 'inv-07' }), UI.button({ label: 'Track', variant: 'primary', go: 'inv-09' })] });

  var bar = UI.sticky({ totals: [['Amount', 'Rs ' + UI.inr(amt, 2)]],
    right: [UI.button({ label: 'Save', toast: 'Saved as draft' }), UI.button({ label: 'Validate', state: 'validated' }),
      ok ? UI.button({ label: 'Submit for approval', variant: 'primary', state: 'submitted' }) : UI.button({ label: 'Submit for approval', variant: 'disabled' })] });

  Page.render({
    id: 'inv-07', roleId: 'phd', navKey: 'inv-03',
    variants: { label: 'Note type', param: 'cat', def: cid, items: DNS.map(function (x) { return { id: x.id, label: x.name.replace('GST non-compliance', 'GST NC').replace(' / Finance DN', '') }; }) },
    states: [{ id: 'errors', label: 'Validation errors' }, { id: 'validated', label: 'Validated' }, { id: 'submitted', label: 'Submitted' }],
    rail: { mode: 'form', title: rev ? 'Reversal' : cid === 'toco-cn' ? 'Credit Note' : 'Debit Note', accent: gstnc ? 'GST' : toco ? 'ToCo' : 'Non-PO', back: 'inv-03', text: 'Fields marked <span class="k-link">*</span> are mandatory.' },
    html: head + checks + details + req + pa + bar + submitted
  });
})();
</script>
</body>
</html>
