<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP / Rush invoice - Non-PO Portal</title>
<link rel="stylesheet" href="../assets/airtel.css">
</head>
<body>
<script src="../assets/kit.js"></script>
<script src="../assets/page.js"></script>
<script src="inv-data.js"></script>
<script>
(function () {
  /* One document-wise form for the Rush / AP categories (HLD 6.3). AP invoices are approved on the portal first, then booked in AP.
     Fields follow the category's input format (requirements/AP_Invoice_format); derived booking fields are not shown to the submitter. */
  var S = Page.state(), R = INV.role('circle');
  var APS = INV.cats.filter(function (c) { return c.fam === 'AP' && c.page === 'inv-05'; });
  var cid = Page.param('cat') || 'rush', c = INV.cat(cid);
  if (c.page !== 'inv-05') { cid = 'rush'; c = INV.cat(cid); }
  var err = S === 'errors', ok = S === 'validated' || S === 'submitted';

  var CFG = {
    rush: { v: '600402', circle: 'UP East', inv: 'SKP/26-27/118', date: '29/09/2026', base: 54500, gl: '4282010', desc: 'Emergency DG hire - BTS outage, Kanpur cluster' },
    advance: { v: '600402', circle: 'UP East', inv: 'SKP/PI/26-27/014', date: '24/09/2026', base: 200000, gl: '2722011', desc: 'Advance for DG overhaul - 50% of PO 4500921187' },
    row: { v: '815429', circle: 'Madhya Pradesh', inv: 'Kramank /1759/2026RAMPURA', date: '10/08/2026', base: 2492000, noTax: true },
    sacfa: { v: '246689', circle: 'J&K', inv: 'S20260016392', date: '08/09/2026', base: 24000, noTax: true, gl: '2251001' },
    legal: { v: '410612', circle: 'Karnataka', inv: 'LEX/26/0233', date: '28/08/2026', base: 350000, noTax: true, rcm: true, gl: '4212004', urn: '131·410612·LEGAL007·AUG-26' },
    caf: { v: '373921', circle: 'Odisha', inv: 'OD/CAF/BAL/2026-27/442', date: '02/09/2026', base: 16000, noTax: true, gl: '4745017' },
    bsnl: { v: '202546', circle: 'Meghalaya', inv: 'DR20261700000574', date: '30/07/2026', base: 526.03, gl: '4671004' },
    group: { v: '200014', circle: 'Delhi', inv: 'NXD/26-27/2291', date: '20/09/2026', base: 2840000, gl: '4351045', item: 'ARITM5312', desc: 'Rack space and power - Sep 2026' },
    iuc: { v: '202546', circle: 'Meghalaya', inv: 'IUC/MEG/2026/08/114', date: '05/09/2026', base: 182080, item: 'NET000838', desc: 'IUC - Aug 2026' },
    bank: { v: '517217', circle: 'APO', inv: 'AIRTEL414', date: '04/09/2026', base: 18930.84, gl: '9000033', item: 'ARITEM868', desc: 'Card and cash handling charges - Aug 2026' },
    apbl: { v: '410455', circle: 'Delhi', ou: 'Airtel Payments Bank Ltd - Delhi', inv: 'VCS/APB/26/0377', date: '22/09/2026', base: 412000, gl: '4652011', desc: 'Inbound call centre - APBL helpline' },
    credit: { v: '600388', circle: 'Karnataka', inv: 'MFL/CN/26-27/021', date: '18/09/2026', base: -18000, gl: '4271012', item: 'NET000832', desc: 'Credit for SLA breach on CKT-BLR-WF-30112' },
    govt: { v: '535444', circle: 'APO', inv: 'DL/AP/26-27/0630', date: '19/09/2026', base: 23355870, gl: '4212003', igst: true },
    tds: { v: '410022', circle: 'Delhi', inv: 'SFS/TDS/26-27/004', date: '23/09/2026', base: 9700, noTax: true, gl: '2434101', desc: 'TDS deducted at 2% instead of 1% on SFS/2026/0888' },
    others: { v: '410022', circle: 'Delhi', inv: 'SFS/2026/0961', date: '05/09/2026', base: 485000, desc: 'Security guarding services - Delhi offices, Aug 2026', urn: '111·410022·SECURITY001·AUG-26' }
  };
  var f = CFG[cid], vend = INV.vendors[f.v], ci = INV.circles[f.circle];
  var intra = !f.igst && (!vend.gstin || vend.gstin.slice(0, 2) === ci.gstin.slice(0, 2));
  var tax = f.noTax ? 0 : Math.round(f.base * 0.18 * 100) / 100, half = tax / 2, total = f.base + tax;
  var neg = cid === 'credit', dn = cid === 'row' || cid === 'caf';
  // what the category's input format carries
  var single = /^(rush|advance|tds)$/.test(cid), basic = /^(bsnl|legal|sacfa|caf|govt)$/.test(cid);
  var hasDesc = !!f.desc, hasGstins = /^(bank|credit|group|iuc)$/.test(cid), hasItem = !!f.item;
  var glReq = /^(bsnl|legal|sacfa|caf|bank|credit|group)$/.test(cid), initiator = /^(rush|advance|tds|bsnl|legal)$/.test(cid);
  var F = function (label, value, o) { o = o || {}; o.label = label; o.value = value; return UI.field(o); };

  var head = UI.row([UI.p('<b>' + UI.esc(c.name) + '</b> &middot; AP (approved on the portal, then booked)', {}), UI.textlink({ label: 'Change category', iconLeft: 'chevLeft', go: 'inv-03' }),
    UI.tbc("AP categories are submitted by Airtel users on the vendor's behalf; to be confirmed by Airtel (BRD Step 1 has vendors submitting every category)")]);

  // Airtel users submit AP invoices on the vendor's behalf
  var onBehalf = UI.section({ title: 'Submitting for', body: [UI.grid(3, [
    F('Vendor', UI.esc(vend.name) + ' &middot; ' + f.v, { type: 'lookup', required: true })])] });

  /* --------------------------------- invoice details: the columns of the category's input format */
  var numLabel = dn ? 'Demand note number' : neg ? 'Credit note number' : 'Invoice number';
  var numErr = !err ? '' : dn ? 'The number has 59 characters; Oracle accepts 50. It is booked shortened by the prefix / suffix rule, with CFR approval.' : 'GST invoice numbers allow at most 16 characters.';
  var details = UI.section({ title: 'Invoice Details', collapsible: true, body: [UI.grid(3, [
    F('Operating unit (circle)', UI.esc(f.ou || ci.ou), { type: R.id === 'circle' ? 'readonly' : 'select', required: true }),
    F('Vendor site', UI.esc(vend.site), { type: 'select', required: true, error: err && cid === 'others' ? 'Vendor site ' + vend.site + ' is inactive. Refer to the circle to activate it.' : '' }),
    hasGstins ? F('Airtel GSTIN (bill to)', ci.gstin, { type: 'select', required: true }) : '',
    hasGstins ? F('Supplier GSTIN', vend.gstin || '-', { type: 'select', required: true }) : '',
    F(numLabel, err && dn ? 'E1/293/PALWANCHA/AIRTELOFC/ROADCUTTING/DEMANDNOTICE/2026-27' : UI.esc(f.inv), { required: true, wrap: true, error: numErr }),
    F(dn ? 'Demand note date' : neg ? 'Credit note date' : 'Invoice date', err && !dn ? '03/10/2026' : f.date, { type: 'date', required: true, error: err && !dn ? 'Future dates are not allowed.' : '' }),
    hasDesc ? F('Description', UI.esc(f.desc), { required: cid !== 'iuc', wrap: true }) : '',
    cid === 'others' ? F('Nature of expense', 'Facility - security services', { type: 'select', required: true }) : '',
    f.gl && cid !== 'iuc' ? F('GL code', f.gl, { type: 'lookup', required: glReq }) : '',
    hasItem ? F('Item code', f.item, { type: 'lookup', required: true }) : ''
  ])] });

  /* --------------------------------- category inputs (format columns and BRD rules) */
  var extra = [];
  if (cid === 'rush') extra = [F('Rush reason', err ? '' : 'Site outage - emergency service', { type: 'select', required: true, error: err ? 'Select a Rush reason.' : '' })];
  if (cid === 'advance') extra = [UI.options({ label: 'Advance type', required: true, items: [{ label: 'PO advance', on: true }, { label: 'Non-PO advance' }] }),
    F('PO number', '4500921187', { type: 'lookup', required: true, error: err ? 'The pro-forma amount must agree with the advance terms of this PO.' : '' }),
    UI.options({ label: 'Opex / capex', required: true, items: [{ label: 'Opex', on: true }, { label: 'Capex' }] })];
  if (cid === 'row') extra = [F('Route name (as per CWIP)', 'Neemuch-Manasa-Bhanpura'), F('ENFA number', 'General/6036/275856'), F('Business NFA number', 'Business/6031/88929'),
    F('Category', 'Restoration charge', { type: 'select' }), F('Locator code', '61023.TNGC.3077608.CONT1221'), F('Site', 'EFT-9363'),
    F('Circle', 'MPCG'), F('Section length (m)', '500'), F('FF / Homes', 'FF', { type: 'select' }),
    F('Partner name', 'DSP Corporate Solutions Pvt Ltd'), F('Beneficiary', 'CMO Nagar Panchayat Parishad Rampura'), F('PO number', '10006643, 10006680'),
    F('Remarks (payment mode)', 'NEFT / RTGS', { type: 'select' }), F('Payment terms', 'Immediate', { type: 'select' }), F('Pay group', 'ROW and other Govt payments', { type: 'select' })];
  if (cid === 'credit') extra = [F('Original tax invoice number', err ? '' : 'MFL/BLR/26/0874', { required: true, error: err ? 'Original tax invoice number is mandatory for a credit note.' : '' }),
    F('Original tax invoice date', '14/08/2026', { type: 'date', required: true }), F('IUT code', '')];
  if (cid === 'group') extra = [F('IUT code', '611'), F('Product name', 'Colocation'), F('Line item name', 'Rack space and power'), F('LSI', 'LSI-88120')];
  if (cid === 'bank') extra = [F('Account number', 'XXXXXXXX4471'), F('UID', 'UID-26-0918'), F('Remarks', 'Lot-2')];
  if (cid === 'iuc') extra = [F('Type', 'SMS', { type: 'select' }), F('Cost circle / BAL circle', 'Meghalaya / NESA'), F('Operator circle', 'BSNL Meghalaya'),
    F('BSNL circle / BU', 'MEG / 4417'), F('Invoice period', 'Aug-2026'), F('Due date', '05/10/2026', { type: 'date' }), F('PDF invoice reference', 'BSNL/MEG/IUC/0826'),
    F('TDS section', '194J', { type: 'select', required: true }), F('TDS tax category', 'TDS_194J_10_4417', { type: 'select', required: true })];
  if (cid === 'apbl') extra = [F('Cost centre', 'CC-APB-2201 &middot; Customer care', { type: 'lookup' }) + UI.tbc('APBL invoices: whether cost centre is mandatory (ERP logic to check)')];
  // format columns 'Initiator name' and 'OLM ID': one lookup by OLM ID that fills in the name
  if (initiator) extra = extra.concat([F('Initiator (OLM ID)', (R.id === 'circle' ? 'B0UPE118' : 'B0UPE204') + ' &middot; Circle operations - ' + UI.esc(f.circle), { type: 'lookup', required: true })]);
  var extraSec = extra.length ? UI.section({ title: UI.esc(c.name.replace(/ \(.*\)$/, '')) + ' Details', collapsible: true, body: [UI.grid(3, extra)] }) : '';

  /* --------------------------------- amounts, as the format gives them */
  var taxF = function () {
    if (f.noTax) return [];
    return intra ? [F('CGST 9%', UI.inr(half, 2)), F('SGST 9%', UI.inr(half, 2))] : [F('IGST 18%', UI.inr(tax, 2))];
  };
  var amtFields = cid === 'row' ? [F('Demand note amount', UI.inr(f.base, 2), { required: true })]
    : single ? [F('Invoice amount', UI.inr(f.base, 2), { prefix: 'INR', required: true })]
    : [F(basic ? 'Basic amount' : 'Base amount', UI.inr(f.base, 2), { required: true })].concat(
        cid === 'iuc' ? [F('Deduction', '2,140.00'), F('Passed amount', UI.inr(f.base, 2), { type: 'readonly' })] : [],
        taxF(), [F('Total invoice amount', UI.inr(total, 2), { required: true, error: err && cid === 'bsnl' ? 'Basic plus GST (620.72) does not equal the total on the invoice (621.00).' : '' })]);
  amtFields.push(F('Currency', 'INR', { type: 'select', required: /rush|advance|tds|caf|bank|credit|group|iuc/.test(cid) }));
  if (cid === 'legal' || cid === 'row') amtFields.push(UI.options({ label: 'Reverse charge (RCM)', items: [{ label: 'No', on: !f.rcm }, { label: 'Yes', on: !!f.rcm }] }));
  amtFields.push(UI.options({ label: 'Pay alone', items: [{ label: 'No', on: true }, { label: 'Yes' }] }));
  var amounts = UI.section({ title: 'Amount Details', collapsible: true, body: [UI.grid(3, amtFields),
    cid === 'iuc' ? UI.table({ dense: true, pager: false, export: false, columns: [{ key: 'g', label: 'GL code' }, { key: 'a', label: 'Amount (Rs)', num: true, money: true }],
      rows: [{ g: '4393063', a: 160240 }, { g: '1229611', a: 21840 }], foot: { g: 'Total', a: f.base } }) : ''] });

  // optional link to the provision this invoice settles (P&A HLD 5.4.1), for Airtel users
  var urnSec = (f.urn || /rush|legal|bsnl/.test(cid)) ? UI.section({ title: 'Provision (URN)', sub: 'Optional', collapsible: true, collapsed: !f.urn, body: [UI.grid(3, [
    F('Provision URN', f.urn ? '<span class="k-urn">' + f.urn + '</span>' : '', { type: 'lookup', placeholder: 'Search open provisions for this vendor' }),
    UI.textlink({ label: 'Show open provisions', icon: 'arrowRight', modal: 'urns' })]),
    UI.note({ text: 'If no URN is given, the matching engine rebuilds the key from BU, vendor, item code and service month.' })] }) : '';

  var docSets = {
    rush: [['Tax invoice (PDF)', true], ['Approved NFA or approval email', true]],
    tds: [['Tax invoice / TDS working (PDF)', true], ['Approval email', true]],
    advance: [['Pro-forma invoice (PDF)', true], ['PO copy', true], ['Approved NFA or approval email', true]],
    row: [['Demand note copy with stamp and signature', true], ['Approved General NFA and approval email', true], ['Translation copy (regional language demand note)', false]],
    sacfa: [['Saral Sanchar snapshot 1 (application ID, date, site count)', true], ['Saral Sanchar snapshot 2 (payable amount)', true]],
    caf: [['Challan copy', true], ['Demand from the authority', true], ['NFA or approval email', true]],
    govt: [['Invoice / demand copy', true], ['Approval email', true]],
    bank: [['Bank invoice (PDF; give the password if it is protected)', true]]
  };
  var ds = docSets[cid] || [[neg ? 'Credit note (PDF)' : 'Tax invoice (PDF)', true], ['Supporting documents', false]];
  var docSec = UI.section({ title: 'Documents', collapsible: true, body: [UI.grid(2, ds.map(function (d, i) {
    return UI.upload({ label: d[0], required: d[1], files: i === 0 ? [{ name: f.inv.replace(/[\/ ]/g, '_') + '.pdf', meta: '318 KB', status: err ? UI.status('Period not shown on the copy (checklist 14)') : ok ? UI.status('Read by OCR', 'ok') : '' }]
      : i === 1 && d[1] ? [{ name: /NFA/.test(d[0]) ? 'NFA_General_approved.pdf' : 'Approval_mail.msg', meta: '96 KB' }] : [] });
  }))] });

  // Validate runs the invoice checklist (HLD 5.4) on the OCR output before submission; checks 12 and 13 are confirmed by the PHD team
  var chk = INV.checklist.map(function (k) {
    var n = k[0], res = 'pass';
    if ((n === 10 && vend.irn !== 'Yes') || (n === 17 && !f.rcm) || (n === 18 && !neg) || ((n === 8 || n === 16) && !vend.gstin) || (n === 11 && f.noTax)) res = 'na';
    if (INV.REVIEW_CHECKS.indexOf(n) >= 0) res = 'manual';
    if (err && (n === 14 || (n === 3 && !dn) || (n === 2 && !dn) || (n === 7 && cid === 'bsnl') || (n === 18 && neg))) res = 'fail';
    return { no: n, check: UI.esc(k[1]), source: res === 'manual' ? 'PHD team, after submission' : 'On Validate', result: res };
  });
  var passed = chk.filter(function (k) { return k.result === 'pass'; }).length;
  var chkModal = UI.modal({ id: 'chk', title: 'Invoice', accent: 'Checklist', size: 'wide', body: [UI.checklist({ columns: ['#', 'Check', 'Checked', 'Result', ''], rows: chk })],
    foot: [UI.button({ label: 'Close', variant: 'primary', close: true })] });
  var viewChk = UI.textlink({ label: 'View checklist', icon: 'arrowRight', modal: 'chk' });
  var nErr = ((details + extraSec + amounts).match(/k-ferr/g) || []).length + 1;
  var checks = err ? UI.alert({ tone: 'red', title: nErr + ' errors need correction before you can submit.', text: 'Correct the fields marked in red, or upload a corrected invoice copy, and validate again.', actions: [viewChk] })
    : ok ? UI.alert({ tone: 'ok', title: 'All checks passed.', text: passed + ' checklist items passed on the invoice copy' + (vend.irn === 'Yes' ? ', including the IRN QR code' : '') + '. Signature and invoice form are confirmed by the PHD team after submission.', actions: [viewChk] }) : '';

  // approved, open provisions of the sample vendors (as in pa-data.js); URNs exist only after approval
  var OPEN = { '111·410022': [['111·410022·SECURITY001·AUG-26', 'Aug-26', 485000]], '131·410612': [['131·410612·LEGAL007·AUG-26', 'Aug-26', 350000]] }[ci.bu + '·' + f.v] || [];
  var urns = UI.modal({ id: 'urns', title: 'Open', accent: 'Provisions', size: 'wide', body: [UI.p('Approved provisions for ' + UI.esc(vend.name) + ' in BU ' + ci.bu + ' that are still open. Select the one this invoice settles.', { muted: true }),
    UI.table({ dense: true, pager: false, export: false, select: true, columns: [{ key: 'u', label: 'URN' }, { key: 'm', label: 'Month' }, { key: 'a', label: 'Open balance (Rs)', num: true, money: true }, { key: 's', label: 'Status' }],
      rows: OPEN.map(function (o) { var on = o[0] === f.urn; return { u: '<span class="k-urn">' + o[0] + '</span>', m: o[1], a: o[2], s: UI.status('Open'), _checked: on, _sel: on }; }),
      empty: 'No open provisions for this vendor in BU ' + ci.bu + '. After booking, the matching engine looks for one by BU, vendor, item code and service month.' })],
    foot: [UI.button({ label: 'Cancel', variant: 'text', close: true }), UI.button({ label: 'Link URN', variant: 'primary', close: true, toast: 'Provision linked to the invoice' })] });

  var submitted = UI.modal({ id: 'submitted', open: S === 'submitted', title: neg ? 'Credit note' : 'Invoice', accent: 'Submitted', size: 'narrow', body: [
    UI.kv({ cols: 2, items: [['Reference number', '<b>NPO-2627-004872</b>'], ['Status', INV.status('Submitted')]] }),
    UI.p('You are notified at every status change.', { muted: true })],
    foot: [UI.button({ label: 'Submit another', go: 'inv-03' }), UI.button({ label: 'Track invoice', variant: 'primary', go: 'inv-09' })] });

  var bar = UI.sticky({ totals: [['Total', 'Rs ' + UI.inr(total, 2)]],
    right: [UI.button({ label: 'Save', toast: 'Saved as draft' }), UI.button({ label: 'Validate', state: 'validated' }),
      ok ? UI.button({ label: 'Submit invoice', variant: 'primary', state: 'submitted' }) : UI.button({ label: 'Submit invoice', variant: 'disabled' })] });

  Page.render({
    id: 'inv-05', roleId: 'circle', navKey: 'inv-03',
    variants: { label: 'Category', param: 'cat', def: cid, items: APS.map(function (x) { return { id: x.id, label: x.name.replace(' (prepayment)', '').replace(' (right of way)', '').replace(' (incl. broadband)', '') }; }) },
    states: [{ id: 'errors', label: 'Validation errors' }, { id: 'validated', label: 'Validated' }, { id: 'submitted', label: 'Submitted' }],
    rail: { mode: 'form', title: 'Create Invoice', accent: 'Non-PO', back: 'inv-03', text: 'Fields marked <span class="k-link">*</span> are mandatory.' },
    html: head + onBehalf + checks + details + extraSec + amounts + urnSec + docSec + bar + submitted + chkModal + urns
  });
})();
</script>
</body>
</html>
