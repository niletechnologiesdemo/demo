      force ? UI.field({ label: 'NFA approved amount', type: 'readonly', value: 'Rs ' + UI.inr(Math.abs(f.base), 2) + ' - matches', src: 'blue' })
        : UI.field({ label: 'Approvers (HRMS / DOA)', type: 'readonly', value: total > 500000 ? 'B0APR219, then B0APR030' : 'B0APR219', src: 'blue' })]),
    UI.tbc('Zone, location and category inputs for DOA initiation to be confirmed with the ERP team')] });

  var bookBody = [UI.grid(3, [
    UI.field({ label: 'Invoice type', type: 'readonly', value: UI.esc(c.invType), src: 'blue' }),
    UI.field({ label: 'GL code / item code', type: 'readonly', value: f.gl + (cid === 'group' ? ' &middot; ARITM5312' : ' &middot; from item code list'), src: 'grey', hint: 'From the Quality Plan and the GPA item code list for the nature of expense' }),
    UI.field({ label: 'Payment term / pay group', type: 'readonly', value: UI.esc(c.term) + ' &middot; ' + UI.esc(cid === 'group' ? 'Network Rent' : c.payGroup), src: 'grey', hint: cid === 'group' ? 'Contractor for foreign currency, RR PREPAID CROSS CHARGE for LAPU, Network Rent otherwise' : 'From the rush / priority logic in the Quality Plan' }),
    UI.field({ label: 'Inventory org / location', type: 'readonly', value: ci.bu + '-INV &middot; ' + UI.esc(f.circle) + ' office', src: 'grey', hint: 'From the AP master by BU code and Airtel GSTIN (ISD location where the GSTIN is an input service distributor)' }),
    UI.field({ label: 'GST tax category', type: 'readonly', value: f.noTax ? (f.rcm ? 'RCM_Legal_18' : 'Not applied') : (f.igst ? 'OutState_IGST18' : 'WithinState_GST18'), src: 'blue' }),
    UI.field({ label: 'GL date', type: 'readonly', value: '01-Oct-2026', src: 'blue', hint: 'If AP is already closed for the month, the GL date is the 1st of the next month' })])];
  if (cid === 'row') bookBody.push(UI.table({ dense: true, pager: false, export: false, columns: [{ key: 'l', label: 'Booking line' }, { key: 't', label: 'Invoice type' }, { key: 'n', label: 'Number in Oracle' }, { key: 'a', label: 'Amount (Rs)', num: true }],
    rows: [{ l: 'Base (restoration, rent, application fees)', t: 'STANDARD', n: 'Kramank /1759/2026RAMPURA', a: '24,92,000.00' }, { l: 'GST, where GST applies', t: 'PREPAYMENT', n: 'Right / left 46 characters + "/GST"', a: 'Not applicable' }] }));
  var book = UI.section({ title: 'Booking Details', sub: 'Derived; booked in AP only after all approvals', collapsible: true, collapsed: !ok, body: bookBody });

  var docSets = {
    rush: [['Tax invoice (PDF)', true], ['Approved NFA or approval email', true], ['Input sheet (prescribed format)', false]],
    tds: [['Tax invoice / TDS working (PDF)', true], ['Approval email', true]],
    advance: [['Pro-forma invoice (PDF)', true], ['PO copy', true], ['Approved NFA or approval email', true]],
    row: [['Demand note copy with stamp and signature', true], ['Approved General NFA and approval mail', true], ['Input sheet (ROW format)', true], ['Translation copy (regional language demand note)', false]],
    sacfa: [['Saral Sanchar snapshot 1 (application ID, date, site count)', true], ['Saral Sanchar snapshot 2 (payable amount)', true], ['Input sheet', true]],
    caf: [['Challan copy', true], ['Demand from the authority', true], ['NFA or approval email', true]],
    govt: [['Invoice / demand copy', true], ['Approval email', true]],
    bank: [['Bank invoice (PDF, may be password-protected)', true], ['Input sheet', false]]
  };
  var ds = docSets[cid] || [['Tax invoice (PDF)', true], ['Supporting documents / input sheet', false]];
  var docSec = UI.section({ title: 'Documents', collapsible: true, body: [UI.grid(2, ds.map(function (d, i) {
    return UI.upload({ label: d[0], required: d[1], hint: i === 0 ? 'PDF only; read by OCR' + (vend.irn === 'Yes' ? ' and IRN QR scanning' : '') : '', files: i === 0 ? [{ name: f.inv.replace(/[\/ ]/g, '_') + '.pdf', meta: '318 KB', status: UI.status('Read by OCR', 'ok') }] : i === 1 && !err ? [{ name: force ? 'NFA_General_approved.pdf' : 'Approval_mail.msg', meta: '96 KB' }] : [] });
  }))] });

  var urns = UI.modal({ id: 'urns', title: 'Open', accent: 'Provisions', size: 'wide', body: [UI.p('Open provisions for ' + UI.esc(vend.name) + ' in BU ' + ci.bu + '. Select the one this invoice settles.', { muted: true }),
    UI.table({ dense: true, pager: false, export: false, select: true, columns: [{ key: 'u', label: 'URN' }, { key: 'm', label: 'Month' }, { key: 'a', label: 'Open balance (Rs)', num: true }, { key: 's', label: 'Status' }],
      rows: [{ u: '<span class="k-urn">' + ci.bu + '·' + f.v + '·' + (cid === 'legal' ? 'LEGAL007' : 'SECURITY001') + '·SEP-26</span>', m: 'Sep-26', a: UI.inr(Math.abs(f.base), 2), s: UI.status('Open'), _checked: !!f.urn, _sel: !!f.urn },
        { u: '<span class="k-urn">' + ci.bu + '·' + f.v + '·' + (cid === 'legal' ? 'LEGAL007' : 'SECURITY001') + '·AUG-26</span>', m: 'Aug-26', a: UI.inr(Math.abs(f.base), 2), s: UI.status('Open') }] })],
    foot: [UI.button({ label: 'Cancel', variant: 'text', close: true }), UI.button({ label: 'Link URN', variant: 'primary', close: true, toast: 'Provision linked to the invoice' })] });

  var submitted = UI.modal({ id: 'submitted', open: S === 'submitted', title: neg ? 'Credit note' : 'Invoice', accent: 'Submitted', size: 'narrow', body: [
    UI.kv({ cols: 2, items: [['Reference number', '<b>NPO-2627-004872</b>'], ['Status', INV.status('Submitted')], ['Category', UI.esc(c.name)], ['SLA', c.sla]] }),
    UI.p('Next: the invoice is validated and then ' + (force ? 'force approved against the NFA' : 'routed for approval under the DOA') + '. Only when all approvals are complete is it booked in the Oracle AP module, a barcode generated and the documents attached.', { muted: true })],
    foot: [UI.button({ label: 'Submit another', go: 'inv-03' }), UI.button({ label: 'Track invoice', variant: 'primary', go: 'inv-09' })] });

  var bar = UI.sticky({ left: [UI.textlink({ label: 'Generate total', icon: 'arrowRight', state: 'validated' })],
    totals: [['Taxable amount', UI.inr(f.base, 2)], ['Tax amount', UI.inr(tax, 2)], ['Grand total', UI.inr(total, 2)]],
    right: [UI.button({ label: 'Save', toast: 'Saved as draft' }), ok ? UI.button({ label: 'Submit invoice', variant: 'primary', state: 'submitted' }) : UI.button({ label: 'Validate invoice', variant: err ? 'disabled' : 'primary', state: err ? '' : 'validated' })] });

  Page.render({
    id: 'inv-05', roleId: 'vendor', navKey: 'inv-03',
    variants: { label: 'Category', param: 'cat', def: cid, items: APS.map(function (x) { return { id: x.id, label: x.name.replace(' (prepayment)', '').replace(' (right of way)', '').replace(' (incl. broadband)', '') }; }) },
    states: [{ id: 'errors', label: 'Validation errors' }, { id: 'validated', label: 'Validated' }, { id: 'submitted', label: 'Submitted' }],
    rail: { mode: 'form', title: 'Create Invoice', accent: 'Non-PO', back: partner ? 'inv-02' : 'inv-03', text: UI.esc(c.name) + ' &middot; approved on the portal (' + UI.esc(c.approval.toLowerCase()) + '), then booked document-wise in the Oracle EBS AP module.<br><br>Fields marked <span class="k-link">*</span> are mandatory. Incomplete invoices cannot be submitted.' },
    html: '<div class="k-src-on"><div class="k-legend-src"><span><i class="k-src green"></i>Entered by you</span><span><i class="k-src grey"></i>From master data (Oracle EBS / portal masters)</span><span><i class="k-src blue"></i>Read by OCR or calculated</span></div>' +
      head + onBehalf + checks + details + irn + amounts + urnSec + appr + book + docSec + bar + '</div>' + urns + submitted
  });
})();
</script>
